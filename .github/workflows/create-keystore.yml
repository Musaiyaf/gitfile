name: Create keystore (run once)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'gitfile'
      password:
        description: 'Password (store and key)'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate
        env:
          PW:    ${{ inputs.password }}
          ALIAS: ${{ inputs.alias }}
        run: |
          mkdir out
          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=gitfile, OU=, O=, L=, S=, C=IN"
          base64 -w0 out/release.keystore > out/KEYSTORE_B64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-THIS-SAFE
          path: out/
          retention-days: 1
