/* --- 6c. File tree ------------------------------------------ */
async function openRepo(repo){
  S.repo = repo;
  S.branch = repo.default_branch;
  S.path = '';
  S.file = null;
  pushRecent(repo.owner + '/' + repo.name);   // for the Recent list on the home screen

  // Can we write here? Repos from our own list carry permissions; ones reached
  // through Discover don't, so assume read-only until GitHub says otherwise.
  // Every write control is gated on this, so browsing a stranger's repo shows
  // no buttons that would only fail with a 403.
  S.canPush = repo.permissions ? !!repo.permissions.push : (repo.owner === (S.user && S.user.login));
  if (!repo.permissions) {
    api.repoInfo(repo.owner, repo.name).then(info => {
      const can = !!(info.permissions && info.permissions.push);
      if (can !== S.canPush) {
        S.canPush = can;
        if (S.view === 'tree') paintTreeBar();     // repaint now that we know
      }
    }).catch(() => {});
  }

  show('tree');
  await loadBranches();
  await loadTree('');
}

async function loadBranches(){
  const sel = $('branchsel');
  sel.innerHTML = `<option>${S.branch}</option>`;
  try {
    const bs = await api.branches(S.repo.owner, S.repo.name);
    sel.innerHTML = '';
    bs.forEach(b => {
      const o = document.createElement('option');
      o.value = o.textContent = b.name;
      o.selected = b.name === S.branch;
      sel.appendChild(o);
    });
  } catch { /* keep the single default option */ }
}

/* Switching branch re-reads the current directory on the new ref. */
$('branchsel').onchange = async (e) => {
  S.branch = e.target.value;
  await loadTree(S.path);
};

/* ── File and folder icons ────────────────────────────────────────────────
   GitHub shows a distinct icon per file type. With no colour to lean on, the
   distinction here is the glyph itself: a folder, a document, a picture frame,
   a gear for config, and so on. Extension-driven, with a few special-cased
   names GitHub also treats specially.
   ──────────────────────────────────────────────────────────────────────── */
// Only glyphs every Android system font reliably carries. The distinction is by
// class (colour/weight in CSS), not by inventing a symbol per language that then
// renders as a tofu box on half of devices.
const CFG_EXT = /^(json|ya?ml|toml|ini|env|properties|gradle|lock|cfg|conf)$/;
const IMG_EXT = /^(png|jpe?g|gif|webp|bmp|ico|avif|svg|heic)$/;
const DOC_EXT = /^(md|markdown|txt|rtf|pdf)$/;
const CFG_NAME = new Set(['.gitignore','.gitattributes','.editorconfig','dockerfile',
  'makefile','package.json','settings.gradle','build.gradle','gradle.properties']);

const ICON_DIR  = '<svg class="gi" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.5 3.25A1.25 1.25 0 0 1 2.75 2h3.19c.331 0 .649.132.883.366L8.06 3.5h5.19A1.25 1.25 0 0 1 14.5 4.75v8A1.25 1.25 0 0 1 13.25 14H2.75A1.25 1.25 0 0 1 1.5 12.75z"/></svg>';
const ICON_FILE = '<svg class="gi" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3.5 1.75A.75.75 0 0 1 4.25 1H9l4 4v9.25a.75.75 0 0 1-.75.75h-8a.75.75 0 0 1-.75-.75zM9 2.5V5h2.5z"/></svg>';
const ICON_IMG  = '<svg class="gi" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5.8" cy="6.6" r="1.1" fill="currentColor"/><path d="M3.5 12l3-3 2 2 2-2.2 2 2.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';

function fileGlyph(it){
  if (it.type === 'dir') return ICON_DIR;    // folder
  const n = it.name.toLowerCase();
  const ext = n.includes('.') ? n.split('.').pop() : '';
  if (IMG_EXT.test(ext)) return ICON_IMG;    // picture
  return ICON_FILE;                          // page — everything else
}

function fileClass(name){
  const n = name.toLowerCase();
  const ext = n.includes('.') ? n.split('.').pop() : '';
  if (IMG_EXT.test(ext)) return 'g-img';
  if (CFG_EXT.test(ext) || CFG_NAME.has(n)) return 'g-cfg';
  if (DOC_EXT.test(ext)) return 'g-doc';
  return 'g-file';
}

async function loadTree(path){
  S.path = path;
  S.file = null;
  paintRef();
  show('tree');
  paintCrumbs();
  paintTreeBar();

  const list = $('treelist');

  // Paint from cache immediately, so navigation feels instant. Then fetch and
  // repaint — the cache is a head start, never the final word.
  const cacheKey = 'gitfile:tree:' + S.repo.owner + '/' + S.repo.name + ':' + S.branch + ':' + path;
  let painted = false;
  try {
    const cached = await store.get(cacheKey);
    if (cached) { renderTree(JSON.parse(cached)); painted = true; }
  } catch { /* corrupt cache is not worth a crash */ }

  if (!painted) list.innerHTML = '<div class="empty">Loading…</div>';

  try {
    const items = await api.contents(S.repo.owner, S.repo.name, path, S.branch);

    // A path that is a file, not a directory — shouldn't happen from the UI.
    if (!Array.isArray(items)) { return openFile(path); }

    // Cache the fresh copy for next time (fire and forget).
    store.set(cacheKey, JSON.stringify(items)).catch(() => {});

    renderTree(items);
  } catch (e) {
    // Network failed. If we already showed the cache, keep it and say so
    // quietly; only error out if there was nothing to show.
    if (!painted) list.innerHTML = `<div class="empty">${e.message}</div>`;
    else toast('Showing a saved copy — could not reach GitHub.', 4000);
  }
}

/* The tree's action bar. "+ New" only exists where you can actually commit. */
function paintTreeBar(){
  const bar = [
    { label:'Repos',      onClick:openRepos },
    { label:'Go to file', onClick:gotoFileSheet },
    { label:'Repo',       onClick:repoSheet }
  ];
  if (S.canPush) bar.push({ label:'+ New', onClick:newSheet, solid:true, grow:true });
  else bar[bar.length - 1].solid = true, bar[bar.length - 1].grow = true;
  setBar(bar);
}

function renderTree(items){
  const list = $('treelist');

  if (!items.length) { list.innerHTML = '<div class="empty">Empty directory.</div>'; return; }

  // Directories first, then files. Both alphabetical.
  items = items.slice().sort((a, b) =>
    (a.type === b.type) ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1)
  );

  {
    list.innerHTML = '';
    if (!S.sel) S.sel = new Set();
    S.treeItems = items;                 // for the "All" button
    // Selection only makes sense within one directory; reset when we move.
    if (S.selPath !== S.path) { S.sel.clear(); S.selMode = false; S.selPath = S.path; }

    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'row' + (it.type === 'dir' ? ' dir' : '');

      // Checkboxes stay out of the way until you ask for them: long-press any
      // row (or use "Select" in its menu) to enter selection mode.
      const pick = S.canPush ? document.createElement('button') : null;
      if (pick) {
      pick.className = 'rowpick' + (S.sel.has(it.path) ? ' on' : '');
      pick.innerHTML = '<span class="box"></span>';
      pick.setAttribute('aria-label', 'Select ' + it.name);
      pick.onclick = e => {
        e.stopPropagation();
        toggleSel(it);
        pick.classList.toggle('on', S.sel.has(it.path));
        paintSelBar();
      };
      }

      const b = document.createElement('button');
      b.className = 'rowmain';
      b.innerHTML = `
        <span class="glyph ${it.type === 'dir' ? 'g-dir' : fileClass(it.name)}">${fileGlyph(it)}</span>
        <span class="name">${it.name}</span>
        <span class="meta">${it.type === 'dir' ? '' : bytes(it.size)}</span>`;
      b.onclick = () => {
        // While selecting, a tap toggles instead of navigating.
        if (S.selMode) { toggleSel(it); renderTree(items); return; }
        it.type === 'dir' ? loadTree(it.path) : openFile(it.path);
      };
      if (S.canPush) longPress(b, () => { S.selMode = true; toggleSel(it); renderTree(items); });

      const m = document.createElement('button');
      m.className = 'rowmenu';
      m.textContent = '⋯';
      m.setAttribute('aria-label', 'Actions for ' + it.name);
      m.onclick = () => rowMenu(it);

      if (pick && S.selMode) row.appendChild(pick);
      row.appendChild(b);
      if (S.canPush) row.appendChild(m);
      list.appendChild(row);
    });
    paintSelBar();
    paintCommitBar();
    paintReadme(items);
    if (!S.path) paintAbout();           // GitHub shows the About sidebar only at repo root
    else $('about').innerHTML = '';
  }
}

/* ── Batch actions on the selected rows ───────────────────────────────────
   The move engine already commits many paths at once, so selecting several
   files and moving or deleting them is one commit, not one per file. */

/* Long-press: the standard mobile way into selection mode. Fires after 500ms
   of holding still, and cancels if the finger moves (that's a scroll). */
function longPress(el, fn){
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(() => { timer = null; fn(); }, 500);
  }, { passive:true });
  el.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) cancel();
  }, { passive:true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  // Mouse equivalent, for the desktop view and browsers.
  el.addEventListener('contextmenu', e => { e.preventDefault(); fn(); });
}

function toggleSel(it){
  S.selItems = S.selItems || {};
  S.selItems[it.path] = it;
  if (S.sel.has(it.path)) S.sel.delete(it.path);
  else S.sel.add(it.path);
  if (!S.sel.size) S.selMode = false;      // last one deselected: leave the mode
}

function exitSel(){
  S.sel.clear();
  S.selMode = false;
  loadTree(S.path);
}

function paintSelBar(){
  const bar = $('selbar');
  if (!bar) return;
  const n = S.sel ? S.sel.size : 0;
  if (!S.selMode) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  bar.style.display = 'flex';
  bar.innerHTML = `
    <span class="selcount">${n} selected</span>
    <button class="btn small" id="sel-all">All</button>
    <button class="btn small" id="sel-move"${n ? '' : ' disabled'}>Move…</button>
    <button class="btn small danger" id="sel-del"${n ? '' : ' disabled'}>Delete</button>
    <button class="btn small" id="sel-none">Done</button>`;
  $('sel-none').onclick = exitSel;
  $('sel-all').onclick  = () => {
    (S.treeItems || []).forEach(it => { S.selItems[it.path] = it; S.sel.add(it.path); });
    renderTree(S.treeItems || []);
  };
  $('sel-move').onclick = () => { if (S.sel.size) selMoveSheet(); };
  $('sel-del').onclick  = () => { if (S.sel.size) selDelete(); };
}

function selectedItems(){
  return [...S.sel].map(p => (S.selItems || {})[p]).filter(Boolean);
}

function selMoveSheet(){
  const items = selectedItems();
  sheet('Move ' + items.length + ' item' + (items.length === 1 ? '' : 's'), `
    <p class="hint" style="margin-top:0">Destination folder. Leave it empty for the repository root; folders are created as needed.</p>
    <div class="field">
      <input type="text" id="sm-dest" placeholder="e.g. src/utils" value="${esc(S.path)}"
             spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">
    </div>
    <button class="btn solid wide" id="sm-go">Move</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => { $('sm-go').onclick = () => selDoMove(items, $('sm-dest').value.trim().replace(/^\/+|\/+$/g, '')); });
}

async function selDoMove(items, dest){
  const o = S.repo.owner, r = S.repo.name;
  const btn = $('sm-go');
  busy(btn, true, 'Moving…');
  try {
    const head = (await api.ref(o, r, S.branch)).object.sha;
    const root = (await api.commit(o, r, head)).tree.sha;
    const full = await api.treeRec(o, r, root);
    const entries = [];

    items.forEach(it => {
      if (it.type === 'dir') {
        const from = it.path + '/';
        full.tree.filter(n => n.type === 'blob' && n.path.startsWith(from)).forEach(n => {
          const to = (dest ? dest + '/' : '') + it.name + '/' + n.path.slice(from.length);
          if (to === n.path) return;
          entries.push({ path: to, sha: n.sha, mode: n.mode });
          entries.push({ path: n.path, delete: true });
        });
      } else {
        const node = full.tree.find(n => n.type === 'blob' && n.path === it.path);
        if (!node) return;
        const to = (dest ? dest + '/' : '') + it.name;
        if (to === node.path) return;
        entries.push({ path: to, sha: node.sha, mode: node.mode });
        entries.push({ path: node.path, delete: true });
      }
    });

    if (!entries.length) throw new Error('Everything is already at that path.');
    const moved = entries.filter(e => !e.delete).length;
    await commitFiles(entries, 'Move ' + moved + ' file' + (moved === 1 ? '' : 's') + ' to ' + (dest || 'root'));
    S.sel.clear();
    closeSheet();
    toast('Moved ' + moved + ' file' + (moved === 1 ? '' : 's'));
    await loadTree(S.path);
  } catch (e) {
    toast(e.message, 6000);
  } finally {
    busy(btn, false);
  }
}

async function selDelete(){
  const items = selectedItems();
  const names = items.map(i => i.name).join(', ');
  if (!confirm('Delete ' + items.length + ' item' + (items.length === 1 ? '' : 's') + '?\n\n' + names + '\n\nThis is committed to ' + S.branch + '.')) return;
  const o = S.repo.owner, r = S.repo.name;
  const btn = $('sel-del');
  busy(btn, true, 'Deleting…');
  try {
    const head = (await api.ref(o, r, S.branch)).object.sha;
    const root = (await api.commit(o, r, head)).tree.sha;
    const full = await api.treeRec(o, r, root);
    const entries = [];

    items.forEach(it => {
      if (it.type === 'dir') {
        const from = it.path + '/';
        full.tree.filter(n => n.type === 'blob' && n.path.startsWith(from))
          .forEach(n => entries.push({ path: n.path, delete: true }));
      } else {
        entries.push({ path: it.path, delete: true });
      }
    });

    if (!entries.length) throw new Error('Nothing to delete.');
    await commitFiles(entries, 'Delete ' + entries.length + ' file' + (entries.length === 1 ? '' : 's'));
    S.sel.clear();
    toast('Deleted ' + entries.length + ' file' + (entries.length === 1 ? '' : 's'));
    await loadTree(S.path);
  } catch (e) {
    toast(e.message, 6000);
  } finally {
    busy(btn, false);
  }
}

/* ── The commit bar across the top of the file table ──────────────────────
   GitHub shows the last commit that touched each individual file. There is no
   API that returns that in one call — it would be one request per row, and a
   twenty-file folder would burn twenty of the five thousand requests an hour.
   So this shows the latest commit touching THIS directory, which is one call
   and answers the question you usually have: how fresh is any of this.
   ──────────────────────────────────────────────────────────────────────── */
async function paintCommitBar(){
  const el = $('commitbar');
  el.innerHTML = '<span class="msg">Loading…</span>';
  try {
    const cs = await api.commits(S.repo.owner, S.repo.name, S.branch, S.path || null);
    if (!cs.length) { el.innerHTML = '<span class="msg">No commits yet.</span>'; return; }

    const c = cs[0];
    el.innerHTML = `
      <span class="who">${esc(c.author ? c.author.login : c.commit.author.name)}</span>
      <span class="msg">${esc(c.commit.message.split('\n')[0])}</span>
      <span class="cistate" id="cistate"></span>
      <span class="when">${c.sha.slice(0, 7)} · ${ago(c.commit.author.date)}</span>`;

    // The combined CI status for this commit — a check, a cross, or a dot.
    api.commitStatus(S.repo.owner, S.repo.name, c.sha).then(st => {
      const dot = $('cistate');
      if (!dot || !st || !st.total_count) return;
      const map = { success:['●', 'var(--green-fg)'], failure:['●', 'var(--red)'],
                    error:['●', 'var(--red)'], pending:['●', '#d29922'] };
      const m = map[st.state];
      if (m) { dot.textContent = m[0]; dot.style.color = m[1]; dot.title = 'CI: ' + st.state; }
    }).catch(() => {});
  } catch {
    el.innerHTML = '';   // a missing commit bar is better than an error in it
  }
}

/* GitHub renders the README under the file list. So does this. */
async function paintReadme(items){
  const box = $('readme');
  box.innerHTML = '';

  const rm = items.find(i => i.type === 'file' && /^readme(\.md|\.markdown)?$/i.test(i.name));
  if (!rm) return;

  try {
    const f = await api.contents(S.repo.owner, S.repo.name, rm.path, S.branch);
    if (!f.content) return;
    box.innerHTML = `
      <div class="readme">
        <div class="rhead">▤ ${esc(rm.name)}</div>
        <div class="md">${markdown(b64decode(f.content))}</div>
      </div>`;
  } catch { /* a README that won't load is not worth an error */ }
}

/* ── About: everything GitHub shows in the repo sidebar ───────────────────
   Description, topics, homepage, the star / watch / fork counts, licence,
   a proportional languages bar, the latest release and the contributors.
   One small fan-out of API calls, cached per repo for the session so walking
   in and out of folders never refetches. Painted only at the repo root. */
const LANG_COLORS = {
  JavaScript:'#f1e05a', TypeScript:'#3178c6', HTML:'#e34c26', CSS:'#563d7c',
  Python:'#3572A5', Java:'#b07219', Kotlin:'#A97BFF', C:'#555555', 'C++':'#f34b7d',
  'C#':'#178600', Go:'#00ADD8', Rust:'#dea584', Ruby:'#701516', PHP:'#4F5D95',
  Swift:'#F05138', Shell:'#89e051', Dart:'#00B4AB', Vue:'#41b883', SCSS:'#c6538c',
  'Objective-C':'#438eff', Makefile:'#427819', Dockerfile:'#384d54', Lua:'#000080',
  'Jupyter Notebook':'#DA5B0B', Markdown:'#083fa1'
};
const langColor = n => LANG_COLORS[n] || '#8b949e';

let ABOUT = { key: null, html: null };   // one-slot session cache

async function paintAbout(){
  const box = $('about');
  if (!box) return;
  const key = S.repo.owner + '/' + S.repo.name;

  // Reuse this session's render if we already built it for this repo.
  if (ABOUT.key === key && ABOUT.html) { box.innerHTML = ABOUT.html; wireAbout(); return; }
  box.innerHTML = '<div class="about"><div class="rhead">About</div>'
                + '<div class="abbody"><span class="muted">Loading…</span></div></div>';

  // Fan out. Any one call failing just drops its own section.
  const [info, langs, contribs, rels] = await Promise.all([
    api.repoInfo(S.repo.owner, S.repo.name).catch(() => S.repo || {}),
    api.languages(S.repo.owner, S.repo.name).catch(() => ({})),
    api.contributors(S.repo.owner, S.repo.name).catch(() => []),
    api.releases(S.repo.owner, S.repo.name).catch(() => [])
  ]);

  const num = n => (n || 0).toLocaleString();
  const total = Object.values(langs).reduce((a, b) => a + b, 0);
  const langRows = Object.entries(langs)
    .sort((a, b) => b[1] - a[1])
    .map(([name, n]) => ({ name, pct: total ? (n / total) * 100 : 0 }));

  const topics = info.topics || [];
  const lic = info.license && info.license.spdx_id && info.license.spdx_id !== 'NOASSERTION'
    ? info.license.spdx_id
    : (info.license && info.license.name) || null;
  const latest = (Array.isArray(rels) ? rels : []).find(r => !r.draft && !r.prerelease)
              || (Array.isArray(rels) ? rels[0] : null);
  const relCount = Array.isArray(rels) ? rels.length : 0;
  const avatar = c => c.avatar_url + (c.avatar_url.includes('?') ? '&' : '?') + 's=64';

  const html = `
    <div class="about">
      <div class="rhead">About</div>
      <div class="abbody">
        ${info.description ? `<div class="desc">${esc(info.description)}</div>`
                           : `<div class="desc muted">No description, website, or topics provided.</div>`}
        ${info.homepage ? `<a class="ablink" href="${esc(info.homepage)}" target="_blank" rel="noopener">${esc(info.homepage)}</a>` : ''}
        ${topics.length ? `<div class="topics">${topics.map(t => `<span class="topic">${esc(t)}</span>`).join('')}</div>` : ''}

        <div class="abstats">
          <span><b>${num(info.stargazers_count)}</b> stars</span>
          <span><b>${num(info.subscribers_count)}</b> watching</span>
          <span><b>${num(info.forks_count)}</b> forks</span>
        </div>

        <div id="ab-forkinfo"></div>

        <div class="abacts">
          <button class="btn small" id="ab-star">Star</button>
          <button class="btn small" id="ab-watch">Watch</button>
          <button class="btn small" id="ab-fork">Fork</button>
        </div>

        <div class="abmeta">
          ${lic ? `<div>${esc(lic)} license</div>` : ''}
          <div>${num(info.open_issues_count)} open issue${info.open_issues_count === 1 ? '' : 's'} &amp; PRs</div>
          <div>Updated ${info.pushed_at ? ago(info.pushed_at) + ' ago' : '—'}</div>
        </div>

        ${langRows.length ? `
          <div class="absec">Languages</div>
          <div class="langbar">${langRows.map(l =>
            `<span class="langseg" style="width:${l.pct}%;background:${langColor(l.name)}"></span>`).join('')}</div>
          <div class="langlegend">${langRows.map(l =>
            `<span class="langitem"><i style="background:${langColor(l.name)}"></i>${esc(l.name)} <b>${l.pct.toFixed(1)}%</b></span>`).join('')}</div>`
          : ''}

        <div class="absec">Releases</div>
        ${latest
          ? `<button class="abrelease" id="ab-rel">
               <span class="tag">${esc(latest.tag_name)}</span>
               <span class="rl">${relCount} release${relCount === 1 ? '' : 's'}${latest.published_at ? ' · latest ' + ago(latest.published_at) + ' ago' : ''}</span>
             </button>`
          : `<div class="muted">No releases published.</div>`}

        ${Array.isArray(contribs) && contribs.length ? `
          <div class="absec">Contributors · ${contribs.length}</div>
          <div class="contribs">${contribs.slice(0, 24).map(c =>
            `<img class="contrib" src="${esc(avatar(c))}" alt="${esc(c.login)}" title="${esc(c.login)}" loading="lazy">`).join('')}</div>`
          : ''}
      </div>
    </div>`;

  ABOUT = { key, html };
  S.forkOf = (info.fork && info.parent)
    ? { owner: info.parent.owner.login, name: info.parent.name, branch: info.parent.default_branch }
    : null;
  box.innerHTML = html;
  wireAbout();
}

/* The one interactive element in the panel: the release row opens Releases. */
function wireAbout(){
  const rel = $('ab-rel');
  if (rel) rel.onclick = openReleases;

  // Star / unstar toggle. Checks current state, then flips it on tap.
  const sb = $('ab-star');
  if (sb) {
    api.isStarred(S.repo.owner, S.repo.name)
      .then(() => { sb.textContent = 'Unstar'; sb.dataset.on = '1'; })
      .catch(() => { sb.textContent = 'Star';   sb.dataset.on = '';  });
    sb.onclick = async () => {
      const on = sb.dataset.on === '1';
      sb.disabled = true;
      try {
        if (on) { await api.unstar(S.repo.owner, S.repo.name); sb.textContent = 'Star';   sb.dataset.on = '';  toast('Unstarred'); }
        else    { await api.star(S.repo.owner, S.repo.name);   sb.textContent = 'Unstar'; sb.dataset.on = '1'; toast('Starred'); }
        ABOUT = { key: null, html: null };   // invalidate cache so the count refreshes next open
      } catch (e) { toast(e.message, 5000); }
      finally { sb.disabled = false; }
    };
  }

  // Watch / unwatch — the notification subscription, GitHub's sibling to Star.
  const wb = $('ab-watch');
  if (wb) {
    api.isWatching(S.repo.owner, S.repo.name)
      .then(s => { const on = s && s.subscribed; wb.textContent = on ? 'Unwatch' : 'Watch'; wb.dataset.on = on ? '1' : ''; })
      .catch(() => { wb.textContent = 'Watch'; wb.dataset.on = ''; });
    wb.onclick = async () => {
      const on = wb.dataset.on === '1';
      wb.disabled = true;
      try {
        if (on) { await api.unwatch(S.repo.owner, S.repo.name); wb.textContent = 'Watch';   wb.dataset.on = '';  toast('Not watching'); }
        else    { await api.watch(S.repo.owner, S.repo.name);   wb.textContent = 'Unwatch'; wb.dataset.on = '1'; toast('Watching'); }
      } catch (e) { toast(e.message, 5000); }
      finally { wb.disabled = false; }
    };
  }

  // Fork — what you want the moment someone else's repo turns out to be useful.
  const fb = $('ab-fork');
  if (fb) fb.onclick = forkSheet;

  paintForkStatus();
}

/* ── Fork status: how far behind upstream, and a one-tap sync ─────────────
   A fork goes stale as soon as the original moves on. GitHub compares the two
   for us, and merge-upstream fast-forwards the branch without any local git. */
async function paintForkStatus(){
  const box = $('ab-forkinfo');
  if (!box) return;
  const p = S.forkOf;
  if (!p) { box.innerHTML = ''; return; }

  box.innerHTML = `<div class="forkinfo">Forked from <b>${esc(p.owner + '/' + p.name)}</b><br><span class="dim">checking…</span></div>`;
  try {
    // Compare upstream's default branch against this fork's current branch.
    const cmp = await api.compare(p.owner, p.name, p.branch, S.repo.owner + ':' + S.branch);
    const behind = cmp.behind_by || 0, ahead = cmp.ahead_by || 0;
    const parts = [];
    if (ahead)  parts.push(ahead + ' ahead');
    if (behind) parts.push(behind + ' behind');
    box.innerHTML = `
      <div class="forkinfo">
        Forked from <b>${esc(p.owner + '/' + p.name)}</b><br>
        <span class="dim">${esc(S.branch)} is ${parts.length ? parts.join(', ') : 'in sync'}</span>
        ${behind && S.canPush ? '<div style="height:8px"></div><button class="btn small" id="ab-sync">Sync fork</button>' : ''}
      </div>`;
    const sb = $('ab-sync');
    if (sb) sb.onclick = async () => {
      busy(sb, true, 'Syncing…');
      try {
        const res = await api.mergeUpstream(S.repo.owner, S.repo.name, S.branch);
        toast(res && res.merge_type === 'none'
          ? 'Already up to date.'
          : 'Synced with ' + p.owner + '/' + p.name, 5000);
        ABOUT = { key:null, html:null };      // counts changed
        await loadTree(S.path);
      } catch (e) {
        busy(sb, false);
        toast(e.status === 409
          ? 'Sync conflicts with your changes — merge it on github.com.'
          : e.message, 7000);
      }
    };
  } catch {
    box.innerHTML = `<div class="forkinfo">Forked from <b>${esc(p.owner + '/' + p.name)}</b></div>`;
  }
}

/* Fork a repository into your own account. GitHub builds forks asynchronously,
   so the copy can take a few seconds to become browsable — hence the pause
   before opening it rather than jumping straight in. */
function forkSheet(){
  const o = S.repo.owner, r = S.repo.name;
  sheet('Fork ' + r, `
    <p class="hint" style="margin-top:0">Creates your own copy of <b>${esc(o + '/' + r)}</b> under <b>${esc((S.user && S.user.login) || 'your account')}</b>. You can commit to a fork even where you can't commit here.</p>
    <label class="check"><input type="checkbox" id="fk-default" checked><span class="box"></span> Default branch only</label>
    <div style="height:14px"></div>
    <button class="btn solid wide" id="fk-go">Create fork</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('fk-go').onclick = async () => {
      const btn = $('fk-go'); busy(btn, true, 'Forking…');
      try {
        const f = await api.fork(o, r, { default_branch_only: $('fk-default').checked });
        closeSheet();
        toast('Fork created — GitHub is still copying it.', 5000);
        setTimeout(() => {
          openRepo({ owner: f.owner.login, name: f.name,
                     default_branch: f.default_branch || 'main',
                     private: f.private, permissions: { push: true } })
            .catch(() => toast('Fork created. It will appear in your repositories.', 5000));
        }, 2500);
      } catch (e) {
        busy(btn, false);
        toast(e.status === 403 ? 'Your token needs Administration (Read and write) to fork.' : e.message, 7000);
      }
    };
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   INSIGHTS · SECURITY · PROJECTS
   The three tabs GitHub keeps beside the code. Each is a hub with the same
   sub-sections the website has, drawn from whatever the API will give us —
   and honest about the pieces GitHub simply doesn't expose.
   ═══════════════════════════════════════════════════════════════════════ */

const _n = x => (x == null ? '—' : Number(x).toLocaleString());

/* A tiny inline bar chart: no library, just divs sized by share of the max. */
function sparkBars(values, colorFor){
  const max = Math.max(1, ...values.map(v => Math.abs(v)));
  return `<div class="spark">${values.map((v, i) =>
    `<i style="height:${Math.max(2, Math.round(Math.abs(v) / max * 100))}%;background:${colorFor ? colorFor(v, i) : 'var(--accent)'}"></i>`
  ).join('')}</div>`;
}

function hubNav(items, active){
  return `<div class="hubnav">${items.map(i =>
    `<button class="hubtab ${i.id === active ? 'on' : ''}" data-h="${i.id}">${esc(i.label)}</button>`).join('')}</div>`;
}

/* ── Insights ─────────────────────────────────────────────────────────────*/
const INSIGHT_SECTIONS = [
  { id:'pulse',     label:'Pulse' },
  { id:'contrib',   label:'Contributors' },
  { id:'community', label:'Community' },
  { id:'traffic',   label:'Traffic' },
  { id:'commits',   label:'Commits' },
  { id:'freq',      label:'Code frequency' },
  { id:'deps',      label:'Dependency graph' },
  { id:'forks',     label:'Forks' }
];

async function openInsights(section){
  show('insights');
  const sec = section || 'pulse';
  const v = $('v-insights');
  v.innerHTML = `<h1 style="padding-left:0">Insights</h1>${hubNav(INSIGHT_SECTIONS, sec)}<div id="ins-body"><div class="empty">Loading…</div></div>`;
  setBar([{ label:'Back', onClick:() => loadTree(S.path), solid:true }]);
  v.querySelectorAll('.hubtab').forEach(b => b.onclick = () => openInsights(b.dataset.h));

  const box = $('ins-body');
  const o = S.repo.owner, r = S.repo.name;
  try {
    if (sec === 'pulse')          await insPulse(box, o, r);
    else if (sec === 'contrib')   await insContributors(box, o, r);
    else if (sec === 'community') await insCommunity(box, o, r);
    else if (sec === 'traffic')   await insTraffic(box, o, r);
    else if (sec === 'commits')   await insCommits(box, o, r);
    else if (sec === 'freq')      await insFrequency(box, o, r);
    else if (sec === 'deps')      await insDeps(box, o, r);
    else if (sec === 'forks')     await insForks(box, o, r);
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function insPulse(box, o, r){
  const since = new Date(Date.now() - 7 * 864e5).toISOString();
  const [commits, part, prs, issues] = await Promise.all([
    gh(`/repos/${o}/${r}/commits?since=${since}&per_page=100`).catch(() => []),
    api.participation(o, r).catch(() => null),
    gh(`/search/issues?q=${encodeURIComponent(`repo:${o}/${r} is:pr updated:>${since.slice(0,10)}`)}&per_page=1`).catch(() => null),
    gh(`/search/issues?q=${encodeURIComponent(`repo:${o}/${r} is:issue updated:>${since.slice(0,10)}`)}&per_page=1`).catch(() => null)
  ]);
  const authors = new Set(commits.map(c => (c.author && c.author.login) || (c.commit.author && c.commit.author.name)));
  box.innerHTML = `
    <p class="hint" style="margin-top:0">Activity in the last 7 days.</p>
    <div class="trow"><span class="tk">Commits</span><span class="tv">${_n(commits.length)}</span></div>
    <div class="trow"><span class="tk">Authors</span><span class="tv">${_n(authors.size)}</span></div>
    <div class="trow"><span class="tk">Pull requests touched</span><span class="tv">${prs ? _n(prs.total_count) : '—'}</span></div>
    <div class="trow"><span class="tk">Issues touched</span><span class="tv">${issues ? _n(issues.total_count) : '—'}</span></div>
    ${part && part.all ? `<div class="absec">Commits per week · last year</div>${sparkBars(part.all)}` : ''}
    ${commits.length ? `<div class="absec">Recent commits</div>` + commits.slice(0, 12).map(c =>
      `<div class="setrow"><div class="lbl">${esc(c.commit.message.split('\n')[0])}</div>
       <div class="desc">${esc((c.author && c.author.login) || c.commit.author.name)} · ${ago(c.commit.author.date)} ago</div></div>`).join('') : ''}`;
}

async function insContributors(box, o, r){
  const list = await api.contributors(o, r);
  if (!list.length) { box.innerHTML = '<div class="empty">No contributors listed.</div>'; return; }
  const max = Math.max(...list.map(c => c.contributions));
  box.innerHTML = list.map(c => `
    <div class="setrow">
      <div style="display:flex;align-items:center;gap:10px">
        <img class="contrib" src="${esc(c.avatar_url)}&s=64" alt="">
        <div style="flex:1;min-width:0">
          <div class="lbl">${esc(c.login)}</div>
          <div class="desc">${_n(c.contributions)} commits</div>
          <div class="minibar"><i style="width:${Math.round(c.contributions / max * 100)}%"></i></div>
        </div>
      </div>
    </div>`).join('');
}

async function insCommunity(box, o, r){
  const p = await api.community(o, r);
  const f = p.files || {};
  const row = (label, present, url) =>
    `<div class="trow"><span class="tk">${label}</span><span class="tv">${
      present ? (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">present</a>` : 'present') : 'missing'
    }</span></div>`;
  box.innerHTML = `
    <div class="trow"><span class="tk">Health score</span><span class="tv">${_n(p.health_percentage)}%</span></div>
    ${row('README', f.readme, f.readme && f.readme.html_url)}
    ${row('License', f.license, f.license && f.license.html_url)}
    ${row('Contributing', f.contributing, f.contributing && f.contributing.html_url)}
    ${row('Code of conduct', f.code_of_conduct, f.code_of_conduct && f.code_of_conduct.html_url)}
    ${row('Security policy', f.security, f.security && f.security.html_url)}
    ${row('Issue template', f.issue_template, f.issue_template && f.issue_template.html_url)}
    ${row('PR template', f.pull_request_template, f.pull_request_template && f.pull_request_template.html_url)}
    <p class="hint">A higher score just means more of these files exist — GitHub uses it as a checklist, not a judgement.</p>`;
}

async function insTraffic(box, o, r){
  const [v, c, paths, refs] = await Promise.all([
    api.trafficViews(o, r).catch(() => null),
    api.trafficClones(o, r).catch(() => null),
    api.trafficPaths(o, r).catch(() => []),
    api.trafficRefs(o, r).catch(() => [])
  ]);
  if (!v && !c) { box.innerHTML = '<div class="empty">Traffic needs push access on this repository.</div>'; return; }
  box.innerHTML = `
    <p class="hint" style="margin-top:0">Last 14 days.</p>
    <div class="trow"><span class="tk">Views</span><span class="tv">${v ? _n(v.count) + ' · ' + _n(v.uniques) + ' unique' : '—'}</span></div>
    ${v && v.views ? sparkBars(v.views.map(d => d.count)) : ''}
    <div class="trow"><span class="tk">Clones</span><span class="tv">${c ? _n(c.count) + ' · ' + _n(c.uniques) + ' unique' : '—'}</span></div>
    ${c && c.clones ? sparkBars(c.clones.map(d => d.count), () => 'var(--green-fg)') : ''}
    ${paths.length ? '<div class="absec">Popular content</div>' + paths.map(p =>
      `<div class="trow"><span class="tk" style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(p.path)}</span><span class="tv">${_n(p.count)}</span></div>`).join('') : ''}
    ${refs.length ? '<div class="absec">Referring sites</div>' + refs.map(p =>
      `<div class="trow"><span class="tk">${esc(p.referrer)}</span><span class="tv">${_n(p.count)}</span></div>`).join('') : ''}`;
}

async function insCommits(box, o, r){
  const weeks = await api.commitActivity(o, r);
  if (!weeks || !weeks.length) { box.innerHTML = '<div class="empty">GitHub is still computing these statistics. Try again shortly.</div>'; return; }
  const total = weeks.reduce((a, w) => a + w.total, 0);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const perDay = [0,0,0,0,0,0,0];
  weeks.forEach(w => w.days.forEach((n, i) => perDay[i] += n));
  box.innerHTML = `
    <div class="trow"><span class="tk">Commits · last year</span><span class="tv">${_n(total)}</span></div>
    <div class="absec">Per week</div>
    ${sparkBars(weeks.map(w => w.total))}
    <div class="absec">By day of week</div>
    ${perDay.map((n, i) => `<div class="trow"><span class="tk">${days[i]}</span><span class="tv">${_n(n)}</span></div>`).join('')}`;
}

async function insFrequency(box, o, r){
  const rows = await api.codeFrequency(o, r);
  if (!rows || !rows.length) { box.innerHTML = '<div class="empty">GitHub is still computing these statistics. Try again shortly.</div>'; return; }
  const adds = rows.reduce((a, w) => a + w[1], 0);
  const dels = rows.reduce((a, w) => a + w[2], 0);
  box.innerHTML = `
    <div class="trow"><span class="tk">Lines added</span><span class="tv" style="color:var(--green-fg)">+${_n(adds)}</span></div>
    <div class="trow"><span class="tk">Lines removed</span><span class="tv" style="color:var(--red)">-${_n(Math.abs(dels))}</span></div>
    <div class="absec">Additions per week</div>
    ${sparkBars(rows.map(w => w[1]), () => 'var(--green-fg)')}
    <div class="absec">Deletions per week</div>
    ${sparkBars(rows.map(w => Math.abs(w[2])), () => 'var(--red)')}`;
}

async function insDeps(box, o, r){
  try {
    const res = await api.sbom(o, r);
    const pkgs = (res.sbom && res.sbom.packages) || [];
    if (!pkgs.length) { box.innerHTML = '<div class="empty">No dependencies detected.</div>'; return; }
    box.innerHTML = `<div class="trow"><span class="tk">Packages</span><span class="tv">${_n(pkgs.length)}</span></div>`
      + pkgs.slice(0, 100).map(p =>
        `<div class="trow"><span class="tk" style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(p.name || '')}</span><span class="tv">${esc(p.versionInfo || '')}</span></div>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.status === 404
      ? 'The dependency graph is off for this repository. Enable it in Settings on github.com.'
      : e.message)}</div>`;
  }
}

async function insForks(box, o, r){
  const forks = await api.forks(o, r);
  if (!forks.length) { box.innerHTML = '<div class="empty">No forks yet.</div>'; return; }
  box.innerHTML = `<p class="hint" style="margin-top:0">${_n(forks.length)} fork${forks.length === 1 ? '' : 's'}. Tap one to browse it.</p>`
    + `<div class="filebox">${forks.map((f, i) => `
      <button class="rowmain" data-f="${i}" style="width:100%;border-top:1px solid var(--border)">
        <span class="body" style="flex:1;min-width:0;text-align:left">
          <span class="name">${esc(f.full_name)}</span>
          <span class="sub" style="display:block;color:var(--fg-subtle);font-size:11px;font-family:var(--mono)">${_n(f.stargazers_count)} stars · updated ${ago(f.updated_at)} ago</span>
        </span>
      </button>`).join('')}</div>`;
  box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const f = forks[+b.dataset.f];
    openRepo({ owner: f.owner.login, name: f.name, default_branch: f.default_branch || 'main', private: f.private });
  });
}

/* ── Security and quality ─────────────────────────────────────────────────*/
const SEC_SECTIONS = [
  { id:'overview',  label:'Overview' },
  { id:'dependabot',label:'Dependabot' },
  { id:'scanning',  label:'Code scanning' },
  { id:'secrets',   label:'Secret scanning' },
  { id:'policy',    label:'Security policy' },
  { id:'advisories',label:'Advisories' }
];

async function openSecurity(section){
  show('security');
  const sec = section || 'overview';
  const v = $('v-security');
  v.innerHTML = `<h1 style="padding-left:0">Security</h1>${hubNav(SEC_SECTIONS, sec)}<div id="sec-body"><div class="empty">Loading…</div></div>`;
  setBar([{ label:'Back', onClick:() => loadTree(S.path), solid:true }]);
  v.querySelectorAll('.hubtab').forEach(b => b.onclick = () => openSecurity(b.dataset.h));

  const box = $('sec-body');
  const o = S.repo.owner, r = S.repo.name;
  try {
    if (sec === 'overview')        await secOverview(box, o, r);
    else if (sec === 'dependabot') await secAlerts(box, o, r, 'dependabot');
    else if (sec === 'scanning')   await secAlerts(box, o, r, 'scanning');
    else if (sec === 'secrets')    await secAlerts(box, o, r, 'secrets');
    else if (sec === 'policy')     await secPolicy(box, o, r);
    else if (sec === 'advisories') await secAdvisories(box, o, r);
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function secOverview(box, o, r){
  const [prof, vuln, dep, scan] = await Promise.all([
    api.community(o, r).catch(() => ({ files:{} })),
    api.vulnEnabled(o, r).then(() => true).catch(() => false),
    api.dependabotAlerts(o, r).catch(e => e),
    api.codeScanAlerts(o, r).catch(e => e)
  ]);
  const count = x => Array.isArray(x) ? x.length + ' open' : 'unavailable';
  box.innerHTML = `
    <div class="setrow">
      <div class="lbl">Security policy</div>
      <div class="desc">${prof.files && prof.files.security ? 'Present — SECURITY.md defines how to report vulnerabilities' : 'Disabled — no SECURITY.md in this repository'}</div>
      ${!(prof.files && prof.files.security) && S.canPush ? '<div style="height:8px"></div><button class="btn small" id="sec-add">Create SECURITY.md</button>' : ''}
    </div>
    <div class="setrow">
      <div class="lbl">Dependabot alerts</div>
      <div class="desc">${vuln ? 'Enabled · ' + count(dep) : 'Disabled — this is why the Dependabot tab is empty'}</div>
      ${S.canPush ? `<div style="height:8px"></div><button class="btn small" id="sec-vuln">${vuln ? 'Disable' : 'Enable'} Dependabot alerts</button>` : ''}
    </div>
    <div class="setrow">
      <div class="lbl">Code scanning alerts</div>
      <div class="desc">${Array.isArray(scan) ? count(scan) : 'Unavailable — Advanced Security is only offered on organisation and public repositories'}</div>
    </div>
    <p class="hint">Dependabot and code scanning are repository features, not token settings — a permission alone will not switch them on.</p>`;
  if ($('sec-vuln')) $('sec-vuln').onclick = async () => {
    try {
      if (vuln) { await gh(`/repos/${o}/${r}/vulnerability-alerts`, { method:'DELETE' }); toast('Dependabot alerts disabled'); }
      else      { await api.enableVuln(o, r); toast('Dependabot alerts enabled'); }
      openSecurity('overview');
    } catch (e) { toast(e.message, 6000); }
  };
  if ($('sec-add')) $('sec-add').onclick = () => addSecurityPolicy();
}

async function secAlerts(box, o, r, kind){
  const call = kind === 'dependabot' ? api.dependabotAlerts
             : kind === 'scanning'   ? api.codeScanAlerts
             : api.secretScanAlerts;
  try {
    const alerts = await call(o, r);
    if (!alerts.length) { box.innerHTML = '<div class="empty">No open alerts.</div>'; return; }
    box.innerHTML = alerts.map(a => {
      const sev = (a.security_advisory && a.security_advisory.severity)
               || (a.rule && a.rule.severity) || a.secret_type || 'alert';
      const title = (a.security_advisory && a.security_advisory.summary)
                 || (a.rule && a.rule.description) || a.secret_type_display_name || 'Alert';
      const where = (a.dependency && a.dependency.package && a.dependency.package.name)
                 || (a.most_recent_instance && a.most_recent_instance.location && a.most_recent_instance.location.path)
                 || '';
      return `<div class="setrow">
        <div class="lbl">${esc(title)}</div>
        <div class="desc">${esc(String(sev))}${where ? ' · ' + esc(where) : ''}</div>
        ${a.html_url ? `<div style="height:6px"></div><a class="ablink" href="${esc(a.html_url)}" target="_blank" rel="noopener">Open on GitHub</a>` : ''}
      </div>`;
    }).join('');
  } catch (e) {
    // These almost never fail for the reason people assume. A 403 here usually
    // means the feature is switched off for the repository, not that the token
    // is wrong — so show GitHub's own words, then say what actually fixes it.
    const msg = e.message || '';
    const off = /disabled|not enabled|must be enabled|advanced security/i.test(msg);
    let fix = '';
    if (kind === 'dependabot') {
      fix = off || e.status === 403 || e.status === 404
        ? 'Dependabot alerts are switched off for this repository. Turn them on in the <b>Overview</b> tab here, or on github.com under Settings → Advanced Security.'
        : 'If this persists, add the <b>Dependabot alerts</b> permission (Read) to your token.';
    } else if (kind === 'scanning') {
      fix = 'Code scanning needs GitHub Advanced Security, which is only available on organisation-owned and public repositories — not private personal ones. No token permission will change this.';
    } else {
      fix = 'Secret scanning is available on public repositories, and on private ones only with Advanced Security. If this repo is public, add the <b>Secret scanning alerts</b> permission (Read) to your token.';
    }
    box.innerHTML = `<div class="empty" style="text-align:left">
        <div style="color:var(--fg-muted);margin-bottom:10px">${esc(msg)}</div>
        <div>${fix}</div>
      </div>`;
  }
}

async function secPolicy(box, o, r){
  try {
    const f = await api.contents(o, r, 'SECURITY.md', S.branch);
    box.innerHTML = `<div class="md">${markdown(b64decode(f.content))}</div>`;
  } catch {
    box.innerHTML = `<div class="empty">No SECURITY.md in this repository.</div>`
      + (S.canPush ? '<div style="height:12px"></div><button class="btn solid wide" id="sp-add">Create SECURITY.md</button>' : '');
    if ($('sp-add')) $('sp-add').onclick = () => addSecurityPolicy();
  }
}

function addSecurityPolicy(){
  const tpl = `# Security Policy\n\n## Supported versions\n\n| Version | Supported |\n| --- | --- |\n| latest | yes |\n\n## Reporting a vulnerability\n\nPlease report security issues privately by opening a draft security advisory\non this repository, rather than a public issue.\n`;
  sheet('Create SECURITY.md', `
    <div class="field"><textarea id="sp-body" rows="10" spellcheck="false">${esc(tpl)}</textarea></div>
    <button class="btn solid wide" id="sp-go">Commit SECURITY.md</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('sp-go').onclick = async () => {
      const btn = $('sp-go'); busy(btn, true, 'Committing…');
      try {
        await commitFiles([{ path:'SECURITY.md', b64: b64encode($('sp-body').value) }], 'Add security policy');
        closeSheet(); toast('SECURITY.md created'); openSecurity('policy');
      } catch (e) { busy(btn, false); toast(e.message, 6000); }
    };
  });
}

async function secAdvisories(box, o, r){
  try {
    const list = await api.advisories(o, r);
    if (!list.length) { box.innerHTML = '<div class="empty">No security advisories.</div>'; return; }
    box.innerHTML = list.map(a => `
      <div class="setrow">
        <div class="lbl">${esc(a.summary || a.ghsa_id)}</div>
        <div class="desc">${esc(a.severity || '')} · ${esc(a.state || '')}</div>
        ${a.html_url ? `<div style="height:6px"></div><a class="ablink" href="${esc(a.html_url)}" target="_blank" rel="noopener">Open on GitHub</a>` : ''}
      </div>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty" style="text-align:left">
      <div style="color:var(--fg-muted);margin-bottom:10px">${esc(e.message || '')}</div>
      <div>Repository security advisories are for publishing CVEs about your own project. They aren't available on private repositories — make the repo public, or draft one on github.com under the Security tab.</div>
    </div>`;
  }
}

/* ── Projects (v2) ────────────────────────────────────────────────────────*/
async function openProjects(){
  show('projects');
  const v = $('v-projects');
  v.innerHTML = `<h1 style="padding-left:0">Projects</h1><div class="empty">Loading…</div>`;
  setBar([{ label:'Back', onClick:() => loadTree(S.path), solid:true }]);
  try {
    const res = await api.repoProjects(S.repo.owner, S.repo.name);
    if (res.errors && res.errors.length) throw new Error(res.errors[0].message);
    const node = res.data && res.data.repository && res.data.repository.projectsV2;
    const list = (node && node.nodes) || [];

    // Also offer your own projects — a repo often has none linked, but you do.
    let mine = [];
    try {
      const m = await api.myProjects((S.user && S.user.login) || '');
      mine = (m.data && m.data.user && m.data.user.projectsV2 && m.data.user.projectsV2.nodes) || [];
    } catch {}

    const card = (p, i, src) => `
      <button class="rowmain" data-p="${i}" data-src="${src}" style="width:100%;border-top:1px solid var(--border)">
        <span class="body" style="flex:1;min-width:0;text-align:left">
          <span class="name">${esc(p.title)}${p.closed ? ' · closed' : ''}</span>
          ${p.shortDescription ? `<span class="sub" style="display:block;color:var(--fg-muted);font-size:11px">${esc(p.shortDescription)}</span>` : ''}
          <span class="sub" style="display:block;color:var(--fg-subtle);font-size:11px;font-family:var(--mono)">#${p.number} · ${_n(p.items && p.items.totalCount)} items · updated ${ago(p.updatedAt)} ago</span>
        </span>
      </button>`;

    v.innerHTML = `<h1 style="padding-left:0">Projects</h1>`
      + (list.length ? `<div class="listhead">Linked to this repository</div><div class="filebox">${list.map((p, i) => card(p, i, 'repo')).join('')}</div>`
                     : `<div class="empty">No projects linked to this repository yet.</div>`)
      + (mine.length ? `<div class="listhead">Your projects</div><div class="filebox">${mine.map((p, i) => card(p, i, 'mine')).join('')}</div>` : '')
      + `<p class="hint">Projects are created on github.com — the API can read and update boards, but not build one from scratch.</p>`;

    v.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      const p = (b.dataset.src === 'repo' ? list : mine)[+b.dataset.p];
      openProject(p);
    });
  } catch (e) {
    const scopeIssue = /scope|permission|forbidden|not been granted/i.test(e.message);
    v.innerHTML = `<h1 style="padding-left:0">Projects</h1><div class="empty">${
      scopeIssue
        ? 'Projects boards need a <b>classic</b> token with the <span class="mono">project</span> scope.<br><br>'
          + 'Fine-grained tokens can\'t reach Projects v2 — GitHub offers no permission for it on personal '
          + 'accounts, only on organisations. Everything else in gitfile works fine on your fine-grained token.'
        : esc(e.message)}</div>
      <div style="height:12px"></div>
      <button class="btn wide" id="pj-web">Open Projects on GitHub</button>`;
    const w = $('pj-web');
    if (w) w.onclick = () => {
      const u = 'https://github.com/' + S.repo.owner + '/' + S.repo.name + '/projects';
      window.Native ? window.Native.openUrl(u) : window.open(u, '_blank');
    };
  }
}

async function openProject(p){
  show('project');
  const v = $('v-project');
  v.innerHTML = `<h1 style="padding-left:0">${esc(p.title)}</h1><div class="empty">Loading…</div>`;
  setBar([
    { label:'Back',   onClick:openProjects },
    { label:'GitHub', onClick:() => window.Native ? window.Native.openUrl(p.url) : window.open(p.url, '_blank'), solid:true, grow:true }
  ]);
  try {
    const res = await api.projectItems(p.id);
    if (res.errors && res.errors.length) throw new Error(res.errors[0].message);
    const items = ((res.data && res.data.node && res.data.node.items && res.data.node.items.nodes) || []);
    if (!items.length) { v.innerHTML = `<h1 style="padding-left:0">${esc(p.title)}</h1><div class="empty">This board is empty.</div>`; return; }

    // Group by the first single-select field, which is normally "Status".
    const groups = {};
    items.forEach(it => {
      const fv = (it.fieldValues && it.fieldValues.nodes || []).find(n => n && n.name);
      const key = fv ? fv.name : 'No status';
      (groups[key] = groups[key] || []).push(it);
    });

    v.innerHTML = `<h1 style="padding-left:0">${esc(p.title)}</h1>`
      + Object.entries(groups).map(([status, list]) => `
        <div class="listhead">${esc(status)} · ${list.length}</div>
        <div class="filebox">${list.map(it => {
          const c = it.content || {};
          const label = c.title || '(draft)';
          const meta = c.number ? '#' + c.number + (c.state ? ' · ' + String(c.state).toLowerCase() : '') : it.type.toLowerCase();
          return `<div class="row"><span class="rowmain" style="cursor:default">
            <span class="body" style="flex:1;min-width:0;text-align:left">
              <span class="name">${esc(label)}</span>
              <span class="sub" style="display:block;color:var(--fg-subtle);font-size:11px;font-family:var(--mono)">${esc(meta)}</span>
            </span></span></div>`;
        }).join('')}</div>`).join('');
  } catch (e) {
    v.innerHTML = `<h1 style="padding-left:0">${esc(p.title)}</h1><div class="empty">${esc(e.message)}</div>`;
  }
}

function paintCrumbs(){
  const c = $('crumbs');
  c.innerHTML = '';

  const add = (label, path, isLast) => {
    if (isLast) {
      const s = document.createElement('span');
      s.className = 'now'; s.textContent = label;
      c.appendChild(s);
    } else {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => loadTree(path);
      c.appendChild(b);
      const sl = document.createElement('span');
      sl.className = 'slash';
      sl.textContent = ' / ';
      c.appendChild(sl);
    }
  };

  const parts = S.path ? S.path.split('/') : [];
  add(S.repo.name, '', parts.length === 0);
  parts.forEach((p, i) => add(p, parts.slice(0, i + 1).join('/'), i === parts.length - 1));
}

const bytes = n =>
  n < 1024 ? n + ' B' :
  n < 1048576 ? (n / 1024).toFixed(1) + ' K' :
  (n / 1048576).toFixed(1) + ' M';


/* --- 6d. File editor ---------------------------------------- */
const IMAGE = /\.(png|jpe?g|gif|webp|bmp|ico|avif)$/i;
const MIME  = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
                webp:'image/webp', bmp:'image/bmp', ico:'image/x-icon', avif:'image/avif' };

/* Which pane of the file view is showing. */

function filePane(which){
  $('editor').style.display  = which === 'edit'    ? 'block' : 'none';
  $('preview').style.display = which === 'preview' ? 'block' : 'none';
  $('imgview').style.display = which === 'image'   ? 'block' : 'none';
  $('editstat').style.display = which === 'image'  ? 'none'  : 'flex';
}

/* ── Recent files ─────────────────────────────────────────────────────────
   A short per-repo list of what you have opened, most recent first, so you can
   jump back to the handful of files you actually work in without walking the
   tree each time. Kept on-device.
   ──────────────────────────────────────────────────────────────────────── */
function recentKey(){ return 'gitfile:recent:' + S.repo.owner + '/' + S.repo.name; }

async function recordRecent(path){
  try {
    let list = JSON.parse((await store.get(recentKey())) || '[]');
    list = [path, ...list.filter(p => p !== path)].slice(0, 12);
    await store.set(recentKey(), JSON.stringify(list));
  } catch { /* a missing recent list is no reason to fail an open */ }
}

async function recentFiles(){
  try { return JSON.parse((await store.get(recentKey())) || '[]'); }
  catch { return []; }
}

async function recentSheet(){
  const list = await recentFiles();
  if (!list.length) { toast('No recent files yet — open a few.'); return; }

  sheet('Recent files', `
    <div class="filebox">
      ${list.map((path, i) => `
        <button class="row rec" data-i="${i}">
          <span class="glyph ${fileClass(path.split('/').pop())}">${fileGlyph({ type:'file', name:path })}</span>
          <span class="body" style="flex:1;min-width:0">
            <span class="name">${esc(path.split('/').pop())}</span>
            <span class="sub" style="display:block;color:var(--fg-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(path)}</span>
          </span>
        </button>`).join('')}
    </div>
    <button class="btn wide" id="rec-clear">Clear list</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Close</button>
  `, () => {
    document.querySelectorAll('.rec').forEach(el => {
      el.onclick = () => { closeSheet(); openFile(list[Number(el.dataset.i)]); };
    });
    $('rec-clear').onclick = async () => { await store.set(recentKey(), '[]'); closeSheet(); toast('Cleared'); };
  });
}

async function openFile(path){
  show('file');
  const ed = $('editor');
  filePane('edit');
  ed.value = 'Loading…';
  ed.readOnly = true;

  try {
    const f = await api.contents(S.repo.owner, S.repo.name, path, S.branch);

    recordRecent(path);   // remember it for quick-open

    // Over 1 MB, the contents API returns the metadata but blanks the content.
    // The sha it hands back is the way through: fetch the blob directly.
    if (f.content === undefined || f.content === '') {
      if (!f.sha) throw new Error('GitHub returned no content for this file.');
      if (f.size > 4 * 1024 * 1024) {
        throw new Error(`${bytes(f.size)} is too large to open in a phone editor.`);
      }
      const blob = await api.blob(S.repo.owner, S.repo.name, f.sha);
      f.content = blob.content;
      if (!f.content) throw new Error('GitHub returned no content for this file.');
    }

    // ── Images: show them, don't refuse them. ──────────────────────────────
    if (IMAGE.test(f.path)) {
      const ext = f.path.split('.').pop().toLowerCase();
      S.file   = { path: f.path, sha: f.sha, text: null, binary: true };
      S.buffer = null;

      $('imgview').innerHTML = `
        <img src="data:${MIME[ext] || 'image/*'};base64,${f.content.replace(/\s/g, '')}" alt="">
        <div class="meta">${bytes(f.size || 0)} · ${f.sha.slice(0, 7)}</div>`;
      filePane('image');
      paintPath();
      paintRef();

      setBar([
        { label:'Back', onClick:() => backToTree() },
        { label:'File', onClick:fileSheet, solid:true, grow:true }
      ]);
      return;
    }

    if (looksBinary(f.content)) {
      throw new Error('Binary file. gitfile can show images, and edit text.');
    }

    const text = b64decode(f.content);
    S.file   = { path: f.path, sha: f.sha, text, binary: false,
                 raw: f.download_url || null,
                 size: f.size || new TextEncoder().encode(text).length };
    S.buffer = text;
    cacheFile(f.path, text, f.sha);          // keep an offline copy
    ed.value = text;
    ed.readOnly = true;          // files open read-only, like GitHub — the pencil unlocks them
    S.editing = false;
    filePane('edit');
    $('draftbar').style.display = 'none';
    const fe = $('fi-edit'); if (fe) fe.style.display = S.canPush ? '' : 'none';
    const fd = $('fi-diff'); if (fd) fd.style.display = 'none';
    $('findbar').style.display = 'none';
    FIND = { q:'', hits:[], idx:-1 };
    paintPath();
    paintStats();
    paintHL(true);        // immediately on open, not after a debounce
    paintRef();
    readBar();

    // If the app was closed mid-edit last time, a local draft is waiting. Offer
    // it rather than silently discarding the work — or silently overwriting it.
    try {
      const draft = await store.get(draftKey());
      if (draft != null && draft !== text) showDraftBar(draft);
    } catch { /* no draft, no problem */ }

  } catch (e) {
    // No signal? Show the last cached copy, read-only, rather than nothing.
    const cached = isOffline(e) ? await cachedFile(path) : null;
    if (cached) {
      const text = cached.text;
      S.file = { path, sha: cached.sha, text, binary: false, raw: null, offline: true,
                 size: new TextEncoder().encode(text).length };
      S.buffer = text;
      ed.value = text; ed.readOnly = true; S.editing = false;
      filePane('edit');
      $('draftbar').style.display = 'none';
      const fe = $('fi-edit'); if (fe) fe.style.display = 'none';   // can't edit without a connection
      $('findbar').style.display = 'none'; FIND = { q:'', hits:[], idx:-1 };
      paintPath(); paintStats(); paintHL(true); paintRef();
      setBar([{ label:'Back', onClick:() => backToTree(), solid:true }]);
      toast('Offline copy — may be out of date.', 5000);
      return;
    }
    S.file = null;
    ed.value = '';
    ed.readOnly = true;
    filePane('edit');
    $('stat-lines').textContent = '—';
    $('stat-bytes').textContent = '—';
    $('stat-state').textContent = 'unreadable';
    toast(e.message, 6000);
    setBar([{ label:'Back', onClick:() => backToTree(), solid:true }]);
  }
}

/* ── The editable path ────────────────────────────────────────────────────
   The input holds the full path. Editing it and committing moves the file —
   and because a git tree has no directories of its own, typing a slash simply
   creates the folders. GitHub's own UI works exactly this way.
   ──────────────────────────────────────────────────────────────────────── */
function paintPath(){
  $('pathroot').textContent = S.repo.name + ' / ';
  $('pathin').value = S.file ? S.file.path : '';
  markMoved();
}

function markMoved(){
  const moved = !!S.file && $('pathin').value.trim() !== S.file.path;
  $('pathin').classList.toggle('moved', moved);
  refreshCommitBtn();
}

$('pathin').addEventListener('input', markMoved);

/* A move is a change worth committing even when the bytes are identical. */
const isMoved = () =>
  !!S.file && $('pathin').value.trim() !== '' && $('pathin').value.trim() !== S.file.path;

/* ── The File sheet: preview, history, delete ───────────────────────────── */
function fileSheet(){
  const path = S.file.path;
  const kind = /\.(md|markdown)$/i.test(path) ? 'markdown'
             : /\.(csv|tsv)$/i.test(path)      ? 'table'
             : /\.svg$/i.test(path)            ? 'svg'
             : null;
  const showingPreview = $('preview').style.display === 'block';

  const label = { markdown:'Preview markdown', table:'Preview as table', svg:'Preview image' }[kind];

  sheet('File', `
    <div class="overwrite">
      <b>${path}</b><br>
      blob ${S.file.sha.slice(0, 7)} on <b>${S.branch}</b>
    </div>
    <div class="sheetlist">
      ${kind ? `<button id="f-prev">${showingPreview ? 'Show source' : label}<small>Render it the way GitHub would</small></button>` : ''}
      <button id="f-log">History<small>Every commit that touched this file</small></button>
      <button id="f-del">Delete<small>Removes the file in a single commit</small></button>
    </div>
    <button class="btn wide" onclick="closeSheet()">Close</button>
  `, () => {
    if ($('f-prev')) $('f-prev').onclick = () => {
      closeSheet();
      if (showingPreview) { filePane('edit'); return; }
      // Render into the shared preview pane by type.
      if (kind === 'markdown')   $('preview').innerHTML = markdown(S.buffer);
      else if (kind === 'table') $('preview').innerHTML = renderTable(S.buffer, path);
      else if (kind === 'svg')   $('preview').innerHTML = renderSvg(S.buffer);
      filePane('preview');
    };
    $('f-log').onclick = () => { closeSheet(); openLog(S.file.path); };
    $('f-del').onclick = () => { closeSheet(); doDelete({ path:S.file.path, name:S.file.path.split('/').pop() }); };
  });
}

/* CSV/TSV → a table. A real CSV parser, not split(','): fields can contain
   commas inside quotes, quotes escaped by doubling, and newlines inside quotes.
   GitHub renders these as a grid; so do we. */
function renderTable(text, path){
  const sep = /\.tsv$/i.test(path) ? '\t' : ',';
  const rows = parseCsv(text, sep);
  if (!rows.length) return '<div class="empty">Empty file.</div>';

  const head = rows[0];
  const body = rows.slice(1);

  return `<div class="csvwrap"><table class="csv">
    <thead><tr>${head.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r =>
      `<tr>${head.map((_, i) => `<td>${esc(r[i] != null ? r[i] : '')}</td>`).join('')}</tr>`
    ).join('')}</tbody>
  </table></div>
  <div class="csvmeta">${body.length} row${body.length === 1 ? '' : 's'} · ${head.length} column${head.length === 1 ? '' : 's'}</div>`;
}

function parseCsv(text, sep){
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }   // escaped quote
        else inQ = false;
      } else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === sep) { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* ignore, handled by the \n */ }
      else field += c;
    }
  }
  // last field/row if the file did not end in a newline
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] && r[0].length));   // drop blank lines
}

/* SVG → the rendered image. The file IS the image; drop it into the DOM inside a
   sandbank container. It is the user\'s own repo content, shown to themselves. */
function renderSvg(text){
  // A little defensive: strip <script> so a hand-written SVG with script cannot
  // run in the app context. Preview is about seeing the picture, not executing it.
  const clean = text.replace(/<script[\s\S]*?<\/script>/gi, '');
  return `<div class="svgview">${clean}</div>
    <div class="csvmeta">Rendered preview · edit the source to change it</div>`;
}

function backToTree(){
  // Leaving with uncommitted edits should never silently lose them.
  if (S.editing && isDirty()) { askOnLeave(); return; }
  loadTree(S.path);
}

/* ── Read mode ↔ Edit mode ────────────────────────────────────────────────
   Files open read-only, exactly like GitHub. The pencil unlocks the editor
   and swaps the bottom bar to Cancel / Commit. This mirrors GitHub's "Edit →
   Cancel changes / Commit changes" flow. */
function readBar(){
  setBar([
    { label:'Back', onClick:() => backToTree() },
    { label:'File', onClick:fileSheet, solid:true, grow:true }
  ]);
}
function editBar(){
  setBar([
    { label:'Cancel', onClick:cancelEdit },
    { label:'File',   onClick:fileSheet },
    { label:'Commit', onClick:commitSheet, solid:true, grow:true, id:'commitbtn' }
  ]);
  refreshCommitBtn();
}

function enterEdit(restore){
  if (!S.file || S.file.binary) return;
  if (S.file.offline) { toast('This is an offline copy — reconnect to edit.', 4000); return; }
  S.editing = true;
  const ed = $('editor');
  ed.readOnly = false;
  if (restore != null) {           // restoring a recovered draft
    ed.value = restore; S.buffer = restore;
  }
  $('draftbar').style.display = 'none';
  const fe = $('fi-edit'); if (fe) fe.style.display = 'none';
  const fd = $('fi-diff'); if (fd) fd.style.display = '';
  paintStats(); paintHL(true); paintRef();
  editBar();
  ed.focus();
}

async function cancelEdit(){
  if (isDirty() && !confirm('Discard your changes to this file?')) return;
  const ed = $('editor');
  S.buffer = S.file.text;          // back to the committed content
  ed.value = S.file.text;
  ed.readOnly = true;
  S.editing = false;
  await clearDraft();
  const fe = $('fi-edit'); if (fe) fe.style.display = '';
  const fd = $('fi-diff'); if (fd) fd.style.display = 'none';
  paintStats(); paintHL(true); paintRef();
  readBar();
}

/* The three-way prompt when you try to leave with unsaved edits. */
function askOnLeave(){
  const name = S.file.path.split('/').pop();
  sheet('Unsaved changes', `
    <p class="hint" style="margin-top:0">You have uncommitted edits to <b>${esc(name)}</b>. Your draft is saved on this device either way.</p>
    <button class="btn solid wide" id="lv-commit">Commit changes…</button>
    <div style="height:10px"></div>
    <button class="btn wide" id="lv-discard">Discard changes</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Keep editing</button>
  `, () => {
    $('lv-commit').onclick = () => { closeSheet(); commitSheet(); };
    $('lv-discard').onclick = async () => {
      closeSheet();
      await clearDraft();
      S.buffer = S.file.text; S.editing = false;
      loadTree(S.path);
    };
  });
}

/* ── Local drafts: survive the app being closed mid-edit ──────────────────
   As you type, a copy is written to on-device storage (debounced), and flushed
   immediately if the app goes to the background. Re-opening the file offers to
   restore it. Committing or discarding clears it. */
function draftKey(){
  return 'gitfile:draft:' + S.repo.owner + '/' + S.repo.name + ':' + S.branch + ':' + (S.file ? S.file.path : '');
}
let draftTimer = null;
function saveDraftSoon(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    if (S.editing && S.file && isDirty()) store.set(draftKey(), S.buffer).catch(() => {});
  }, 700);
}
function flushDraft(){
  if (S.editing && S.file && isDirty()) {
    clearTimeout(draftTimer);
    store.set(draftKey(), S.buffer).catch(() => {});
  }
}
async function clearDraft(){ try { await store.del(draftKey()); } catch {} }

function showDraftBar(draft){
  const bar = $('draftbar');
  bar.style.display = 'flex';
  bar.innerHTML = `<span>You left unsaved edits here last time.</span>
    <span class="fspace" style="margin-left:auto"></span>
    <button class="btn small" id="draft-restore">Restore</button>
    <button class="btn small" id="draft-discard">Discard</button>`;
  $('draft-restore').onclick = () => enterEdit(draft);
  $('draft-discard').onclick = async () => { bar.style.display = 'none'; await clearDraft(); };
}

// The app being sent to the background (home button, app switch) is the moment
// most likely to precede it being killed — flush the draft right then.
document.addEventListener('visibilitychange', () => { if (document.hidden) flushDraft(); });
window.addEventListener('pagehide', flushDraft);

/* After a successful commit, drop back to read mode and clear the draft. */
function commitCleanup(){
  S.editing = false;
  const ed = $('editor'); if (ed) ed.readOnly = true;
  const fe = $('fi-edit'); if (fe) fe.style.display = '';
  const fd = $('fi-diff'); if (fd) fd.style.display = 'none';
  clearDraft();
  readBar();
}

/* Review the current uncommitted edits as a diff, without opening the commit
   flow. Reuses diffLines and the diff styles the commit sheet already uses. */
function showDiffSheet(){
  if (!S.file) return;
  if (!isDirty()) { toast('No changes yet.'); return; }
  const d = diffLines(S.file.text, S.buffer);
  sheet('Your changes', `
    <div class="diffstat"><span class="a">+${d.added}</span> <span class="d">−${d.removed}</span> lines changed</div>
    <div class="filediff"><div class="diff">${d.html}</div></div>
    <div style="height:12px"></div>
    <button class="btn solid wide" id="df-commit">Commit…</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Close</button>
  `, () => { $('df-commit').onclick = () => { closeSheet(); commitSheet(); }; });
}

/* Keep the buffer, the stats, the dirty mark and the commit button in sync. */
$('editor').addEventListener('input', e => {
  S.buffer = e.target.value;
  paintStats();
  paintHL();
  paintRef();
  refreshCommitBtn();
  saveDraftSoon();          // keep a local copy in case the app is closed mid-edit
});

/* Tab should indent, not escape the field. */
$('editor').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const ta = e.target, s = ta.selectionStart, t = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(t);
  ta.selectionStart = ta.selectionEnd = s + 2;
  ta.dispatchEvent(new Event('input'));
});

function paintStats(){
  const v = S.buffer;
  const lines = v ? v.split('\n').length : 0;
  // "loc" the way GitHub counts it: lines that aren't blank.
  const loc   = v ? v.split('\n').filter(l => l.trim() !== '').length : 0;
  $('stat-lines').textContent = lines + ' lines (' + loc + ' loc)';
  $('stat-bytes').textContent = bytes(new TextEncoder().encode(v).length);
  $('stat-state').textContent = !S.editing ? 'read-only' : (isDirty() ? 'modified' : 'clean');
}

/* ── File toolbar: Raw · Copy · Download ──────────────────────────────────
   The three actions GitHub puts above a file. Wired once; they read the file
   that's currently open. Only meaningful for text files (the image view hides
   this bar), so each guards on S.file being present. */
const fileBase = () => (S.file ? S.file.path.split('/').pop() : 'file.txt');

function doRaw(){
  if (!S.file || !S.file.raw) { toast('No raw URL for this file.'); return; }
  // download_url carries a short-lived token, so it opens even for private repos.
  if (window.Native && window.Native.openUrl) window.Native.openUrl(S.file.raw);
  else window.open(S.file.raw, '_blank');
}

function doCopy(){
  const text = S.buffer || '';
  if (window.Native && window.Native.copy) window.Native.copy(text);
  else if (navigator.clipboard) navigator.clipboard.writeText(text);
  toast('Copied ' + fileBase());
}

function doDownload(){
  const name = fileBase();
  // Prefer the native downloader with the real raw URL — most reliable in-app.
  if (window.Native && window.Native.download && S.file && S.file.raw) {
    downloadNative({ url: S.file.raw, accept: 'application/octet-stream',
                     name, unzip: false, size: (S.file && S.file.size) || 0, label: name });
    return;
  }
  // Browser (or no raw URL): build the file from what's already loaded.
  try {
    const blob = new Blob([S.buffer || ''], { type: 'application/octet-stream' });
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1500);
  } catch { toast('Could not download this file.'); }
}

/* Build a GitHub permalink to the current file — pinned to the file's latest
   commit so the link never rots — plus #L{n} if a line is selected. */
async function copyPermalink(){
  if (!S.file) return;
  let ref = S.branch;
  try {
    const cs = await api.commits(S.repo.owner, S.repo.name, S.branch, S.file.path);
    if (cs && cs[0]) ref = cs[0].sha;           // a real permalink uses the commit sha
  } catch { /* fall back to the branch ref */ }

  const path = S.file.path.split('/').map(encodeURIComponent).join('/');
  let url = 'https://github.com/' + S.repo.owner + '/' + S.repo.name + '/blob/' + ref + '/' + path;

  const ed = $('editor');
  if (ed && ed.value && (ed.selectionStart > 0 || ed.selectionEnd > 0)) {
    url += '#L' + (ed.value.slice(0, ed.selectionStart).split('\n').length);
  }

  if (window.Native && window.Native.copy) window.Native.copy(url);
  else if (navigator.clipboard) navigator.clipboard.writeText(url);
  toast('Permalink copied');
}
