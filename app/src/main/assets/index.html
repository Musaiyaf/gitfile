<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.25, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>gitfile</title>

<style>
/* ────────────────────────────────────────────────────────────────
   GitHub's interface, rebuilt on a black canvas.

   GitHub's own dark theme sits on #0d1117 — a blue-black. This uses true
   #000000 and pushes every surface a step darker to match, which is why the
   greys below are not GitHub's greys. The semantic colours ARE GitHub's:
   blue for links, green for the primary action, red and green in diffs. Those
   carry meaning, and stripping them would cost the very thing being copied.
   ──────────────────────────────────────────────────────────────── */
:root{
  --canvas:      #000000;   /* page */
  --inset:       #0A0A0A;   /* the well behind panels */
  --subtle:      #101216;   /* row hover, code blocks */
  --overlay:     #14171C;   /* dialogs, menus */
  --border:      #262B31;   /* every hairline */
  --border-lit:  #3D444D;   /* hover, focus */

  --fg:          #E6EDF3;   /* body text */
  --fg-muted:    #9198A1;   /* metadata, timestamps */
  --fg-subtle:   #656C76;   /* the quietest text there is */

  --accent:      #4493F8;   /* links, active tab */
  --accent-em:   #58A6FF;
  --green:       #238636;   /* the primary button */
  --green-hi:    #2EA043;
  --green-fg:    #3FB950;   /* success dot */
  --red:         #F85149;   /* danger, failure */
  --amber:       #D29922;   /* in progress */
  --tab-mark:    #FD8C73;   /* GitHub's active-tab underline */

  --add-bg:      rgba(46,160,67,.16);
  --add-fg:      #7EE787;
  --del-bg:      rgba(248,81,73,.16);
  --del-fg:      #FFA198;

  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  --r: 6px;                 /* GitHub's corner radius, everywhere */
  --tap: 44px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }

body{
  background:var(--canvas);
  color:var(--fg);
  font-family:var(--ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

#app{ max-width:1012px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

:focus-visible{ outline:2px solid var(--accent); outline-offset:-1px; border-radius:var(--r); }

a{ color:var(--accent); text-decoration:none; }
a:hover{ text-decoration:underline; }

/* ══ Header ══════════════════════════════════════════════════ */
#refline{
  position:sticky; top:0; z-index:20;
  background:var(--canvas);
  border-bottom:1px solid var(--border);
  padding:12px 16px 0;
}
.hdr{ display:flex; align-items:center; gap:8px; padding-bottom:12px; }
.hdr .mark{ font-size:16px; flex:none; color:var(--fg); }
.coord{ flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.coord .owner{ color:var(--accent); }
.coord .sep{ color:var(--fg-subtle); padding:0 3px; }
.coord .repo{ color:var(--accent); font-weight:600; }
.coord .dim{ color:var(--fg-muted); }

.pill{
  display:inline-block; margin-left:6px;
  border:1px solid var(--border-lit); border-radius:2em;
  padding:0 7px; font-size:11px; line-height:18px;
  color:var(--fg-muted); vertical-align:middle;
}

#dirty{ color:var(--amber); display:none; font-size:11px; }
#dirty.on{ display:inline; }
#quota{ color:var(--fg-subtle); font-size:11px; white-space:nowrap; }

#queuebadge{
  flex:none; margin-left:8px;
  background:rgba(210,153,34,.15); color:var(--amber);
  border:1px solid var(--amber); border-radius:2em;
  padding:1px 8px; font-size:11px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center;
}
#gear{
  background:none; border:0; padding:4px 0 4px 10px;
  color:var(--fg-muted); font-size:15px; line-height:1; cursor:pointer; flex:none;
  display:flex; align-items:center;
}
#gear svg, .mark svg{ display:block; }
#gear:hover{ color:var(--fg); }

/* ── Tabs. The active one carries GitHub's orange underline. ── */
.tabs{
  display:flex; gap:4px;
  overflow-x:auto; scrollbar-width:none;
  margin:0 -16px; padding:0 16px;
}
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{
  background:none; border:0; border-bottom:2px solid transparent;
  padding:8px 10px 10px; margin-bottom:-1px;
  color:var(--fg-muted); font:inherit; font-size:13px; white-space:nowrap;
  cursor:pointer; border-radius:var(--r) var(--r) 0 0;
}
.tabs button:hover{ color:var(--fg); background:var(--subtle); }
.tabs button.on{ color:var(--fg); font-weight:600; border-bottom-color:var(--tab-mark); }

/* ══ Views ═══════════════════════════════════════════════════ */
main{ flex:1; padding:16px; padding-bottom:96px; }
.view{ display:none; }
.view.on{ display:block; }
.pad{ padding:0 0 16px; }

h1{
  font-size:12px; font-weight:600; color:var(--fg-muted);
  padding:0 0 12px; letter-spacing:0; text-transform:none;
}

/* ══ The file table ══════════════════════════════════════════
   GitHub's central object: a bordered card, a commit bar across the top, then
   one row per entry.
   ══════════════════════════════════════════════════════════ */
.filebox{
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
  margin-bottom:16px;
}

.commitbar{
  display:flex; align-items:center; gap:8px;
  background:var(--inset);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  font-size:12px; color:var(--fg-muted);
  min-height:44px;
}
.commitbar .who{ color:var(--fg); font-weight:600; flex:none; }
.commitbar .msg{
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--fg-muted);
}
.commitbar .when{ flex:none; font-family:var(--mono); font-size:11px; }

.row{
  display:flex; align-items:center; gap:12px;
  width:100%; min-height:var(--tap);
  padding:8px 16px;
  background:transparent; border:0; border-top:1px solid var(--border);
  color:var(--fg); font:inherit; font-size:14px; text-align:left; cursor:pointer;
}
.filebox .row:first-child{ border-top:0; }
.row:hover{ background:var(--subtle); }
.row .glyph{
  width:20px; flex:none; font-size:15px; text-align:center;
  line-height:1;
}
/* Files sit back a little so folders lead the eye, the way GitHub's blue folder
   icons do. Emoji don't take a text colour, so this is opacity, not colour. */
.row:not(.dir) .glyph{ opacity:.85; }
.row .name{
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--fg);
}
.row:hover .name{ color:var(--accent); text-decoration:underline; }
.row .meta{ color:var(--fg-muted); font-size:12px; flex:none; font-family:var(--mono); }

/* A tree row: the whole name is one button, with a ⋯ menu beside it. */
.row{ padding:0; align-items:stretch; }
.rowmain{
  display:flex; align-items:center; gap:12px;
  flex:1; min-width:0;
  padding:8px 4px 8px 16px;
  background:none; border:0; color:var(--fg); font:inherit; font-size:14px; text-align:left;
}
.rowmenu{
  flex:none; width:40px;
  background:none; border:0;
  color:var(--fg-subtle); font-size:16px; line-height:1;
  border-radius:var(--r);
}
.rowmenu:hover{ color:var(--fg); background:var(--overlay); }

/* ══ Buttons ═════════════════════════════════════════════════ */
button{ font:inherit; cursor:pointer; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:32px; padding:5px 16px;
  background:var(--overlay); color:var(--fg);
  border:1px solid var(--border-lit); border-radius:var(--r);
  font-size:14px; font-weight:500;
}
.btn:hover{ background:var(--subtle); border-color:var(--fg-subtle); }
.btn:active{ background:var(--inset); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* The green one. GitHub uses it for exactly one action per screen. */
.btn.solid{
  background:var(--green); color:#fff;
  border-color:rgba(255,255,255,.1); font-weight:600;
}
.btn.solid:hover:not(:disabled){ background:var(--green-hi); }
.btn.solid:disabled{ background:var(--green); opacity:.5; }

.btn.danger{ color:var(--red); }
.btn.danger:hover{ background:var(--red); color:#fff; border-color:var(--red); }

.btn.wide{ width:100%; }
.btn.small{ min-height:28px; padding:3px 12px; font-size:12px; }

/* ══ The repo toolbar: branch picker, then actions ════════════ */
.branchpick{
  display:flex; align-items:center; gap:8px;
  margin-bottom:16px;
}
.branchpick select{
  flex:0 1 auto; min-width:0; max-width:55%;
  min-height:32px; padding:5px 10px;
  background:var(--overlay); color:var(--fg);
  border:1px solid var(--border-lit); border-radius:var(--r);
  font-size:13px; font-weight:500;
  -webkit-appearance:none; appearance:none;
}
.branchpick select:focus{ outline:none; border-color:var(--accent); }
.branchpick .btn{ flex:none; }
.branchpick .spacer{ flex:1; }

/* ══ Breadcrumbs ═════════════════════════════════════════════ */
.crumbs{
  display:flex; flex-wrap:wrap; align-items:center; gap:2px;
  font-size:16px; margin-bottom:16px;
}
.crumbs button{
  background:none; border:0; color:var(--accent); font:inherit; font-size:16px; padding:2px;
}
.crumbs button:hover{ text-decoration:underline; }
.crumbs .now{ color:var(--fg); font-weight:600; padding:2px; }
.crumbs .slash{ color:var(--fg-subtle); }

/* ══ Inputs ══════════════════════════════════════════════════ */
label{
  display:block; font-size:14px; font-weight:600; color:var(--fg);
  margin-bottom:6px; letter-spacing:0; text-transform:none;
}
input[type=text], input[type=password], textarea, select{
  width:100%; padding:6px 12px; min-height:32px;
  background:var(--canvas); color:var(--fg);
  border:1px solid var(--border-lit); border-radius:var(--r);
  font:inherit; font-size:14px;
  -webkit-appearance:none; appearance:none;
}
input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
::placeholder{ color:var(--fg-subtle); }

.field{ margin-bottom:16px; }
.hint{ font-size:12px; color:var(--fg-muted); margin-top:6px; line-height:1.5; }
.hint a{ color:var(--accent); }
.hint b{ color:var(--fg); font-weight:600; }

input.masked{ -webkit-text-security:disc; font-family:var(--mono); letter-spacing:.05em; }
input.masked.plain{ -webkit-text-security:none; letter-spacing:0; }

.tokmeta{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:12px; color:var(--fg-muted); }
.tokmeta button{ background:none; border:0; color:var(--accent); font:inherit; padding:4px; }

/* ── Checkbox, hand-drawn. The native control's tick is invisible on
      a white accent in Android's WebView. ── */
.check{
  display:flex; align-items:center; gap:8px; min-height:var(--tap);
  font-size:14px; font-weight:400; color:var(--fg); cursor:pointer; margin-bottom:0;
}
.check input{ position:absolute; opacity:0; width:0; height:0; }
.check .box{
  width:16px; height:16px; flex:none;
  border:1px solid var(--border-lit); border-radius:3px;
  display:grid; place-items:center; background:var(--canvas);
}
.check input:checked + .box{ background:var(--accent); border-color:var(--accent); }
.check input:checked + .box::after{ content:'\2713'; color:#fff; font-size:11px; font-weight:700; line-height:1; }
.check input:focus-visible + .box{ box-shadow:0 0 0 2px var(--accent); }

/* ══ File view ═══════════════════════════════════════════════ */
.pathbar{
  display:flex; align-items:center;
  background:var(--inset);
  border:1px solid var(--border); border-bottom:0;
  border-radius:var(--r) var(--r) 0 0;
  padding:0 12px;
}
.pathbar .dim{ color:var(--fg-muted); font-size:14px; flex:none; }
.pathbar input{
  flex:1; min-width:0; background:transparent; border:0; box-shadow:none;
  padding:10px 0; color:var(--fg); font-size:14px; font-weight:600;
}
.pathbar input:focus{ outline:none; box-shadow:none; }
.pathbar input.moved{ color:var(--amber); }

#editstat{
  display:flex; gap:10px; align-items:center;
  background:var(--inset);
  border:1px solid var(--border); border-bottom:0;
  padding:8px 12px;
  font-size:12px; color:var(--fg-muted); font-family:var(--mono);
}
#editstat .statwrap{ flex:1 1 auto; min-width:0; display:flex; gap:10px; overflow:hidden; white-space:nowrap; }
#editstat .statwrap > span{ overflow:hidden; text-overflow:ellipsis; }
#editstat #stat-state{ color:var(--fg-muted); }
#editstat .ficon{
  flex:none;
  background:none; border:1px solid var(--border-lit); border-radius:var(--r);
  color:var(--fg-muted); font:inherit; font-size:12px; font-family:var(--mono);
  padding:4px 12px; cursor:pointer;
}
#editstat .ficon:active{ background:var(--inset); color:var(--fg); }
#editstat .ficon.edit{ border-color:var(--accent); color:var(--accent-em); }

/* Repos screen entry row */
.reptop{ display:flex; gap:8px; margin:-4px 0 12px; }
.glyph .gi{ vertical-align:-2px; }

/* Token manager rows (profile) */
.trow{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.trow:last-of-type{ border-bottom:0; }
.trow .tk{ color:var(--fg-muted); flex:none; }
.trow .tv{ color:var(--fg); text-align:right; word-break:break-word; font-family:var(--mono); font-size:12px; }

/* Repos home: pin toggle, section headers, row icon alignment */
.rowpin{ background:none; border:0; color:var(--fg-subtle); cursor:pointer; padding:0 8px; display:flex; align-items:center; flex:none; }
.rowpin.on{ color:#e3b341; }
.rowpin:active{ color:var(--fg); }
.rowmenu svg, .rowpin svg{ display:block; }
.listhead{ font-size:11px; font-weight:600; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.05em; margin:16px 0 6px; padding:0 2px; }
.listhead:first-child{ margin-top:2px; }

/* Tree multi-select */
.rowpick{ background:none; border:0; padding:0 4px 0 10px; cursor:pointer; display:flex; align-items:center; flex:none; }
.rowpick .box{ width:15px; height:15px; border:1px solid var(--border-lit); border-radius:3px; display:block; }
.rowpick.on .box{ background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--overlay); }
#selbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:var(--inset); border:1px solid var(--border); border-radius:var(--r);
  padding:8px 10px; margin-bottom:10px;
}
#selbar .selcount{ font-size:12px; color:var(--fg-muted); font-family:var(--mono); margin-right:auto; }
#selbar .btn[disabled]{ opacity:.4; }
/* Chosen destination in the pull-request sheet */
.sheetlist button.on{ border-color:var(--accent); background:rgba(56,139,253,.12); color:var(--fg); }

/* Discover: search-mode tabs and the live status text */
.dctabs{ display:flex; align-items:center; gap:8px; margin:-4px 0 12px; }
.dctab{
  background:none; border:1px solid var(--border-lit); border-radius:2em;
  color:var(--fg-muted); font:inherit; font-size:12px; padding:4px 12px; cursor:pointer;
}
.dctab.on{ color:var(--fg); border-color:var(--accent); background:rgba(56,139,253,.12); }
.dcstate{ margin-left:auto; font-size:11px; color:var(--fg-subtle); font-family:var(--mono); }
.dcfilters{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
.dcfilters select{
  flex:1; min-width:100px; background:var(--inset); color:var(--fg);
  border:1px solid var(--border-lit); border-radius:var(--r);
  font:inherit; font-size:12px; padding:6px 8px;
}
/* About panel action row */
.abacts{ display:flex; gap:8px; flex-wrap:wrap; }
.forkinfo{
  font-size:12px; color:var(--fg); line-height:1.5;
  background:var(--inset); border:1px solid var(--border);
  border-radius:var(--r); padding:10px 12px;
}
.forkinfo .dim{ color:var(--fg-muted); font-family:var(--mono); font-size:11px; }

/* Insights / Security hubs: sub-navigation, inline charts */
.hubnav{ display:flex; gap:6px; overflow-x:auto; margin:-4px 0 14px; padding-bottom:4px; }
.hubtab{
  background:none; border:1px solid var(--border-lit); border-radius:2em;
  color:var(--fg-muted); font:inherit; font-size:12px; padding:4px 12px;
  cursor:pointer; white-space:nowrap; flex:none;
}
.hubtab.on{ color:var(--fg); border-color:var(--accent); background:rgba(56,139,253,.12); }
.spark{ display:flex; align-items:flex-end; gap:2px; height:56px; margin:8px 0 16px; }
.spark i{ flex:1; min-width:2px; border-radius:1px; opacity:.85; }
.minibar{ height:4px; background:var(--subtle); border-radius:2px; margin-top:6px; overflow:hidden; }
.minibar i{ display:block; height:100%; background:var(--accent); }

/* Commit CI status mark in the commit bar */
.cistate{ font-family:var(--mono); font-weight:700; flex:none; }

/* Tappable diff lines (PR line comments) and blame rows */
.cline{ cursor:pointer; }
.cline:active{ box-shadow:inset 2px 0 0 var(--accent); }
.blame .bwho{ cursor:pointer; }
.blame .bwho:active{ color:var(--accent-em); }

/* In-file find bar */
#findbar{ padding:8px 0 4px; display:flex; flex-direction:column; gap:6px; }
#findbar .findrow{ display:flex; align-items:center; gap:6px; }
#findbar input{ flex:1; font-size:14px; }
#findbar #findcount{ font-family:var(--mono); font-size:12px; color:var(--fg-muted); min-width:44px; text-align:center; }

/* Notifications */
.note{ display:flex; flex-direction:column; gap:3px; text-align:left; }
.note .nrepo{ font-size:12px; color:var(--fg-muted); font-family:var(--mono); }
.note .ntitle{ font-size:14px; color:var(--fg); }
.note .nreason{ font-size:11px; color:var(--accent-em); text-transform:capitalize; }
.note.unread .ntitle{ font-weight:600; }

/* Gists */
.gistrow .name{ font-family:var(--mono); font-size:13px; }
.gistfile{ margin:14px 0; }
.gistfile label{ display:block; font-family:var(--mono); font-size:12px; color:var(--fg-muted); margin-bottom:6px; }
.gistfile textarea{ width:100%; min-height:160px; font-family:var(--mono); font-size:13px; }

/* Blame */
.blame{ font-family:var(--mono); font-size:12px; line-height:1.5; overflow-x:auto; }
.blame .brow{ display:flex; gap:0; white-space:pre; }
.blame .bwho{ flex:none; width:150px; color:var(--fg-muted); overflow:hidden; text-overflow:ellipsis; border-right:1px solid var(--border); padding-right:8px; }
.blame .bsha{ color:var(--accent-em); }
.blame .bline{ padding-left:10px; color:var(--fg); }

/* Draft-restore banner: the app was closed mid-edit and a local copy survived. */
#draftbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4);
  border-bottom:0; padding:10px 12px; font-size:13px; color:var(--fg);
}
#draftbar .btn{ padding:4px 10px; font-size:12px; }

/* ── Editor: the highlight layer sits under a transparent textarea.
      Every metric below must match on both, or the text drifts. ── */
#edwrap{
  position:relative; min-height:52vh;
  border:1px solid var(--border);
  border-radius:0 0 var(--r) var(--r);
  background:var(--canvas);
  overflow:hidden;
}
#editor, #hl{
  margin:0; padding:12px 12px 12px 52px;   /* room for the line-number gutter */
  border:0; box-shadow:none;
  font-family:var(--mono); font-size:var(--edfs,12px); line-height:var(--edlh,20px);
  white-space:pre; overflow-wrap:normal; tab-size:2;
  box-sizing:border-box;
}
#hl{
  position:absolute; inset:0; overflow:hidden; pointer-events:none;
  color:var(--fg); background:transparent;
}
#hl code{ font:inherit; }
#editor{
  position:relative; width:100%; height:100%; min-height:52vh;
  overflow:auto; resize:none;
  background:transparent; color:transparent;
  caret-color:var(--fg); -webkit-text-fill-color:transparent;
}
#editor::selection{ background:rgba(68,147,248,.35); -webkit-text-fill-color:var(--fg); }
#editor:focus{ outline:none; box-shadow:none; }
#editor.plain{ color:var(--fg); -webkit-text-fill-color:var(--fg); }
#editor.plain + #hl, #hl.off{ display:none; }

/* line numbers */
#gut{
  position:absolute; top:0; left:0; bottom:0; width:44px;
  padding:12px 8px 12px 0;
  font-family:var(--mono); font-size:var(--edfs,12px); line-height:var(--edlh,20px);
  color:var(--fg-subtle); text-align:right;
  background:var(--canvas);
  border-right:1px solid var(--border);
  overflow:hidden; pointer-events:none;
  z-index:2;
}

/* ── Tokens: GitHub's own syntax palette ── */
.t-key { color:var(--t-key); }   /* keyword    */
.t-str { color:var(--t-str); }   /* string     */
.t-num { color:var(--t-num); }   /* number     */
.t-com { color:var(--t-com); }   /* comment    */
.t-fn  { color:var(--t-fn);  }   /* call site  */
.t-pun { color:var(--t-pun); }   /* punctuation*/
.t-tag { color:var(--t-tag); }   /* markup tag */
.t-att { color:var(--t-att); }   /* attribute  */

/* Editor themes. Default is GitHub dark; the others swap the token palette. */
:root{
  --t-key:#FF7B72; --t-str:#A5D6FF; --t-num:#79C0FF; --t-com:#8B949E;
  --t-fn:#D2A8FF;  --t-pun:#C9D1D9; --t-tag:#7EE787; --t-att:#79C0FF;
}
body.theme-mono{
  --t-key:#E6EDF3; --t-str:#ADBAC7; --t-num:#ADBAC7; --t-com:#6E7681;
  --t-fn:#E6EDF3;  --t-pun:#8B949E; --t-tag:#E6EDF3; --t-att:#ADBAC7;
}
body.theme-aurora{
  --t-key:#C792EA; --t-str:#C3E88D; --t-num:#F78C6C; --t-com:#546E7A;
  --t-fn:#82AAFF;  --t-pun:#89DDFF; --t-tag:#F07178; --t-att:#FFCB6B;
}

/* ══ Diff ════════════════════════════════════════════════════ */
.diff{
  border:1px solid var(--border); border-radius:var(--r);
  max-height:40vh; overflow:auto;
  font-family:var(--mono); font-size:12px; line-height:20px;
  margin-bottom:16px; white-space:pre;
}
.diff div{ padding:0 10px 0 22px; position:relative; }
.diff .add{ background:var(--add-bg); color:var(--add-fg); }
.diff .del{ background:var(--del-bg); color:var(--del-fg); }
.diff .ctx{ color:var(--fg-muted); }
.diff .add::before{ content:'+'; position:absolute; left:8px; color:var(--add-fg); }
.diff .del::before{ content:'\2212'; position:absolute; left:8px; color:var(--del-fg); }
.diff .gap{ color:var(--fg-subtle); background:var(--inset); text-align:center; padding:2px 0; }
.diffstat{ font-size:12px; color:var(--fg-muted); margin-bottom:8px; }
.diffstat .a{ color:var(--add-fg); font-weight:600; }
.diffstat .d{ color:var(--del-fg); font-weight:600; }

/* ══ Markdown, as GitHub renders it ══════════════════════════ */
.md{ padding:16px; font-size:15px; line-height:1.6; overflow-wrap:anywhere; word-break:break-word; }
.md img{ max-width:100%; height:auto; }
.md pre{ overflow-x:auto; max-width:100%; }
.md table{ display:block; overflow-x:auto; max-width:100%; }
.md a{ overflow-wrap:anywhere; }
.readme{ border:1px solid var(--border); border-radius:var(--r); }
.readme .rhead{
  display:flex; align-items:center; gap:8px;
  padding:12px 16px; border-bottom:1px solid var(--border);
  font-size:13px; font-weight:600; color:var(--fg);
}
.md h1,.md h2,.md h3{ font-weight:600; color:var(--fg); margin:24px 0 16px; line-height:1.25; }
.md h1{ font-size:26px; border-bottom:1px solid var(--border); padding-bottom:8px; }
.md h2{ font-size:20px; border-bottom:1px solid var(--border); padding-bottom:8px; }
.md h3{ font-size:16px; }
.md > :first-child{ margin-top:0; }
.md p{ margin:0 0 16px; }
.md ul,.md ol{ margin:0 0 16px; padding-left:24px; }
.md li{ margin-bottom:4px; }
.md code{ font-family:var(--mono); font-size:85%; background:var(--subtle); padding:.2em .4em; border-radius:var(--r); }
.md pre{ background:var(--subtle); border-radius:var(--r); padding:16px; overflow-x:auto; margin:0 0 16px; }
.md pre code{ background:none; padding:0; font-size:12px; }
.md blockquote{ border-left:.25em solid var(--border-lit); padding:0 1em; color:var(--fg-muted); margin:0 0 16px; }
.md hr{ border:0; border-top:1px solid var(--border); margin:24px 0; }
.md img{ max-width:100%; }
.md table{ border-collapse:collapse; margin-bottom:16px; font-size:14px; display:block; overflow-x:auto; }
.md th,.md td{ border:1px solid var(--border); padding:6px 13px; }
.md tr:nth-child(2n){ background:var(--inset); }

/* Boot splash — just the GitHub mark, held briefly on launch. */
.boot{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
.bootlogo{ color:var(--fg); animation:bootpulse 1.4s ease-in-out infinite; }
@keyframes bootpulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

/* App lock screen */
.lockwrap{ min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 28px; }
.lockwrap svg{ color:var(--fg-muted); }
.lockttl{ font-size:16px; font-weight:600; color:var(--fg); }
.lockwrap input{ width:100%; max-width:280px; text-align:center; letter-spacing:.3em; font-size:18px; }
.lockwrap .btn{ max-width:280px; }
.lockerr{ color:var(--red); font-size:13px; min-height:18px; }

/* Sign-in Help sheet */
.authhelp{ font-size:14px; line-height:1.5; color:var(--fg); }
.authhelp p{ margin:0 0 12px; }
.authhelp .ahsec{ font-weight:600; font-size:13px; margin:16px 0 6px; }
.authhelp ol.ahlist, .authhelp ul.ahlist{ margin:0 0 4px; padding-left:20px; display:flex; flex-direction:column; gap:6px; }
.authhelp .ahlist li{ line-height:1.45; }
.authhelp .dim{ color:var(--fg-muted); }
.authhelp .mono{ font-family:var(--mono); font-size:.9em; }

/* ══ Repo About panel — mirrors GitHub's sidebar, stacked for mobile ══ */
.repolayout{ display:flex; flex-direction:column; }
.repomain{ min-width:0; }
.about{ border:1px solid var(--border); border-radius:var(--r); margin-top:16px; text-align:left; }

/* Wide enough (i.e. Desktop view, which lays out at 1100px) → GitHub's
   two-column layout: file list on the left, About sidebar on the right. */
@media (min-width: 880px){
  .repolayout{ flex-direction:row; align-items:flex-start; gap:24px; }
  .repomain{ flex:1; }
  .reposide{ width:296px; flex:none; }
  .reposide .about{ margin-top:0; }
}
.about .rhead{
  display:flex; align-items:center; gap:8px;
  padding:12px 16px; border-bottom:1px solid var(--border);
  font-size:13px; font-weight:600; color:var(--fg);
}
.abbody{ padding:16px; display:flex; flex-direction:column; gap:12px; font-size:14px; }
.abbody .desc{ line-height:1.5; }
.abbody .muted, .abbody .desc.muted{ color:var(--fg-muted); }
.ablink{ font-size:13px; word-break:break-all; }
.topics{ display:flex; flex-wrap:wrap; gap:6px; }
.topic{ background:rgba(56,139,253,.15); color:var(--accent-em);
  border-radius:2em; padding:3px 10px; font-size:12px; }
.abstats{ display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--fg-muted); font-size:13px; }
.abstat b{ color:var(--fg); font-weight:600; }
.abmeta{ display:flex; flex-direction:column; gap:6px; color:var(--fg-muted); font-size:13px; }
.absec{ font-size:13px; font-weight:600; color:var(--fg); margin-top:4px; }
.langbar{ display:flex; height:8px; border-radius:6px; overflow:hidden; background:var(--subtle); }
.langseg{ height:100%; }
.langlegend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--fg-muted); }
.langitem{ display:flex; align-items:center; gap:5px; }
.langitem i{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
.langitem b{ color:var(--fg-muted); font-weight:400; }
.abrelease{ display:flex; align-items:center; gap:10px; background:none; border:0; padding:0; font:inherit; text-align:left; }
.abrelease .tag{ background:rgba(63,185,80,.15); color:var(--green-fg);
  border:1px solid rgba(63,185,80,.3); border-radius:2em; padding:2px 10px;
  font-size:12px; font-family:var(--mono); flex:none; }
.abrelease .rl{ color:var(--fg-muted); font-size:12px; }
.contribs{ display:flex; flex-wrap:wrap; gap:6px; }
.contrib{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--subtle); }

/* ══ Image preview ═══════════════════════════════════════════ */
.csvwrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--r); }
table.csv{ border-collapse:collapse; font-size:12px; font-family:var(--mono); width:100%; }
table.csv th, table.csv td{
  border:1px solid var(--border); padding:6px 10px; text-align:left; white-space:nowrap;
}
table.csv th{ background:var(--inset); color:var(--fg); font-weight:600; position:sticky; top:0; }
table.csv tr:nth-child(2n) td{ background:var(--inset); }
.csvmeta{ font-size:12px; color:var(--fg-muted); margin-top:8px; font-family:var(--mono); }
.svgview{
  border:1px solid var(--border); border-radius:var(--r);
  padding:24px; text-align:center;
  background:repeating-conic-gradient(var(--subtle) 0% 25%, var(--inset) 0% 50%) 50% / 16px 16px;
}
.svgview svg{ max-width:100%; height:auto; }

#imgview{
  padding:32px 16px; text-align:center;
  border:1px solid var(--border); border-radius:0 0 var(--r) var(--r);
}
#imgview img{
  max-width:100%;
  background:repeating-conic-gradient(var(--subtle) 0% 25%, var(--inset) 0% 50%) 50% / 16px 16px;
  border:1px solid var(--border);
}
#imgview .meta{ margin-top:12px; font-size:12px; color:var(--fg-muted); font-family:var(--mono); }

/* ══ A live run ══════════════════════════════════════════════ */
.runhead{
  border:1px solid var(--border); border-radius:var(--r);
  padding:16px; margin-bottom:16px;
}
.runhead .title{ font-size:16px; font-weight:600; color:var(--fg); margin-bottom:4px; }
.runhead .sub{ font-size:12px; color:var(--fg-muted); font-family:var(--mono); }
.runhead .state{ font-size:13px; font-weight:600; margin-top:10px; }
.runhead .state.ok  { color:var(--green-fg); }
.runhead .state.bad { color:var(--red); }
.runhead .state.wait{ color:var(--amber); }

.jobbox{ border:1px solid var(--border); border-radius:var(--r); margin-bottom:16px; overflow:hidden; }
.jobbox .jhead{
  display:flex; align-items:center; gap:8px;
  background:var(--inset); border-bottom:1px solid var(--border);
  padding:10px 16px; font-size:13px; font-weight:600;
}
.jobbox .jhead{ width:100%; text-align:left; cursor:pointer; }
.jobbox .jhead:hover{ background:var(--subtle); }
.jobbox .jhead .g{ width:16px; flex:none; text-align:center; font-size:11px; color:var(--fg-muted); }
.jobbox .jhead .g.live{ color:var(--amber); animation:pulse 1.4s ease-in-out infinite; }
.jobbox .jhead .jn{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jobbox .jhead .when{ font-family:var(--mono); font-size:11px; color:var(--fg-muted); font-weight:400; flex:none; }
.jobbox .jhead .chev{ color:var(--accent); font-size:12px; font-weight:500; flex:none; }

pre.log{
  background:var(--canvas);
  border:1px solid var(--border); border-radius:var(--r);
  padding:12px;
  max-height:60vh; overflow:auto;
  font-family:var(--mono); font-size:11px; line-height:1.6;
  color:var(--fg-muted); white-space:pre;
  margin-bottom:16px;
}

.step{
  display:flex; align-items:center; gap:10px;
  padding:8px 16px; border-top:1px solid var(--border);
  font-size:13px; color:var(--fg-muted);
}
.step:first-child{ border-top:0; }
.step .g{ width:16px; flex:none; text-align:center; font-size:11px; }
.step .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.step .t{ font-family:var(--mono); font-size:11px; color:var(--fg-subtle); flex:none; }

.step.done  { color:var(--fg); }
.step.done  .g{ color:var(--green-fg); }
.step.fail  { color:var(--fg); }
.step.fail  .g{ color:var(--red); }
.step.skip  .g{ color:var(--fg-subtle); }
.step.queue .g{ color:var(--fg-subtle); }

/* The step currently executing. A slow pulse, because something IS happening —
   but nothing spins, because we cannot know how far through it is. */
.step.live{ color:var(--fg); background:var(--inset); }
.step.live .g{ color:var(--amber); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }
@media (prefers-reduced-motion:reduce){ .step.live .g{ animation:none; } }

/* ══ New-repository option rows ══════════════════════════════ */
.reporow{
  display:flex; align-items:center; gap:12px;
  padding:12px 0; border-top:1px solid var(--border);
  font-size:14px; cursor:pointer;
}
.reporow:first-of-type{ border-top:0; }
.reporow > div{ flex:1; min-width:0; }
.reporow b{ color:var(--fg); font-weight:600; display:block; }
.reporow small{ color:var(--fg-muted); font-size:12px; }
.reporow .pick{ color:var(--accent); font-size:13px; font-weight:500; flex:none; }
.reporow.check .box{ flex:none; }

/* ══ Profile ═════════════════════════════════════════════════ */
.profhead{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.pavatar{ width:64px; height:64px; border-radius:50%; border:1px solid var(--border); }
.pname{ font-size:20px; font-weight:600; color:var(--fg); }
.plogin{ font-size:14px; color:var(--fg-muted); }
.pstats{ display:flex; gap:18px; padding:12px 0 20px; border-bottom:1px solid var(--border); margin-bottom:20px; font-size:13px; color:var(--fg-muted); }
.pstats b{ color:var(--fg); }

/* ══ Commit message suggestions ══════════════════════════════ */
.msgsuggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.msgchip{
  background:var(--inset); border:1px solid var(--border-lit); border-radius:2em;
  padding:4px 12px; font-size:12px; color:var(--fg-muted); cursor:pointer;
}
.msgchip:hover{ color:var(--fg); border-color:var(--fg-subtle); }

/* ══ Commit diff ═════════════════════════════════════════════ */
.commitmeta{
  border:1px solid var(--border); border-radius:var(--r);
  padding:14px 16px; margin-bottom:16px;
}
.commitmeta .msg{ font-size:16px; font-weight:600; color:var(--fg); margin-bottom:6px; }
.commitmeta .by{ font-size:12px; color:var(--fg-muted); }
.commitmeta .by .mono{ font-family:var(--mono); }
.commitmeta .diffstat{ margin-top:8px; font-size:12px; color:var(--fg-muted); }

.filediff{ border:1px solid var(--border); border-radius:var(--r); margin-bottom:16px; overflow:hidden; }
.fdhead{
  display:flex; align-items:center; gap:8px;
  background:var(--inset); border-bottom:1px solid var(--border);
  padding:8px 12px; font-size:12px;
}
.fdname{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:var(--mono); color:var(--fg); }
.fdstat{ flex:none; font-family:var(--mono); font-size:11px; }
.fdstat .a{ color:var(--add-fg); } .fdstat .d{ color:var(--del-fg); }
.fdnote{ padding:10px 12px; font-size:12px; color:var(--fg-muted); }

/* the diff rows reuse the editor diff palette */
.filediff .diff{ border:0; border-radius:0; max-height:50vh; margin:0; }

/* ══ PR preview ══════════════════════════════════════════════ */
.prevfiles{ border:1px solid var(--border); border-radius:var(--r); margin-top:8px; overflow:hidden; }
.prevfile{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; border-top:1px solid var(--border); font-size:12px;
}
.prevfile:first-child{ border-top:0; }
.prevfile .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); }
.prevfile .s{ flex:none; font-family:var(--mono); font-size:11px; }
.prevfile .a{ color:var(--add-fg); } .prevfile .d{ color:var(--del-fg); }

/* ══ About ═══════════════════════════════════════════════════ */
.about{ text-align:center; padding:8px 0 20px; }
.about .mark{
  width:56px; height:56px; margin:0 auto 12px;
  display:grid; place-items:center;
  background:#fff; color:#000; border-radius:12px;
  font-size:26px;
}
.about .name{ font-size:20px; font-weight:600; color:var(--fg); }
.about .ver{ font-size:12px; color:var(--fg-muted); font-family:var(--mono); margin-top:2px; }

.perms div{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding:10px 0 2px; border-top:1px solid var(--border);
  font-size:13px;
}
.perms div:first-child{ border-top:0; }
.perms div b{ color:var(--fg); font-weight:600; }
.perms div span{ font-family:var(--mono); font-size:11px; color:var(--accent); flex:none; }
.perms p{ font-size:12px; color:var(--fg-muted); margin:0 0 4px; line-height:1.5; }

/* ══ Issues ══════════════════════════════════════════════════ */
.issrow{
  display:flex; align-items:flex-start; gap:12px;
  width:100%; padding:12px 16px; border:0; border-top:1px solid var(--border);
  background:none; color:var(--fg); font:inherit; text-align:left; cursor:pointer;
}
.issrow:first-child{ border-top:0; }
.issrow:hover{ background:var(--subtle); }
.issrow .ic{ flex:none; font-size:15px; margin-top:1px; }
.issrow .ic.open{ color:var(--green-fg); }
.issrow .ic.closed{ color:#A371F7; }         /* GitHub's closed-issue purple */
.issrow .body{ flex:1; min-width:0; }
.issrow .t{ font-size:15px; font-weight:500; color:var(--fg); display:block; }
.issrow:hover .t{ color:var(--accent); }
.issrow .sub{ font-size:12px; color:var(--fg-muted); margin-top:2px; }

.statetabs{ display:flex; gap:16px; padding:0 0 12px; }
.statetabs button{
  background:none; border:0; color:var(--fg-muted); font:inherit; font-size:14px;
  font-weight:500; cursor:pointer; padding:4px 0;
}
.statetabs button.on{ color:var(--fg); font-weight:600; }

/* One issue and its thread */
.ihead{ border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:16px; }
.ihead .t{ font-size:22px; font-weight:600; color:var(--fg); }
.ihead .n{ color:var(--fg-muted); font-weight:400; }
.istate{
  display:inline-flex; align-items:center; gap:6px;
  border-radius:2em; padding:4px 12px; font-size:13px; font-weight:600;
  margin:10px 0; color:#fff;
}
.istate.open{ background:var(--green); }
.istate.closed{ background:#8250DF; }
.ihead .meta{ font-size:13px; color:var(--fg-muted); }

.comment{ border:1px solid var(--border); border-radius:var(--r); margin-bottom:12px; }
.comment .chead{
  background:var(--inset); border-bottom:1px solid var(--border);
  padding:8px 14px; font-size:13px; color:var(--fg-muted);
}
.comment .chead b{ color:var(--fg); font-weight:600; }
.comment .cbody{ padding:14px; }
.comment .cbody.md{ padding:14px; }

/* ══ Repo settings ═══════════════════════════════════════════ */
.setgroup{ margin-bottom:28px; }
.setgroup > h2{
  font-size:16px; font-weight:600; color:var(--fg);
  padding-bottom:8px; margin-bottom:12px; border-bottom:1px solid var(--border);
}
.setrow{ padding:12px 0; border-bottom:1px solid var(--border); }
.setrow:last-child{ border-bottom:0; }
.setrow .lbl{ font-size:14px; font-weight:600; color:var(--fg); }
.setrow .desc{ font-size:12px; color:var(--fg-muted); margin-top:2px; }
.setrow.toggle{ display:flex; align-items:flex-start; gap:12px; cursor:pointer; }
.setrow.toggle > div{ flex:1; min-width:0; }

.danger{
  border:1px solid var(--red); border-radius:var(--r);
  padding:0 16px; margin-top:8px;
}
.danger .setrow{ border-color:rgba(248,81,73,.25); }
.danger h2{ color:var(--red); border:0; }
.dangerrow{
  display:flex; align-items:center; gap:12px;
  padding:14px 0; border-top:1px solid rgba(248,81,73,.2);
}
.dangerrow:first-child{ border-top:0; }
.dangerrow > div{ flex:1; min-width:0; }
.dangerrow .lbl{ font-size:14px; font-weight:600; color:var(--fg); }
.dangerrow .desc{ font-size:12px; color:var(--fg-muted); margin-top:2px; }
.dangerrow .btn{ flex:none; border-color:var(--red); color:var(--red); }
.dangerrow .btn:hover{ background:var(--red); color:#fff; }

/* ══ Releases ════════════════════════════════════════════════ */
.rel{
  border:1px solid var(--border); border-radius:var(--r);
  padding:16px; margin-bottom:16px;
}
.rel .tagline{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.rel .tag{
  font-family:var(--mono); font-size:12px; color:var(--fg-muted);
  border:1px solid var(--border-lit); border-radius:2em; padding:1px 8px;
}
.rel .title{ font-size:18px; font-weight:600; color:var(--fg); margin-bottom:6px; }
.rel .title:hover{ color:var(--accent); }
.rel .by{ font-size:12px; color:var(--fg-muted); }
.rel .notes{ margin-top:12px; min-width:0; overflow-x:hidden; }
.rel{ min-width:0; overflow:hidden; }
.rel .notes.md{ padding:0; }

.badge{
  display:inline-block; border-radius:2em; padding:1px 8px;
  font-size:11px; font-weight:600; line-height:18px;
}
.badge.latest{ background:rgba(46,160,67,.15); color:var(--green-fg); border:1px solid var(--green-fg); }
.badge.pre   { background:rgba(210,153,34,.15); color:var(--amber);   border:1px solid var(--amber); }
.badge.draft { background:var(--subtle); color:var(--fg-muted); border:1px solid var(--border-lit); }

.assets{ border:1px solid var(--border); border-radius:var(--r); margin-top:16px; overflow:hidden; }
.assets .ahead{
  background:var(--inset); border-bottom:1px solid var(--border);
  padding:10px 16px; font-size:13px; font-weight:600;
}
.asset{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:12px 16px; border:0; border-top:1px solid var(--border);
  background:none; color:var(--fg); font:inherit; text-align:left;
}
.asset:first-of-type{ border-top:0; }
.asset:hover{ background:var(--subtle); }
.asset:hover .n{ color:var(--accent); text-decoration:underline; }
.asset .g{ flex:none; color:var(--fg-muted); }
.asset .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.asset .s{ flex:none; font-family:var(--mono); font-size:12px; color:var(--fg-muted); }
.asset .dl{ flex:none; font-size:11px; color:var(--fg-subtle); font-family:var(--mono); }

/* ══ Artifacts ═══════════════════════════════════════════════ */
.artbox{ border:1px solid var(--green-fg); border-radius:var(--r); overflow:hidden; margin-bottom:16px; }
.artbox .ahead{
  background:rgba(46,160,67,.12); border-bottom:1px solid var(--border);
  padding:10px 16px; font-size:13px; font-weight:600; color:var(--green-fg);
}
.art{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; border-top:1px solid var(--border);
  width:100%; background:none; border-left:0; border-right:0; border-bottom:0;
  color:var(--fg); font:inherit; text-align:left;
}
.art:first-of-type{ border-top:0; }
.art:hover{ background:var(--subtle); }
.art .g{ flex:none; color:var(--fg-muted); }
.art .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.art .s{ flex:none; font-family:var(--mono); font-size:12px; color:var(--fg-muted); }

/* ══ Status glyphs ═══════════════════════════════════════════ */
.run-ok::before   { content:'\25CF'; color:var(--green-fg); }
.run-bad::before  { content:'\2715'; color:var(--red); }
.run-wait::before { content:'\25CB'; color:var(--amber); }

/* ══ Bottom bar ══════════════════════════════════════════════ */
#bar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--canvas);
  border-top:1px solid var(--border);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:none;
}
#bar.on{ display:block; }
#barwrap{ max-width:1012px; margin:0 auto; display:flex; gap:8px; width:100%; }
#bar .btn{ flex:1; }
#bar .grow2{ flex:2; }

/* ══ Dialogs ═════════════════════════════════════════════════ */
#sheet{
  position:fixed; inset:0; z-index:40;
  background:rgba(1,4,9,.8);
  display:none; align-items:flex-end; justify-content:center;
}
#sheet.on{ display:flex; }
#sheetbox{
  width:100%; max-width:480px;
  background:var(--overlay);
  border:1px solid var(--border-lit);
  border-radius:12px 12px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto;
  animation:rise .16s ease-out;
}
@keyframes rise{ from{ transform:translateY(12px); opacity:0; } to{ transform:none; opacity:1; } }
@media (prefers-reduced-motion:reduce){ #sheetbox{ animation:none; } }

#sheettitle{
  font-size:14px; font-weight:600; color:var(--fg);
  padding-bottom:12px; margin-bottom:16px;
  border-bottom:1px solid var(--border);
  letter-spacing:0; text-transform:none;
}

/* The context strip inside a dialog: what you are about to act on. */
.overwrite{
  background:var(--inset); border:1px solid var(--border); border-radius:var(--r);
  padding:10px 12px; margin-bottom:16px;
  font-size:12px; color:var(--fg-muted); line-height:1.7;
  font-family:var(--mono);
}
.overwrite b{ color:var(--fg); font-weight:600; }

.sheetlist{ display:flex; flex-direction:column; gap:0; margin-bottom:16px; }
.sheetlist button{
  display:block; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--border);
  padding:12px 4px; min-height:var(--tap);
  color:var(--fg); font:inherit; font-size:14px; font-weight:500;
}
.sheetlist button:last-child{ border-bottom:0; }
.sheetlist button:hover{ color:var(--accent); }
.sheetlist button small{ display:block; color:var(--fg-muted); font-size:12px; font-weight:400; margin-top:2px; }
.sheetlist button.danger{ color:var(--red); }

/* ══ Progress ════════════════════════════════════════════════ */
.bar{ height:4px; background:var(--subtle); border-radius:3px; margin:16px 0 8px; overflow:hidden; }
.bar > i{ display:block; height:100%; width:0; background:var(--green-fg); transition:width .18s linear; }
@media (prefers-reduced-motion:reduce){ .bar > i{ transition:none; } }
.barstat{ display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--fg-muted); }
.barstat .now{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }

/* The list of files staged to attach to a new release. */
.attachlist{ display:flex; flex-direction:column; gap:6px; margin:8px 0; }
.attachrow{
  display:flex; align-items:center; gap:8px;
  background:var(--inset); border:1px solid var(--border);
  border-radius:var(--r); padding:8px 10px; font-size:13px;
}
.attachrow .an{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attachrow .as{ color:var(--fg-muted); font-family:var(--mono); font-size:11px; flex:none; }
.attachrow .ax{ background:none; border:none; color:var(--fg-muted); font-size:15px; cursor:pointer; padding:2px 6px; flex:none; }
.attachrow .ax:active{ color:var(--red); }

/* ══ Toast ═══════════════════════════════════════════════════ */
#toast{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:none; justify-content:center;
  padding:0 0 calc(88px + env(safe-area-inset-bottom));
  pointer-events:none;
}
#toast.on{ display:flex; }
#toastbox{
  max-width:calc(1012px - 32px); margin:0 16px;
  background:var(--overlay);
  border:1px solid var(--border-lit); border-radius:var(--r);
  box-shadow:0 8px 24px rgba(0,0,0,.6);
  padding:12px 14px; font-size:13px; line-height:1.5;
  pointer-events:auto;
}

/* ══ Empty states ════════════════════════════════════════════ */

<script>
/* ═══════════════════════════════════════════════════════════════
   gitfile — a GitHub repository file manager.

   Talks straight to the GitHub REST API from the browser. No server,
   no build step, one file. This is the prototype for the Kotlin app:
   every API call below maps 1:1 to a Retrofit method later.

   Contents:
     1. Storage shim        — where the token lives
     2. State
     3. Base64 (UTF-8 safe) — GitHub gives/takes base64
     4. GitHub API client   — every endpoint we use
     5. UI plumbing         — views, ref line, toast, sheet, action bar
     6. Screens             — auth, repos, tree, file
     7. Actions             — commit, create file, delete, branch, PR
   ═══════════════════════════════════════════════════════════════ */


/* ── 1. STORAGE SHIM ──────────────────────────────────────────
   Three hosts, three storage APIs:
     • inside the Android app    → window.Native (SharedPreferences)
     • inside a Claude artifact  → window.storage
     • a plain browser           → localStorage

   The Android path matters: a WebView's localStorage is flushed to disk
   lazily, so when Android kills the app to reclaim memory, a token written
   moments earlier can simply vanish. SharedPreferences commits when told to.
   If none are available we fall back to memory and the token doesn't survive
   a reload. All four look identical to callers.
   ──────────────────────────────────────────────────────────── */
const mem = {};

const store = {
  async get(k){
    try{
      // Native Android storage, when running inside the app.
      if (window.Native) return window.Native.get(k) || null;
      if (window.storage) {
        const r = await window.storage.get(k);
        return r ? r.value : null;
      }
      return localStorage.getItem(k);
    } catch { return mem[k] ?? null; }
  },
  async set(k, v){
    try{
      if (window.Native) { window.Native.set(k, v); return; }
      if (window.storage) { await window.storage.set(k, v); return; }
      localStorage.setItem(k, v);
    } catch { mem[k] = v; }
  },
  async del(k){
    try{
      if (window.Native) { window.Native.del(k); return; }
      if (window.storage) { await window.storage.delete(k); return; }
      localStorage.removeItem(k);
    } catch { delete mem[k]; }
  }
};

const TOKEN_KEY = 'gitfile:token';
const LOCK_KEY  = 'gitfile:lock';    // present ⇒ token is PIN-encrypted, app is locked

/* ── App lock crypto ──────────────────────────────────────────────────────
   When a PIN is set, the token is not stored in the clear: a key is derived
   from the PIN with PBKDF2 and the token is sealed with AES-GCM. Without the
   PIN the token can't be read, and a wrong PIN fails the GCM auth tag. Needs a
   secure context (localhost/https), which the app runs in. */
const _b64  = u8 => btoa(String.fromCharCode.apply(null, u8));
const _ub64 = s  => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function _pinKey(pin, salt){
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function sealToken(pin, token){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await _pinKey(pin, salt);
  const ct   = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(token));
  return JSON.stringify({ v:1, salt:_b64(salt), iv:_b64(iv), ct:_b64(new Uint8Array(ct)) });
}
async function openToken(pin, blob){
  const o   = typeof blob === 'string' ? JSON.parse(blob) : blob;
  const key = await _pinKey(pin, _ub64(o.salt));
  const pt  = await crypto.subtle.decrypt({ name:'AES-GCM', iv:_ub64(o.iv) }, key, _ub64(o.ct));
  return new TextDecoder().decode(pt);
}
const hasCrypto = () => !!(window.crypto && crypto.subtle);

/* The editor is dirty when the buffer differs from the fetched blob. */
const isDirty = () => !!S.file && S.buffer !== S.file.text;


/* ── 3. BASE64, UTF-8 SAFE ────────────────────────────────────
   btoa/atob only speak Latin-1. Anything with an emoji, an accent,
   or Tamil in it breaks unless we go through TextEncoder first.
   ──────────────────────────────────────────────────────────── */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  // chunk it: String.fromCharCode(...huge) blows the call stack
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

function b64decode(b64){
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder('utf-8', { fatal:false }).decode(bytes);
}

/* A blob is "binary" if it contains a NUL byte. Crude, but it is
   what git itself does, and it is right often enough. */
function looksBinary(b64){
  const bin = atob(b64.replace(/\s/g, '').slice(0, 8000));
  return bin.includes('\0');
}


/* ── 4. GITHUB API CLIENT ─────────────────────────────────────
   One fetch wrapper. Every call goes through it so the rate-limit
   header and error shape are handled in exactly one place.
   ──────────────────────────────────────────────────────────── */
const API = 'https://api.github.com';

async function gh(path, opts = {}){
  const res = await fetch(API + path, {
    method: opts.method || 'GET',

    // Without this the WebView happily serves the directory listing it fetched
    // before your last commit, and the file you just created appears to be
    // missing — it is on GitHub, you are just looking at a cached copy.
    //
    // This must stay a fetch OPTION. Do not "improve" it into a
    // Cache-Control: no-cache request header: that is a non-simple header, so it
    // forces a CORS preflight, and GitHub's preflight does not list Cache-Control
    // as an allowed header. The browser then blocks every request before it
    // leaves the device and fetch() fails with a bare "Failed to fetch".
    cache: 'no-store',

    headers: {
      'Authorization': 'Bearer ' + S.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {})
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });

  // GitHub reports your remaining hourly budget on every response.
  const left = res.headers.get('x-ratelimit-remaining');
  if (left !== null) { S.quota = left; paintQuota(); }
  // Classic tokens report their scopes here; fine-grained tokens leave it empty.
  const scopes = res.headers.get('x-oauth-scopes');
  if (scopes !== null) S.scopes = scopes;

  if (res.status === 204) return null;              // e.g. empty delete

  const data = await res.json().catch(() => null);

  if (!res.ok) {
    const err = new Error(ghMessage(res.status, data));
    err.status = res.status;
    err.raw = data;                 // keep GitHub's exact payload for diagnosis
    throw err;
  }
  return data;
}

/* Turn GitHub's error payloads into something a person can act on. */
function ghMessage(status, data){
  if (status === 401) return 'Token rejected by GitHub' + (data?.message ? ': ' + data.message : '') + '. Check it was pasted in full.';
  if (status === 403 && S.quota === '0') return 'Rate limit reached. It resets within the hour.';
  if (status === 403) {
    // GitHub usually says exactly what is wrong — "Dependabot alerts are
    // disabled for this repository", "Advanced Security must be enabled", and
    // so on. Its message beats any guess we could make, so lead with it.
    return data?.message
      ? data.message.replace(/\.$/, '') + '.'
      : 'Token lacks permission for this. Contents, Pull requests and Administration all need to be read and write.';
  }
  if (status === 404) {
    return data?.message && !/^not found$/i.test(data.message)
      ? data.message.replace(/\.$/, '') + '.'
      : 'Not found — or the token cannot see this repository.';
  }
  if (status === 409) return 'Conflict. The branch moved. Reopen the file to get the current version.';
  if (status === 410) return 'This feature is turned off for the repository.';
  if (status === 422) {
    // GitHub's validation errors are often just a bare code like "invalid" with
    // no message. Turn the useless ones into something actionable.
    const parts = (data?.errors || []).map(e =>
      e.message || (e.field ? `${e.field}: ${e.code}` : e.code)).filter(Boolean);
    const detail = parts.join('. ');
    if (!detail || detail === 'invalid') {
      return data?.message
        ? data.message + '.'
        : 'GitHub rejected the request as invalid. If this is Issues, they may be turned off for the repository — enable them in Settings.';
    }
    return (data?.message ? data.message + ': ' : '') + detail;
  }
  return data?.message || ('Request failed (' + status + ')');
}

  issueComments: (o, r, n)   => gh(`/repos/${o}/${r}/issues/${n}/comments?per_page=100`),
  makeIssue: (o, r, body)    => gh(`/repos/${o}/${r}/issues`, { method:'POST', body }),
  comment:   (o, r, n, body) => gh(`/repos/${o}/${r}/issues/${n}/comments`, { method:'POST', body }),
  patchIssue:(o, r, n, body) => gh(`/repos/${o}/${r}/issues/${n}`, { method:'PATCH', body }),

  /* Repo settings. patchRepo already exists for visibility; these round it out. */
  setDefaultBranch: (o, r, branch) => gh(`/repos/${o}/${r}`, { method:'PATCH', body:{ default_branch: branch } }),
  deleteRepo:(o, r)          => gh(`/repos/${o}/${r}`, { method:'DELETE' }),
  rerun:     (o, r, id) => gh(`/repos/${o}/${r}/actions/runs/${id}/rerun`,   { method:'POST' }),

  delRef:    (o, r, branch) =>
               gh(`/repos/${o}/${r}/git/refs/heads/${enc(branch)}`, { method:'DELETE' })
};


/* ── ONE COMMIT, MANY FILES ───────────────────────────────────
   The contents API is one-file-per-commit, which is fine for editing but
   absurd for uploading a folder — thirty files would mean thirty commits.

   Git's own model is four objects deep, so we build it the way git does:
     1. find where the branch currently points          (a commit)
     2. that commit names a tree                        (the whole file listing)
     3. upload each new file's bytes                    (a blob per file)
     4. lay the changes over the old tree               (a new tree)
     5. wrap that tree in a commit, parented on the old (a new commit)
     6. move the branch to point at it                  (update the ref)

   A `null` sha in the tree means "this path is gone", so deletion comes free.

   entries: [{ path, b64 }] to add or replace
            [{ path, delete:true }] to remove
   ──────────────────────────────────────────────────────────── */
async function commitFiles(entries, message, onProgress){
  const o = S.repo.owner, r = S.repo.name;

  const head = (await api.ref(o, r, S.branch)).object.sha;
  const base = (await api.commit(o, r, head)).tree.sha;

  const tree = [];
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (onProgress) onProgress(i, entries.length, e.path);

    if (e.delete) {
      tree.push({ path: e.path, mode: '100644', type: 'blob', sha: null });
    } else if (e.sha) {
      // A move/copy: point the new path at a blob that already exists. No
      // upload, no download — git just references the same object.
      tree.push({ path: e.path, mode: e.mode || '100644', type: 'blob', sha: e.sha });
    } else {
      // b64 is already here for files the browser read; for a folder picked through
      // Android it is fetched now, one file at a time.
      const b64 = (e.b64 != null) ? e.b64 : await nativeB64(e.index);
      const blob = await api.makeBlob(o, r, { content: b64, encoding: 'base64' });
      tree.push({ path: e.path, mode: '100644', type: 'blob', sha: blob.sha });
    }
  }

  const newTree = await api.makeTree(o, r, { base_tree: base, tree });
  const commit  = await api.makeCommit(o, r, {
    message, tree: newTree.sha, parents: [head]
  });
  await api.moveRef(o, r, S.branch, commit.sha);
  return commit;
}

/* Encode a path but keep the slashes — they're structure, not data. */
const enc = p => p.split('/').map(encodeURIComponent).join('/');


/* ── 5. UI PLUMBING ───────────────────────────────────────── */
const $ = id => document.getElementById(id);

function show(view){
  // A run screen left behind would go on polling GitHub every four seconds for
  // as long as the app is open. Stop it the moment we navigate away.
  if (view !== 'run' && S.poll) { clearTimeout(S.poll); S.poll = null; }

  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('v-' + view).classList.add('on');
  S.view = view;
  window.scrollTo(0, 0);
}

/* ── Android's back button ────────────────────────────────────────────────
   MainActivity asks this before it closes the app. Return true if we handled it.

   There is no history stack because there is no navigation — the app swaps views
   in place. So instead of replaying history, back walks the hierarchy the user
   can actually see: sheet → editor → folder → parent folder → repo list → out.
   ──────────────────────────────────────────────────────────────────────── */
window.appBack = () => {
  // A sheet is always the topmost thing.
  if ($('sheet').classList.contains('on')) { closeSheet(); return true; }

  switch (S.view) {
    case 'file':
      backToTree();
      return true;

    case 'run':
      openActions();
      return true;

    case 'release':
      openReleases();
      return true;

    case 'issue':
      openIssues(S.issueState || 'open');
      return true;

    case 'settings':
      loadTree(S.path);
      return true;

    case 'profile':
    case 'allsearch':
    case 'notes':
    case 'gists':
    case 'discover':
      openRepos();
      return true;

    case 'gist':
      openGists();
      return true;

    case 'blame':
      if (S.file) { openFile(S.file.path); return true; }
      loadTree(S.path);
      return true;

    case 'commit':
      openLog(null);
      return true;

    case 'search':
    case 'log':
    case 'actions':
    case 'prs':
    case 'releases':
    case 'issues':
      loadTree(S.path);
      return true;

    case 'prfiles':
      openPRs();
      return true;

    case 'projects':
    case 'security':
    case 'insights':
      loadTree(S.path);
      return true;

    case 'project':
      openProjects();
      return true;

    case 'tree':
      if (S.path) {
        // Up one directory, rather than all the way out of the repo.
        loadTree(S.path.split('/').slice(0, -1).join('/'));
        return true;
      }
      openRepos();
      return true;

    case 'repos':
    case 'auth':
    default:
      return false;      // nothing left — let Android close the app
  }
};

/* The ref line — prints exactly where you are, in git's own terms. */
function paintRef(){
  const c = $('coord');

  if (!S.user) { c.innerHTML = '<span class="dim">not signed in</span>'; paintTabs(); return; }
  if (!S.repo) { c.innerHTML = `<span class="owner">${S.user.login}</span>`; paintTabs(); return; }

  c.innerHTML =
      `<span class="owner">${S.repo.owner}</span>`
    + `<span class="sep">/</span>`
    + `<span class="repo">${S.repo.name}</span>`
    + (S.repo.private ? '<span class="pill">Private</span>' : '');

  $('dirty').classList.toggle('on', isDirty() || isMoved());
  paintTabs();
}

/* ── Tabs ─────────────────────────────────────────────────────────────────
   GitHub's own navigation, minus the parts this app does not do. They appear
   only once a repo is open, because before that there is nothing to navigate.
   ──────────────────────────────────────────────────────────────────────── */
const TABS = [
  { id:'code',    label:'Code',          go:() => loadTree(S.path) },
  { id:'issues',  label:'Issues',        go:openIssues },
  { id:'prs',     label:'Pull requests', go:openPRs },
  { id:'actions', label:'Actions',       go:openActions },
  { id:'projects',label:'Projects',      go:openProjects },
  { id:'security',label:'Security',      go:openSecurity },
  { id:'insights',label:'Insights',      go:openInsights },
  { id:'releases',label:'Releases',      go:openReleases },
  { id:'search',  label:'Search',        go:openSearch },
  { id:'log',     label:'History',       go:() => openLog(null) }
];

function paintTabs(){
  const t = $('tabs');
  if (!S.repo) { t.innerHTML = ''; return; }

  // As far as the tab strip is concerned, the file editor is still "Code".
  let here = (S.view === 'tree' || S.view === 'file') ? 'code' : S.view;
  if (here === 'run')      here = 'actions';    // a run belongs to Actions
  if (here === 'release')  here = 'releases';   // and a release to Releases
  if (here === 'issue')    here = 'issues';     // and an issue to Issues
  if (here === 'settings') here = 'code';       // settings has no tab of its own
  if (here === 'project')  here = 'projects';   // a board belongs to Projects

  t.innerHTML = '';
  TABS.forEach(tab => {
    const b = document.createElement('button');
    b.textContent = tab.label;
    b.className = tab.id === here ? 'on' : '';
    b.onclick = tab.go;
    t.appendChild(b);
  });
}


function paintQuota(){
  $('quota').textContent = S.quota !== null ? S.quota + '⁄h' : '';
}

let toastTimer;
function toast(msg, ms = 4200){
  $('toastbox').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('on'), ms);
}

/* Bottom bar: rebuilt per screen from a list of {label, solid, onClick}. */
function setBar(buttons){
  const wrap = $('barwrap');
  wrap.innerHTML = '';
  if (!buttons || !buttons.length) { $('bar').classList.remove('on'); return; }
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.solid ? ' solid' : '') + (b.grow ? ' grow2' : '');
    el.textContent = b.label;
    el.disabled = !!b.disabled;
    el.onclick = b.onClick;
    if (b.id) el.id = b.id;
    wrap.appendChild(el);
  });
  $('bar').classList.add('on');
}

/* Sheet: a bottom drawer used for every form that isn't a screen. */
function sheet(title, html, wire){
  $('sheettitle').textContent = title;
  $('sheetbody').innerHTML = html;
  $('sheet').classList.add('on');
  if (wire) wire();
  const first = $('sheetbody').querySelector('input, textarea');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeSheet(){ $('sheet').classList.remove('on'); }

$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function busy(btn, on, label){
  if (!btn) return;
  btn.disabled = on;
  if (on) { if (!btn.dataset.was) btn.dataset.was = btn.textContent; btn.textContent = label || 'Working…'; }
  else if (btn.dataset.was) { btn.textContent = btn.dataset.was; }
}

$('authhelp').onclick = authHelp;

$('signin').onclick = async () => {
  // Mobile keyboards and clipboards love to add a trailing space or newline,
  // and GitHub rejects the token outright if one sneaks in.
  const t = $('tok').value.replace(/\s+/g, '');
  if (!t) { toast('Paste a token first.'); return; }

  // A fine-grained token starts github_pat_ and is ~93 characters; a classic one
  // starts ghp_. If it doesn't look like either, the paste was probably truncated.
  if (!/^(github_pat_|ghp_|gho_|ghs_)/.test(t)) {
    toast('That does not look like a GitHub token. It should begin with github_pat_ or ghp_.');
    return;
  }

  const btn = $('signin');
  busy(btn, true, 'Checking…');
  S.token = t;

  try {
    S.user = await api.me();

    if ($('remember').checked) {
      await store.set(TOKEN_KEY, t);
      await store.del(LOCK_KEY);        // a fresh token replaces any old PIN lock
      // Read it straight back. If storage silently dropped it, say so now rather
      // than letting you discover it the next time you open the app.
      const back = await store.get(TOKEN_KEY);
      if (back !== t) toast('Signed in, but this device would not save the token. You will need to paste it again next time.', 6000);
    } else {
      await store.del(TOKEN_KEY);
      await store.del(LOCK_KEY);
    }

    $('tok').value = '';
    paintTokCount();
    paintRef();
    await openRepos();
  } catch (e) {
    S.token = null;
    toast(e.message, 6000);
  } finally {
    busy(btn, false);
  }
};

/* Live character count — the fastest way to spot a paste that got truncated.
   A fine-grained token is 93 characters. */
function paintTokCount(){
  const n = $('tok').value.replace(/\s+/g, '').length;
  $('tokcount').textContent = n + (n === 1 ? ' character' : ' characters');
}
$('tok').addEventListener('input', paintTokCount);

$('tokshow').onclick = () => {
  const f = $('tok');
  const shown = f.classList.toggle('plain');
  $('tokshow').textContent = shown ? 'hide' : 'show';
};

$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('signin').click(); });

async function signOut(){
  await store.del(TOKEN_KEY);
  await store.del(LOCK_KEY);          // turning off the account also turns off the lock
  Object.assign(S, { token:null, user:null, repo:null, branch:null, path:'', file:null, buffer:'' });
  paintRef();
  setBar(null);
  show('auth');
}
