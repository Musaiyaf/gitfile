/* ── In-file find / replace / go-to-line ──────────────────────────────────*/
let FIND = { q:'', hits:[], idx:-1 };
function toggleFind(){
  const bar = $('findbar');
  const on = bar.style.display === 'none';
  bar.style.display = on ? 'flex' : 'none';
  $('replrow').style.display = (on && S.editing) ? 'flex' : 'none';   // replace needs edit mode
  if (on) { $('findq').value = FIND.q || ''; runFind(); $('findq').focus(); }
}
function edLineHeight(){
  return parseInt(getComputedStyle($('editor')).lineHeight) || 20;
}
function runFind(){
  const q = $('findq').value;
  FIND.q = q; FIND.hits = [];

  // ":42" jumps straight to a line rather than searching for text.
  const jump = /^:(\d+)$/.exec(q);
  if (jump) { gotoLine(parseInt(jump[1], 10)); $('findcount').textContent = 'ln'; return; }

  if (q) {
    const hay = (S.buffer || '').toLowerCase(), needle = q.toLowerCase();
    let i = hay.indexOf(needle);
    while (i !== -1) { FIND.hits.push(i); i = hay.indexOf(needle, i + needle.length); }
  }
  FIND.idx = FIND.hits.length ? 0 : -1;
  if (FIND.idx >= 0) gotoHit(); else paintFind();
}
function paintFind(){
  $('findcount').textContent = FIND.hits.length ? (FIND.idx + 1) + '/' + FIND.hits.length : '0/0';
}
function gotoHit(){
  const ed = $('editor');
  const start = FIND.hits[FIND.idx], end = start + FIND.q.length;
  ed.focus();
  ed.setSelectionRange(start, end);
  const linesBefore = (S.buffer.slice(0, start).match(/\n/g) || []).length;
  ed.scrollTop = Math.max(0, linesBefore * edLineHeight() - ed.clientHeight / 2);
  paintFind();
}
function gotoLine(n){
  const ed = $('editor');
  const lines = (S.buffer || '').split('\n');
  const target = Math.max(1, Math.min(n, lines.length));
  const start = lines.slice(0, target - 1).join('\n').length + (target > 1 ? 1 : 0);
  const end = start + (lines[target - 1] ? lines[target - 1].length : 0);
  ed.focus();
  ed.setSelectionRange(start, end);
  ed.scrollTop = Math.max(0, (target - 1) * edLineHeight() - ed.clientHeight / 2);
}
function findStep(d){
  if (!FIND.hits.length) return;
  FIND.idx = (FIND.idx + d + FIND.hits.length) % FIND.hits.length;
  gotoHit();
}
function replaceOne(){
  if (!S.editing || FIND.idx < 0 || !FIND.hits.length) return;
  const ed = $('editor');
  const start = FIND.hits[FIND.idx], end = start + FIND.q.length;
  const rep = $('replq').value;
  ed.value = ed.value.slice(0, start) + rep + ed.value.slice(end);
  ed.dispatchEvent(new Event('input'));           // sync buffer, highlight, draft
  runFind();                                       // recompute remaining hits
}
function replaceAll(){
  if (!S.editing || !FIND.q) return;
  const ed = $('editor');
  const rep = $('replq').value;
  // Case-insensitive literal replace.
  const re = new RegExp(FIND.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const before = ed.value;
  const after = before.replace(re, rep);
  const count = (before.match(re) || []).length;
  ed.value = after;
  ed.dispatchEvent(new Event('input'));
  runFind();
  toast(count ? ('Replaced ' + count) : 'Nothing to replace');
}

/* ── Editor helpers: tab-to-indent, auto-indent on Enter ──────────────────*/
function insertAtCursor(ed, text){
  const s = ed.selectionStart, e = ed.selectionEnd;
  ed.value = ed.value.slice(0, s) + text + ed.value.slice(e);
  ed.selectionStart = ed.selectionEnd = s + text.length;
  ed.dispatchEvent(new Event('input'));
}
$('editor').addEventListener('keydown', e => {
  const ed = e.target;
  if (ed.readOnly) return;
  if (e.key === 'Tab') {
    e.preventDefault();
    insertAtCursor(ed, '  ');                       // two spaces, not a focus jump
  } else if (e.key === 'Enter') {
    const pos = ed.selectionStart;
    const lineStart = ed.value.lastIndexOf('\n', pos - 1) + 1;
    const indent = (ed.value.slice(lineStart, pos).match(/^[ \t]*/) || [''])[0];
    if (indent) { e.preventDefault(); insertAtCursor(ed, '\n' + indent); }   // keep indentation
  }
});

/* ── Blame (GraphQL) ──────────────────────────────────────────────────────*/
async function openBlame(){
  if (!S.file) return;
  show('blame');
  const v = $('v-blame');
  v.innerHTML = '<div class="empty">Loading blame…</div>';
  setBar([{ label:'Back', onClick:() => openFile(S.file.path), solid:true }]);
  try {
    const res = await api.blame(S.repo.owner, S.repo.name, S.branch, S.file.path);
    const obj = res && res.data && res.data.repository && res.data.repository.object;
    const ranges = obj && obj.blame && obj.blame.ranges;
    if (!ranges || !ranges.length) { v.innerHTML = '<div class="empty">No blame available for this file.</div>'; return; }

    const byLine = [];
    ranges.forEach(r => { for (let ln = r.startingLine; ln <= r.endingLine; ln++) byLine[ln] = r.commit; });

    const lines = (S.file.text || '').split('\n');
    const rows = lines.map((line, i) => {
      const c = byLine[i + 1];
      const oid = c ? (c.abbreviatedOid || '') : '';
      const who = c
        ? `<span class="bsha">${esc(oid)}</span> ${esc((c.author && c.author.name) || '')}`
        : '';
      return `<div class="brow"><span class="bwho" data-oid="${esc(oid)}">${who}</span><span class="bline">${esc(line) || '&nbsp;'}</span></div>`;
    }).join('');
    v.innerHTML = `<h1>Blame · ${esc(S.file.path.split('/').pop())}</h1>
      <p class="hint" style="margin-top:-8px">Tap a commit id to open it.</p>
      <div class="blame">${rows}</div>`;
    // Tapping the commit id opens that commit (GitHub resolves the short sha).
    v.querySelectorAll('.bwho[data-oid]').forEach(el => el.onclick = () => {
      if (el.dataset.oid) openCommit(el.dataset.oid, () => openBlame());
    });
  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message || 'Blame failed.')}</div>`;
  }
}

/* The template lists, fetched once and kept for the session. */
let GITIGNORES = null, LICENSES = null;

async function newRepoSheet(keep){
  // What the repo will be initialised with. GitHub calls these "auto-init
  // choices"; we track them here as the pickers change them. On a fresh open we
  // start clean; when returning from the .gitignore / license picker we keep
  // what was already chosen and typed (keep === true).
  if (!keep || !S.newRepo) {
    S.newRepo = { gitignore: '', license: '', gitignoreLabel: 'None',
                  licenseLabel: 'None', readme: true, private: true,
                  name: '', desc: '' };
  }
  const R = S.newRepo;

  sheet('New repository', `
    <div class="field">
      <label for="rname">Repository name *</label>
      <input type="text" id="rname" placeholder="my-project" spellcheck="false" autocapitalize="off">
    </div>

    <div class="field">
      <label for="rdesc">Description</label>
      <input type="text" id="rdesc" placeholder="Optional">
    </div>

    <div class="reporow" id="row-vis">
      <div><b>Visibility</b><small id="vis-sub">Private — only you can see it</small></div>
      <span class="pick" id="vis-val">Private ▾</span>
    </div>

    <label class="reporow check" style="cursor:pointer">

      <input type="checkbox" id="r-readme" checked>
      <span class="box"></span>
    </label>

    <div class="reporow" id="row-ignore">
      <div><b>Add .gitignore</b><small id="ign-sub">None</small></div>
      <span class="pick" id="ign-val">Choose ▾</span>
    </div>

    <div class="reporow" id="row-license">

      <span class="pick" id="lic-val">Choose ▾</span>

    <button class="btn solid wide" id="rgo">Create repository</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    // Repopulate from state so a round-trip through a picker doesn't wipe the
    // name, description, visibility, or the other choice.
    $('rname').value      = R.name || '';
    $('rdesc').value      = R.desc || '';
    $('r-readme').checked = R.readme;
    $('vis-val').textContent = (R.private ? 'Private' : 'Public') + ' ▾';
    $('vis-sub').textContent = R.private ? 'Private — only you can see it'
                                         : 'Public — anyone can see it';
    $('ign-sub').textContent = R.gitignoreLabel || 'None';
    $('ign-val').textContent = (R.gitignore ? 'Change' : 'Choose') + ' ▾';
    $('lic-sub').textContent = R.licenseLabel || 'None';
    $('lic-val').textContent = (R.license ? 'Change' : 'Choose') + ' ▾';

    // Keep the text fields in state as they're typed, so they survive the jump
    // to a picker and back.
    $('rname').oninput = e => { R.name = e.target.value; };
    $('rdesc').oninput = e => { R.desc = e.target.value; };

    $('rgo').onclick = doNewRepo;

    $('row-vis').onclick = () => {
      const priv = !R.private;
      R.private = priv;
      $('vis-val').textContent = (priv ? 'Private' : 'Public') + ' ▾';
      $('vis-sub').textContent = priv ? 'Private — only you can see it'
                                      : 'Public — anyone can see it';
    };

    $('r-readme').onchange = e => { R.readme = e.target.checked; };

    $('row-ignore').onclick  = () => { saveRepoForm(); pickTemplate('gitignore'); };

/* Snapshot the typed fields before navigating away to a picker sheet, so the
   form comes back intact. repoFormBack is what the picker calls once a template
   is chosen — its absence was why choosing a .gitignore or license did nothing. */
function saveRepoForm(){
  if (!S.newRepo) return;
  if ($('rname')) S.newRepo.name = $('rname').value;
  if ($('rdesc')) S.newRepo.desc = $('rdesc').value;
}
const repoFormBack = () => newRepoSheet(true);

/* A searchable picker, the way GitHub does it — the list is long enough that
   scrolling it is pointless without a filter. */
async function pickTemplate(kind){
  const title = kind === 'gitignore' ? 'Choose a .gitignore template' : 'Choose a license';

  sheet(title, '<div class="empty">Loading…</div>');

  let items;
  try {
    if (kind === 'gitignore') {
      GITIGNORES = GITIGNORES || await api.gitignoreList();
      items = ['None', ...GITIGNORES];
    } else {
      LICENSES = LICENSES || await api.licenseList();
      items = [{ key:'', name:'None' }, ...LICENSES];
    }
  } catch (e) {
    $('sheetbody').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }

  const render = filter => {
    const f = filter.toLowerCase();
    const list = kind === 'gitignore'
      ? items.filter(n => n.toLowerCase().includes(f))
      : items.filter(l => l.name.toLowerCase().includes(f));

    return list.slice(0, 200).map(it => {
      const label = kind === 'gitignore' ? it : it.name;
      const value = kind === 'gitignore' ? (it === 'None' ? '' : it) : it.key;
      return `<button class="row" data-v="${esc(value)}" data-l="${esc(label)}">
                <span class="name">${esc(label)}</span></button>`;
    }).join('');
  };

  $('sheetbody').innerHTML = `
    <input type="text" id="tpl-q" placeholder="Search…" spellcheck="false" autocapitalize="off">
    <div id="tpl-list" style="max-height:52vh; overflow:auto; margin-top:8px"></div>`;

  const paint = () => { $('tpl-list').innerHTML = render($('tpl-q').value); wire(); };
  const wire = () => {
    $('tpl-list').querySelectorAll('.row').forEach(el => {
      el.onclick = () => {
        const v = el.dataset.v, l = el.dataset.l;
        if (kind === 'gitignore') { S.newRepo.gitignore = v; S.newRepo.gitignoreLabel = l; }
        else                      { S.newRepo.license   = v; S.newRepo.licenseLabel   = l; }
        repoFormBack();
      };
    });
  };

  $('tpl-q').addEventListener('input', paint);
  paint();
  setTimeout(() => $('tpl-q').focus(), 60);
}

async function doNewRepo(){
  const btn  = $('rgo');
  const r    = S.newRepo;
  const name = ($('rname') ? $('rname').value : r.name).trim();
  if (!name) { toast('A repository needs a name.'); return; }
  r.name = name;
  r.desc = ($('rdesc') ? $('rdesc').value : r.desc).trim();

  busy(btn, true, 'Creating…');
  try {
    const body = {
      name,
      description: r.desc,
      private:     r.private,
      // README, .gitignore and license each create the initial commit; force
      // auto_init on regardless, because without a first commit the repo has no
      // branch and there is nothing to open.
      auto_init:   true
    };
    if (r.gitignore) body.gitignore_template = r.gitignore;
    if (r.license)   body.license_template   = r.license;

    const repo = await api.createRepo(body);

    S.newRepo = null;
    closeSheet();
    toast('Created ' + repo.full_name);
    await openRepo({
      owner: repo.owner.login,
      name: repo.name,
      default_branch: repo.default_branch,
      private: repo.private
    });
  } catch (e) {
    toast(e.status === 422 ? 'That name is already taken, or is not allowed.' : e.message, 6000);
  } finally {
    busy(btn, false);
  }
}

  `, () => { $('fgo').onclick = doNewFolder; });
}

async function doNewFolder(){
  const btn  = $('fgo');
  const path = $('fpath').value.trim().replace(/^\/+|\/+$/g, '');
  if (!path) { toast('Name the folder.'); return; }

  busy(btn, true, 'Creating…');
  try {
    await api.putFile(S.repo.owner, S.repo.name, path + '/.gitkeep', {
      message: 'Add ' + path + '/',
      content: '',
      branch:  S.branch
    });
    closeSheet();
    toast('Created ' + path + '/');
    await loadTree(S.path);

/* --- 7a6. Upload ---------------------------------------------
   Files come in as Blobs from an <input type=file>, or as a JSON payload
   from the Android folder picker. Either way they end up as one commit.
   ------------------------------------------------------------ */
$('filepick').addEventListener('change', e => takeFiles([...e.target.files]));
$('dirpick').addEventListener('change',  e => takeFiles([...e.target.files]));

function fileToB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    // readAsDataURL gives "data:...;base64,XXXX" — we want only the XXXX.
    r.onload  = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Could not read ' + file.name));
    r.readAsDataURL(file);
  });
}

async function takeFiles(files){
  $('filepick').value = '';
  $('dirpick').value  = '';
  if (!files.length) return;

  toast('Reading ' + files.length + ' file' + (files.length === 1 ? '' : 's') + '…');
  try {
    const here = S.path ? S.path + '/' : '';
    const entries = [];
    for (const f of files) {
      // webkitRelativePath is set when the browser picked a whole directory;
      // it preserves the structure. A plain file picker leaves it empty.
      const rel = f.webkitRelativePath || f.name;
      entries.push({ path: here + rel, b64: await fileToB64(f) });
    }

    const final = await checkCollisions(entries);
    if (final) uploadSheet(final);
  } catch (e) {
    toast(e.message, 6000);
  }
}

function pickFolder(){
  closeSheet();
  if (window.Native && window.Native.pickFolder) {
    // Android has no directory mode in its file picker, so the app opens the
    // system folder picker natively and hands the contents back.
    toast('Reading folder…');
    window.Native.pickFolder();
  } else {
    $('dirpick').click();       // browsers support webkitdirectory directly
  }
}

/* Called by MainActivity once it has walked the chosen folder. */
window.onFolderPicked = (json) => {
  let files;
  try { files = JSON.parse(json); }
  catch { toast('Could not read that folder.'); return; }

  if (!files.length) { toast('No files in that folder.'); return; }

  // No bytes yet — only paths and sizes. Each file is read from the device at the
  // moment it is uploaded, so a big folder never has to fit in memory at once.
  const here = S.path ? S.path + '/' : '';
  const entries = files.map(f => ({
    path:  here + f.path,
    size:  f.size,
    index: f.index          // the handle MainActivity reads it back by
  }));

  checkCollisions(entries).then(final => { if (final) uploadSheet(final); });
};

/* Pull one file's bytes across the bridge. The setTimeout matters: the native read
   blocks the JS thread, so without yielding first the progress bar would never get
   a chance to paint. */
function nativeB64(index){
  return new Promise((res, rej) => {
    setTimeout(() => {
      const b64 = window.Native.readEntry(index);
      if (b64 === null || b64 === undefined) rej(new Error('Could not read a file from that folder.'));
      else res(b64);
    }, 0);
  });
}

/* ── Collisions ───────────────────────────────────────────────────────────
   Uploading over an existing file destroys it, and git will not warn you — the
   commit just replaces the blob. So look first.

   One call to the tree API returns every path on the branch, which covers a
   nested folder upload as cheaply as a single file. Asking per directory would
   be one request per folder.
   ──────────────────────────────────────────────────────────────────────── */
async function checkCollisions(entries){
  let existing;
  try {
    const t = await api.tree(S.repo.owner, S.repo.name, S.branch);
    existing = new Set(t.tree.filter(n => n.type === 'blob').map(n => n.path));
  } catch {
    return entries;      // an empty repo has no tree; nothing can collide
  }

  const clashes = entries.filter(e => existing.has(e.path));
  if (!clashes.length) return entries;

  return new Promise(resolve => {
    const n = clashes.length;

    sheet(n === 1 ? 'File already exists' : n + ' files already exist', `
      <div class="overwrite">
        ${clashes.slice(0, 8).map(c => esc(c.path)).join('<br>')}
        ${n > 8 ? `<br><span style="color:var(--fg-subtle)">…and ${n - 8} more</span>` : ''}
      </div>

      <div class="sheetlist">
        <button id="x-replace">Replace<small>Overwrite ${n === 1 ? 'it' : 'them'}. The old version stays in the history.</small></button>
        <button id="x-keep">Keep both<small>Upload as ${esc(freeName(clashes[0].path, existing))} and so on</small></button>
        <button id="x-skip" class="danger">Skip<small>Do not upload ${n === 1 ? 'this file' : 'these ' + n} — upload the rest</small></button>
      </div>
      <button class="btn wide" id="x-cancel">Cancel everything</button>
    `, () => {
      const clash = new Set(clashes.map(c => c.path));

      $('x-replace').onclick = () => { closeSheet(); resolve(entries); };

      $('x-keep').onclick = () => {
        closeSheet();
        // Rename as we go, and remember each new name — otherwise two files that
        // both want "notes-1.txt" would collide with each other.
        const taken = new Set(existing);
        resolve(entries.map(e => {
          if (!clash.has(e.path)) return e;
          const path = freeName(e.path, taken);
          taken.add(path);
          return { ...e, path };
        }));
      };

      $('x-skip').onclick = () => {
        closeSheet();
        const keep = entries.filter(e => !clash.has(e.path));
        if (!keep.length) { toast('Nothing left to upload.'); resolve(null); return; }
        resolve(keep);
      };

      $('x-cancel').onclick = () => { closeSheet(); resolve(null); };
    });
  });
}

/* notes.txt → notes-1.txt → notes-2.txt … the first one nobody has taken. */
function freeName(path, taken){
  const slash = path.lastIndexOf('/');
  const dir   = slash < 0 ? '' : path.slice(0, slash + 1);
  const file  = path.slice(slash + 1);
  const dot   = file.lastIndexOf('.');
  const stem  = dot > 0 ? file.slice(0, dot) : file;
  const ext   = dot > 0 ? file.slice(dot)    : '';

  for (let i = 1; i < 1000; i++) {
    const candidate = `${dir}${stem}-${i}${ext}`;
    if (!taken.has(candidate)) return candidate;
  }
  return `${dir}${stem}-${Date.now()}${ext}`;
}

function uploadSheet(entries){
  // Files read by the browser carry their bytes already (base64 is 4 chars per 3
  // bytes); files coming from Android's folder picker carry a real size instead.
  const size = entries.reduce(
    (n, e) => n + (e.size != null ? e.size : Math.ceil(e.b64.length * 3 / 4)), 0);
  const n = entries.length;

  sheet('Upload', `
    <div class="overwrite">
      <b>${n}</b> file${n === 1 ? '' : 's'} · ${bytes(size)}<br>
      into <b>${S.path ? S.path + '/' : S.repo.name + '/'}</b> on <b>${S.branch}</b>
    </div>
    <div class="field">
      <label for="umsg">Message</label>
      <input type="text" id="umsg" placeholder="Add ${n} file${n === 1 ? '' : 's'}">
    </div>

    <div id="uprog" style="display:none">
      <div class="bar"><i id="ubar"></i></div>
      <div class="barstat">
        <span class="now" id="unow"></span>
        <span id="ucount">0/${n}</span>
      </div>
    </div>

    <button class="btn solid wide" id="ugo">Commit all ${n} as one</button>
    <div style="height:10px"></div>
    <button class="btn wide" id="ucancel">Cancel</button>
  `, () => {
    $('ugo').onclick     = () => doUpload(entries);
    $('ucancel').onclick = closeSheet;
  });
}

async function doUpload(entries){
  const btn = $('ugo');
  const n   = entries.length;
  const msg = $('umsg').value.trim() || ('Add ' + n + ' file' + (n === 1 ? '' : 's'));

  $('uprog').style.display = 'block';
  $('ucancel').disabled = true;          // a half-built tree is not worth abandoning
  busy(btn, true, 'Uploading…');

  try {
    const c = await commitFiles(entries, msg, (i, total, path) => {
      $('ubar').style.width  = Math.round(i / total * 100) + '%';
      $('ucount').textContent = i + '/' + total;
      $('unow').innerHTML     = '<span dir="ltr">' + path.split('/').pop() + '</span>';
    });

    // The blobs are all up; the tree, commit and ref move are near-instant.
    $('ubar').style.width   = '100%';
    $('ucount').textContent = n + '/' + n;

    closeSheet();
    toast('Committed ' + n + ' file' + (n === 1 ? '' : 's') + ' · ' + c.sha.slice(0, 7));
    await loadTree(S.path);
  } catch (e) {
    toast(e.message, 6000);
  } finally {
    busy(btn, false);
    $('ucancel').disabled = false;
  }
}


/* --- 7a7. Delete ---------------------------------------------
   A file is a single contents-API call. A folder is not: git has no folder
   object to delete, only the files inside it. So we read the branch's whole
   tree, take every blob under the prefix, and null them all in one commit.
   ------------------------------------------------------------ */
function rowMenu(it){
  const isDir = it.type === 'dir';
  const parent = it.path.includes('/') ? it.path.split('/').slice(0, -1).join('/') : '';
  sheet(it.name, `
    <div class="overwrite">${it.path}${isDir ? '/' : ''}</div>
    <div class="sheetlist">
      <button id="m-select">Select<small>Pick several files to move or delete together</small></button>
      <button id="m-move">Move or rename<small>${isDir ? 'Move the whole folder' : 'Change its path'}</small></button>
      ${isDir ? `<button id="m-flatten">Move contents out<small>Into ${parent ? esc(parent) + '/' : 'the repository root'}, then drop the folder</small></button>` : ''}
      <button id="m-del">Delete ${isDir ? 'folder' : 'file'}<small>${
        isDir ? 'Everything inside it goes too' : 'Commits the removal to ' + S.branch
      }</small></button>
    </div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('m-select').onclick = () => {
      closeSheet();
      S.selMode = true;
      toggleSel(it);
      renderTree(S.treeItems || []);
    };
    $('m-del').onclick = () => doDelete(it);
    $('m-move').onclick = () => moveSheet(it);
    if ($('m-flatten')) $('m-flatten').onclick = () => doMove(it, parent, true);
  });
}

/* ── Move / rename ────────────────────────────────────────────────────────
   Git has no rename: a move is "write the blob at the new path, remove the old
   one" in a single commit. Because the blob already exists we only pass its
   sha, so even a large folder moves instantly — nothing is re-uploaded. */
function moveSheet(it){
  const isDir = it.type === 'dir';
  sheet('Move ' + it.name, `
    <p class="hint" style="margin-top:0">New path for this ${isDir ? 'folder' : 'file'}. Type a slash to nest it; leave it empty to move to the repository root.</p>
    <div class="field">
      <input type="text" id="mv-path" value="${esc(it.path)}" spellcheck="false"
             autocapitalize="off" autocorrect="off" autocomplete="off">
    </div>
    <button class="btn solid wide" id="mv-go">Move</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('mv-go').onclick = () => {
      const dest = $('mv-path').value.trim().replace(/^\/+|\/+$/g, '');
      if (dest === it.path) { toast('That is the same path.'); return; }
      doMove(it, dest, false);
    };
  });
}

/* dest: for a file, the new full path. For a folder, the new folder path — or,
   when flatten is true, the folder its contents should be lifted into. */
async function doMove(it, dest, flatten){
  const isDir = it.type === 'dir';
  const o = S.repo.owner, r = S.repo.name;
  const btn = $('mv-go') || $('m-flatten');
  busy(btn, true, 'Moving…');
  try {
    const head = (await api.ref(o, r, S.branch)).object.sha;
    const root = (await api.commit(o, r, head)).tree.sha;
    const full = await api.treeRec(o, r, root);

    const entries = [];
    let msg;

    if (isDir) {
      const from = it.path + '/';
      const blobs = full.tree.filter(n => n.type === 'blob' && n.path.startsWith(from));
      if (!blobs.length) throw new Error('That folder has no files in it.');

      const baseDest = flatten ? dest : dest;          // where the files land
      blobs.forEach(n => {
        const rest = n.path.slice(from.length);        // path inside the folder
        const tail = flatten ? rest : rest;
        const to = (baseDest ? baseDest + '/' : '') + tail;
        if (to === n.path) return;                     // already there
        entries.push({ path: to, sha: n.sha, mode: n.mode });
        entries.push({ path: n.path, delete: true });
      });
      if (!entries.length) throw new Error('Everything is already at that path.');
      msg = flatten
        ? 'Move contents of ' + it.path + '/ to ' + (dest || 'root')
        : 'Move ' + it.path + '/ to ' + (dest || 'root') + '/';
    } else {
      const node = full.tree.find(n => n.type === 'blob' && n.path === it.path);
      if (!node) throw new Error('Could not find that file in the tree.');
      if (!dest) throw new Error('Give the file a name.');
      entries.push({ path: dest, sha: node.sha, mode: node.mode });
      entries.push({ path: it.path, delete: true });
      msg = 'Move ' + it.path + ' to ' + dest;
    }

    const n = entries.filter(e => !e.delete).length;
    await commitFiles(entries, msg);
    closeSheet();
    toast('Moved ' + n + ' file' + (n === 1 ? '' : 's'));
    await loadTree(S.path);
  } catch (e) {
    toast(e.message, 6000);
  } finally {
    busy(btn, false);
  }
}

async function doDelete(it){
  const isDir = it.type === 'dir';
  if (!confirm(`Delete ${it.path}${isDir ? '/ and everything inside it' : ''}?\n\nThis is committed to ${S.branch}.`)) return;

  const btn = $('m-del');
  busy(btn, true, 'Deleting…');
  try {
    if (isDir) {
      const o = S.repo.owner, r = S.repo.name;
      const head = (await api.ref(o, r, S.branch)).object.sha;
      const root = (await api.commit(o, r, head)).tree.sha;
      const full = await api.treeRec(o, r, root);

      const doomed = full.tree
        .filter(node => node.type === 'blob' && node.path.startsWith(it.path + '/'))
        .map(node => ({ path: node.path, delete: true }));

      if (!doomed.length) throw new Error('Nothing inside that folder to delete.');
      await commitFiles(doomed, 'Delete ' + it.path + '/');
      toast('Deleted ' + doomed.length + ' file' + (doomed.length === 1 ? '' : 's'));

    } else {
      // Re-read the file so we lock against its current sha, not a stale one.
      const f = await api.contents(S.repo.owner, S.repo.name, it.path, S.branch);
      await api.delFile(S.repo.owner, S.repo.name, it.path, {
        message: 'Delete ' + it.path,
        sha:     f.sha,
        branch:  S.branch
      });
      toast('Deleted ' + it.name);
    }

    closeSheet();
    await loadTree(S.path);
  } catch (e) {
    toast(e.message, 6000);
  } finally {
    busy(btn, false);
  }
}

/* --- 7d. Pull request --------------------------------------- */
async function prSheet(){
  // If this repo is a fork, GitHub tells us its parent — that's the upstream
  // you'd contribute back to. Offer it as the PR target alongside this repo.
  let parent = null;
  try {
    const info = await api.repoInfo(S.repo.owner, S.repo.name);
    if (info.fork && info.parent) parent = {
      owner: info.parent.owner.login, name: info.parent.name,
      branch: info.parent.default_branch
    };
  } catch {}
  S.prParent = parent;

  sheet('Pull request', `
    ${parent ? `
      <div class="field">
        <label>Where does this go?</label>
        <div class="sheetlist" id="pr-target">
          <button data-t="up" class="on">${esc(parent.owner + '/' + parent.name)}<small>Contribute upstream — ${esc(S.repo.owner)}:${esc(S.branch)} into ${esc(parent.branch)}</small></button>
          <button data-t="own">${esc(S.repo.owner + '/' + S.repo.name)}<small>Stay in your fork — ${esc(S.branch)} into ${esc(S.repo.default_branch)}</small></button>
        </div>
      </div>`
    : `<div class="overwrite"><b>${S.branch}</b> → <b>${S.repo.default_branch}</b></div>`}
    <div class="field">
      <label for="ptitle">Title</label>
      <input type="text" id="ptitle" value="${esc(S.branch)}">
    </div>
    <div class="field">
      <label for="pbody">Description</label>
      <textarea id="pbody" rows="4"></textarea>
    </div>
    <button class="btn wide" id="pprev">Preview changes</button>
    <div id="pprevbox"></div>
    <div style="height:12px"></div>
    <button class="btn solid wide" id="pgo">Open pull request</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    S.prTarget = parent ? 'up' : 'own';
    const tgt = $('pr-target');
    if (tgt) tgt.querySelectorAll('button').forEach(b => b.onclick = () => {
      tgt.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      S.prTarget = b.dataset.t;
      $('pprevbox').innerHTML = '';        // the comparison changed
    });
    $('pgo').onclick = doPR;
    $('pprev').onclick = previewPR;
  });
}

/* Show what this PR would contain before opening it — base…head, GitHub's own
   comparison, with the files and a summary. */
async function previewPR(){
  const box = $('pprevbox');
  box.innerHTML = '<div class="empty">Comparing…</div>';
  try {
    // When contributing upstream, compare against the parent repo — GitHub
    // accepts "owner:branch" on the head side for cross-repository compares.
    const up = S.prTarget === 'up' && S.prParent;
    const t  = up ? S.prParent : { owner:S.repo.owner, name:S.repo.name, branch:S.repo.default_branch };
    const head = up ? S.repo.owner + ':' + S.branch : S.branch;
    const cmp = await api.compare(t.owner, t.name, t.branch, head);

    if (!cmp.commits.length) {
      box.innerHTML = `<div class="overwrite">${esc(S.branch)} is not ahead of ${esc(t.owner + '/' + t.name)}:${esc(t.branch)}. There is nothing to open a pull request for.</div>`;
      return;
    }

    const files = cmp.files || [];
    const add = files.reduce((n, f) => n + (f.additions || 0), 0);
    const del = files.reduce((n, f) => n + (f.deletions || 0), 0);

    box.innerHTML = `
      <div class="overwrite" style="margin-top:12px">
        <b>${cmp.commits.length}</b> commit${cmp.commits.length === 1 ? '' : 's'} ·
        <span style="color:var(--add-fg)">+${add}</span>
        <span style="color:var(--del-fg)">−${del}</span> ·
        ${files.length} file${files.length === 1 ? '' : 's'}
      </div>
      <div class="prevfiles">
        ${files.slice(0, 30).map(f => `
          <div class="prevfile">
            <span class="n">${esc(f.filename)}</span>
            <span class="s"><span class="a">+${f.additions}</span> <span class="d">−${f.deletions}</span></span>
          </div>`).join('')}
        ${files.length > 30 ? `<div class="fdnote">…and ${files.length - 30} more</div>` : ''}
      </div>`;
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function doPR(){
  const btn = $('pgo');
  const up = S.prTarget === 'up' && S.prParent;

  // Only a same-repo PR needs a different branch; a fork's branch may well
  // share the upstream's name, which is fine.
  if (!up && S.branch === S.repo.default_branch) {
    toast('You are on ' + S.branch + '. Switch to another branch first.');
    return;
  }

  busy(btn, true, 'Opening…');
  try {
    // Cross-fork PRs name the head as "owner:branch" and are created against
    // the upstream repository, not yours.
    const target = up ? S.prParent : { owner: S.repo.owner, name: S.repo.name, branch: S.repo.default_branch };
    const head   = up ? S.repo.owner + ':' + S.branch : S.branch;

    const pr = await api.makePR(target.owner, target.name, {
      title: $('ptitle').value.trim() || S.branch,
      body:  $('pbody').value,
      head, base: target.branch
    });
    closeSheet();
    toast('Opened #' + pr.number + (up ? ' on ' + target.owner + '/' + target.name : ''), 6000);
  } catch (e) {
    toast(e.status === 422
      ? 'GitHub rejected it: ' + e.message + ' (often there is nothing to compare, or a PR already exists.)'
      : e.message, 7000);
  } finally {
    busy(btn, false);
  }
}

/* ── Markdown ─────────────────────────────────────────────────────────────
   Enough of it to make a README readable: headings, emphasis, code, lists,
   quotes, links, images, rules, tables. Everything is escaped first, so a file
   containing raw HTML is shown, never executed.
   ──────────────────────────────────────────────────────────────────────── */
/* ── A deliberately small, safe HTML subset for markdown ──────────────────
   READMEs routinely contain real HTML — <picture>, <img>, badges, <details>.
   Escaping everything (the old behaviour) dumped that markup on screen as
   text. Rendering it blindly would be an XSS hole, especially now that you can
   browse strangers' repos. So: drop dangerous elements entirely, escape the
   rest, then re-enable a whitelist of tags with a whitelist of attributes, and
   only http(s) URLs. */
const MD_TAGS = new Set(['a','img','picture','source','br','hr','b','strong','i','em','u','s','del',
  'code','pre','kbd','sub','sup','details','summary','p','div','span','center','small','blockquote',
  'h1','h2','h3','h4','h5','h6','ul','ol','li','table','thead','tbody','tr','td','th','caption']);
const MD_ATTRS = new Set(['href','src','srcset','alt','title','media','align','width','height','colspan','rowspan']);

function safeUrl(u){
  const v = String(u).trim();
  return /^(https?:\/\/|\/|#|mailto:)/i.test(v) ? v : '#';
}
function mdAttrs(raw){
  let out = '';
  const re = /([a-zA-Z-]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/g;
  let m;
  while ((m = re.exec(raw))) {
    const name = m[1].toLowerCase();
    if (!MD_ATTRS.has(name)) continue;            // drops every on* handler, style, etc.
    let val = (m[2] ?? m[3] ?? m[4] ?? '');
    if (name === 'href' || name === 'src' || name === 'srcset') val = safeUrl(val);
    out += ` ${name}="${val.replace(/"/g, '&quot;')}"`;
  }
  return out;
}
function unescapeSafeHtml(escaped){
  return escaped.replace(/&lt;(\/?)([a-zA-Z][a-zA-Z0-9]*)((?:[^&]|&(?!gt;))*?)(\/?)&gt;/g,
    (whole, slash, tag, attrs, selfClose) => {
      const t = tag.toLowerCase();
      if (!MD_TAGS.has(t)) return whole;                        // leave unknown tags escaped
      if (slash) return `</${t}>`;
      const a = attrs ? mdAttrs(attrs.replace(/&quot;/g, '"').replace(/&#39;/g, "'")) : '';
      const target = t === 'a' ? ' target="_blank" rel="noopener"' : '';
      return `<${t}${a}${target}${selfClose ? '/' : ''}>`;
    });
}

function markdown(src){
  // Strip elements that must never survive, content and all.
  src = String(src).replace(/<(script|style|iframe|object|embed|form|link|meta)[\s\S]*?<\/\1\s*>/gi, '')
                   .replace(/<(script|style|iframe|object|embed|form|link|meta)\b[^>]*\/?>/gi, '');

  const blocks = [];   // fenced code is lifted out before anything else touches it
  let t = esc(src).replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(`<pre><code>${code.replace(/\n$/, '')}</code></pre>`);
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });

  // Bring back the safe HTML the README actually meant, plus common entities.
  t = unescapeSafeHtml(t)
        .replace(/&amp;(nbsp|amp|lt|gt|quot|#39|mdash|ndash|hellip|times|copy|reg);/g, '&$1;');

  const inline = x => x
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|\W)\*([^*]+)\*/g, '$1<i>$2</i>')
    .replace(/~~([^~]+)~~/g, '<s>$1</s>');

  const out = [];
  let list = null;   // 'ul' | 'ol' | null

  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  t.split('\n').forEach(line => {
    let m;

    if (/^\u0000\d+\u0000$/.test(line)) { closeList(); out.push(line); return; }
    if (/^\s*$/.test(line))              { closeList(); return; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { closeList(); out.push('<hr>'); return; }

    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeList();
      const lvl = Math.min(m[1].length, 3);
      out.push(`<h${lvl}>${inline(m[2])}</h${lvl}>`);
      return;
    }

    if ((m = line.match(/^&gt;\s?(.*)$/))) {
      closeList();
      out.push(`<blockquote>${inline(m[1])}</blockquote>`);
      return;
    }

    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${inline(m[1])}</li>`);
      return;
    }

    if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) {
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inline(m[1])}</li>`);
      return;
    }

    // A table row. The |---|---| separator is structure, not content.
    if (/^\s*\|.*\|\s*$/.test(line)) {
      if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) return;
      closeList();
      const cells = line.trim().slice(1, -1).split('|').map(c => `<td>${inline(c.trim())}</td>`).join('');
      const prev = out[out.length - 1];
      if (prev && prev.startsWith('<table>')) out[out.length - 1] = prev.replace(/<\/table>$/, `<tr>${cells}</tr></table>`);
      else out.push(`<table><tr>${cells}</tr></table>`);
      return;
    }

    closeList();
    // A line that is just block-level HTML (<picture>, <details>, </a>, a badge
    // link, …) is emitted as-is; wrapping it in <p> would break the markup.
    if (/^\s*<\/?(?:picture|source|details|summary|div|p|table|thead|tbody|tr|td|th|ul|ol|li|blockquote|center|h[1-6]|img|a|br|hr)\b[^>]*>\s*$/i.test(line)
        || /^\s*<[a-zA-Z][^>]*>[\s\S]*<\/[a-zA-Z][a-zA-Z0-9]*>\s*$/.test(line)) {
      out.push(line);
      return;
    }
    out.push(`<p>${inline(line)}</p>`);
  });
  closeList();

  return out.join('')
            .replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

/* ═══════════════════════════════════════════════════════════════════════
   SYNTAX HIGHLIGHTING

   One pass, one regex per language. Comments and strings are matched first and
   consumed whole, so a keyword inside a string or a quote inside a comment can
   never confuse what follows — which is the failure mode of every naive
   highlighter.

   This is not a parser. It will not understand a regex literal containing a
   quote, and it does not care.
   ═══════════════════════════════════════════════════════════════════════ */

const KW = {
  js: 'const let var function return if else for while do break continue class extends new this super import export default from as async await try catch finally throw typeof instanceof delete in of null undefined true false switch case yield static get set',
  java: 'public private protected class interface enum extends implements new return if else for while do break continue import package static final void int long float double boolean char String try catch finally throw throws this super null true false switch case abstract synchronized volatile transient native instanceof',
  py: 'def class return if elif else for while break continue import from as pass raise try except finally with lambda yield global nonlocal None True False and or not in is assert del async await',
  css: 'important media import keyframes supports font-face root',
  sh: 'if then else elif fi for while do done case esac function return export local echo cd set unset source exit',
  yaml: 'true false null yes no on off',
  sql: 'select from where insert update delete create table drop alter join left right inner outer on group by order having limit as and or not null'
};

const LANG = {
  js:'js', jsx:'js', ts:'js', tsx:'js', json:'js', mjs:'js', cjs:'js', gradle:'java',
  java:'java', kt:'java', kts:'java', c:'java', h:'java', cpp:'java', cs:'java', go:'java', rs:'java', swift:'java',
  py:'py', rb:'py',
  css:'css', scss:'css',
  html:'xml', htm:'xml', xml:'xml', svg:'xml', vue:'xml',
  sh:'sh', bash:'sh', zsh:'sh',
  yml:'yaml', yaml:'yaml', toml:'yaml', ini:'yaml', properties:'yaml', gitignore:'yaml',
  sql:'sql'
};

const RULES = {};   // built once per language, on first use

function rulesFor(lang){
  if (RULES[lang]) return RULES[lang];

  if (lang === 'xml') {
    // Markup is a different shape entirely: tags and attributes, not keywords.
    RULES[lang] = /(<!--[\s\S]*?-->)|("[^"]*"|'[^']*')|(<\/?[A-Za-z][\w:-]*)|(>|\/>)|([A-Za-z-]+)(?==)/g;
    return RULES[lang];
  }

  const kw = (KW[lang] || '').trim().split(/\s+/).join('|');
  const line = lang === 'py' || lang === 'sh' || lang === 'yaml' ? '#' : '\\/\\/';

  RULES[lang] = new RegExp(
    '(\\/\\*[\\s\\S]*?\\*\\/)'                 // 1 block comment
  + '|(' + line + '[^\\n]*)'                   // 2 line comment
  + '|("(?:\\\\.|[^"\\\\])*"'                  // 3 strings
  +  "|'(?:\\\\.|[^'\\\\])*'"
  +  '|`(?:\\\\.|[^`\\\\])*`)'
  + '|\\b(\\d[\\w.]*)\\b'                      // 4 numbers
  + (kw ? '|\\b(' + kw + ')\\b' : '|()')       // 5 keywords
  + '|\\b([A-Za-z_$][\\w$]*)(?=\\s*\\()'       // 6 call sites
  + '|([{}()\\[\\];,.:<>=+\\-*/%!&|?~^]+)',    // 7 punctuation
    'g');
  return RULES[lang];
}

function highlight(code, path){
  const ext  = (path.split('.').pop() || '').toLowerCase();
  const lang = LANG[ext];
  if (!lang) return null;                       // unknown: leave it plain
  if (code.length > 200000) return null;        // too big to re-tokenise per keystroke

  const re = rulesFor(lang);
  re.lastIndex = 0;

  let out = '', last = 0, m;
  while ((m = re.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));

    if (lang === 'xml') {
      const cls = m[1] ? 't-com' : m[2] ? 't-str' : m[3] ? 't-tag'
                : m[4] ? 't-pun' : 't-att';
      out += `<span class="${cls}">${esc(m[0])}</span>`;
    } else {
      const cls = m[1] || m[2] ? 't-com' : m[3] ? 't-str' : m[4] ? 't-num'
                : m[5] ? 't-key' : m[6] ? 't-fn' : 't-pun';
      out += `<span class="${cls}">${esc(m[0])}</span>`;
    }

    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;      // never let an empty match spin
  }
  out += esc(code.slice(last));
  return out;
}

/* Repaint the layer under the caret. Debounced: on a long file, tokenising on
   every keystroke makes typing feel like wading. */
let hlTimer;
function paintHL(now){
  clearTimeout(hlTimer);
  const run = () => {
    if (!S.file) return;
    const html = highlight(S.buffer, S.file.path);
    const ed = $('editor');

    if (html === null) {                        // no rules for this file type
      ed.classList.add('plain');
      $('hl').classList.add('off');
      paintGutter();                            // numbers still apply
      return;
    }
    ed.classList.remove('plain');
    $('hl').classList.remove('off');
    paintGutter();
    // The trailing newline matters: without it the last line of the <pre> and the
    // last line of the textarea disagree about height, and everything shifts.
    $('hl').firstChild.innerHTML = html + '\n';
    syncScroll();
  };
  now ? run() : (hlTimer = setTimeout(run, 110));
}

/* All three layers scroll as one: gutter, highlight, textarea. The gutter only
   follows vertically — line numbers must not slide away sideways. */
function syncScroll(){
  const ed = $('editor');
  $('hl').scrollTop   = ed.scrollTop;
  $('hl').scrollLeft  = ed.scrollLeft;
  $('gut').scrollTop  = ed.scrollTop;
}
$('editor').addEventListener('scroll', syncScroll);

function paintGutter(){
  const n = S.buffer ? S.buffer.split('\n').length : 1;
  const g = $('gut');
  // Only rebuild when the count actually changes — this runs on every keystroke.
  if (g.dataset.n === String(n)) return;
  g.dataset.n = n;

  let out = '';
  for (let i = 1; i <= n; i++) out += i + '\n';
  g.textContent = out;
}

const DESKTOP_KEY = 'gitfile:desktop';

function applyDesktop(on){
  document.body.classList.toggle('desktop', on);

  // Deliberately does NOT touch the viewport meta. Setting width=1100 makes the
  // WebView rescale the whole page, and it re-scales every time an input takes
  // focus — which is what made editing a file jump about. Instead the desktop
  // layout is applied in place and scaled with the zoom control below, which
  // works regardless of whether the WebView allows pinch gestures.
  if (on) applyZoom(DESK_ZOOM);
}

/* ── Desktop zoom ─────────────────────────────────────────────────────────
   Android WebViews disable pinch-zoom unless the host app turns it on, so the
   app carries its own control rather than depending on that. CSS `zoom` is
   used instead of a transform because it also shrinks the scroll area, so
   panning around a zoomed page still lines up. */
const ZOOM_KEY = 'gitfile:zoom';
const ZOOM_STEPS = [0.3, 0.4, 0.5, 0.55, 0.65, 0.75, 0.9, 1, 1.25, 1.5];
let DESK_ZOOM = 0.55;

function applyZoom(z){
  DESK_ZOOM = Math.max(0.3, Math.min(1.5, z));
  document.documentElement.style.setProperty('--dz', String(DESK_ZOOM));
  const v = $('z-val');
  if (v) v.textContent = Math.round(DESK_ZOOM * 100) + '%';
}
function stepZoom(dir){
  // Move to the next preset rather than a raw multiply, so the steps feel even.
  let i = ZOOM_STEPS.findIndex(s => Math.abs(s - DESK_ZOOM) < 0.001);
  if (i === -1) i = ZOOM_STEPS.reduce((best, s, n) =>
    Math.abs(s - DESK_ZOOM) < Math.abs(ZOOM_STEPS[best] - DESK_ZOOM) ? n : best, 0);
  applyZoom(ZOOM_STEPS[Math.max(0, Math.min(ZOOM_STEPS.length - 1, i + dir))]);
  store.set(ZOOM_KEY, String(DESK_ZOOM)).catch(() => {});
}
$('z-in').onclick  = () => stepZoom(1);
$('z-out').onclick = () => stepZoom(-1);
$('z-fit').onclick = () => {
  // Scale so the 1100px layout exactly fits the screen.
  applyZoom((window.innerWidth - 8) / 1100);
  store.set(ZOOM_KEY, String(DESK_ZOOM)).catch(() => {});
  window.scrollTo(0, window.scrollY);
};

/* The running APK knows its own version. Asking it beats a constant that goes
   stale the first time someone forgets to bump it. */
const appVersion = () =>
  (window.Native && window.Native.version) ? window.Native.version() : 'web';

const REPO_URL = 'https://github.com/Musaiyaf/gitfile';

/* ── Install count ────────────────────────────────────────────────────────
   gitfile ships as an APK attached to its own GitHub releases, so the number
   of times that APK has been downloaded is the closest thing to an install
   count the API can give — GitHub records download_count per release asset.
   Sum it across every .apk on every release. Cached for the session; any
   failure is swallowed, since this is a nicety and never worth an error. */
let INSTALLS = null;
async function gitfileInstalls(){
  if (INSTALLS !== null) return INSTALLS;
  const rels = await gh('/repos/Musaiyaf/gitfile/releases?per_page=100');
  let n = 0;
  for (const rel of (rels || []))
    for (const a of (rel.assets || []))
      if (/\.apk$/i.test(a.name)) n += a.download_count || 0;
  INSTALLS = n;
  return n;
}

    $('ed-fsdown').onclick = () => { applyFont(ED_FONT - 1); $('ed-fsval').textContent = ED_FONT + 'px'; store.set(FONT_KEY, String(ED_FONT)); };
    $('ed-fsup').onclick   = () => { applyFont(ED_FONT + 1); $('ed-fsval').textContent = ED_FONT + 'px'; store.set(FONT_KEY, String(ED_FONT)); };
    $('ed-themes').querySelectorAll('button').forEach(b => b.onclick = () => {
      applyTheme(b.dataset.t);
      store.set(THEME_KEY, ED_THEME);
      editorSheet();     // repaint so the marker moves
    });
  });
}

/* ── App lock (PIN) ───────────────────────────────────────────────────────
   Set/change/remove the PIN that seals the token. Everything here needs the
   live token in memory (you're already signed in when you open Settings). */
async function lockSheet(){
  if (!S.token)     { toast('Sign in first.'); return; }
  if (!hasCrypto()) { toast('App lock needs a secure context (localhost/https).', 6000); return; }

  let locked = false;
  try { locked = !!(await store.get(LOCK_KEY)); } catch {}

  if (!locked) { setPinSheet(false); return; }

  let al = '1';
  try { const v = await store.get(AUTOLOCK_KEY); if (v !== null && v !== undefined && v !== '') al = String(v); } catch {}
  const alOpts = [['0','Immediately'], ['1','After 1 min'], ['5','After 5 min'], ['-1','Never']];

  sheet('App lock', `
    <p class="hint" style="margin-top:0">A PIN is protecting your token on this device — it's encrypted and can't be read without the PIN.</p>

    <div class="overwrite" style="margin-top:0">Auto-lock when backgrounded</div>
    <div class="sheetlist" id="al-opts">
      ${alOpts.map(([v, label]) => `<button data-v="${v}">${label}${v === al ? ' (current)' : ''}</button>`).join('')}
    </div>

    ${hasBiometric() ? `<button class="btn wide" id="lk-bio">Enable fingerprint unlock</button><div style="height:10px"></div>` : ''}
    <button class="btn wide" id="lk-change">Change PIN</button>
    <div style="height:10px"></div>
    <button class="btn wide danger" id="lk-remove">Remove PIN</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Close</button>
  `, () => {
    $('al-opts').querySelectorAll('button').forEach(b => b.onclick = async () => {
      await store.set(AUTOLOCK_KEY, b.dataset.v);
      lockSheet();     // repaint to move the marker
    });
    if (hasBiometric()) $('lk-bio').onclick = () => {
      try { window.Native.enableBiometric(S.token); toast('Fingerprint unlock enabled.'); }
      catch { toast('Could not enable fingerprint.'); }
    };
    $('lk-change').onclick = () => setPinSheet(true);
    $('lk-remove').onclick = removePinSheet;
  });
}

function setPinSheet(isChange){
  sheet(isChange ? 'Change PIN' : 'Set a PIN', `
    <p class="hint" style="margin-top:0">Your token is sealed with this PIN (AES-GCM). Forget it and you simply sign in again with your token — nothing else is lost.</p>
    <div class="field"><input id="lk-p1" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="New PIN (4–12 digits)" maxlength="12" autocomplete="off"></div>
    <div class="field"><input id="lk-p2" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Confirm PIN" maxlength="12" autocomplete="off"></div>
    <button class="btn solid wide" id="lk-save">${isChange ? 'Change PIN' : 'Set PIN'}</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('lk-save').onclick = async () => {
      const p1 = ($('lk-p1').value || '').trim(), p2 = ($('lk-p2').value || '').trim();
      if (p1.length < 4) { toast('Use at least 4 digits.'); return; }
      if (p1 !== p2)     { toast('The two PINs do not match.'); return; }
      const btn = $('lk-save'); busy(btn, true, 'Saving…');
      try {
        const blob = await sealToken(p1, S.token);
        await store.set(LOCK_KEY, blob);
        await store.del(TOKEN_KEY);          // the plaintext token no longer lives on disk
        busy(btn, false); closeSheet();
        toast(isChange ? 'PIN changed.' : 'App lock on. You will need this PIN next launch.', 5000);
      } catch {
        busy(btn, false);
        toast('Could not set the PIN.', 5000);
      }
    };
  });
}

function removePinSheet(){
  sheet('Remove PIN', `
    <p class="hint" style="margin-top:0">Enter your current PIN to turn the lock off. Your token will then be stored unencrypted again.</p>
    <div class="field"><input id="lk-cur" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Current PIN" maxlength="12" autocomplete="off"></div>
    <button class="btn solid wide danger" id="lk-off">Remove PIN</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('lk-off').onclick = async () => {
      const pin = ($('lk-cur').value || '').trim();
      if (!pin) return;
      const btn = $('lk-off'); busy(btn, true, 'Removing…');
      try {
        const blob  = await store.get(LOCK_KEY);
        const token = await openToken(pin, blob);   // verifies the PIN by decrypting
        await store.set(TOKEN_KEY, token);
        await store.del(LOCK_KEY);
        S.token = token;
        busy(btn, false); closeSheet();
        toast('App lock off.');
      } catch {
        busy(btn, false);
        toast('Wrong PIN.', 4000);
      }
    };
  });
}

function paintBackend(){
  const el = $('backend');
  if (!el) return;
  el.textContent =
      window.Native  ? 'app storage (survives restarts)'
    : window.storage ? 'artifact storage'
    : (function(){
        // localStorage can exist but be unwritable; find out rather than assume.
        try { localStorage.setItem('gitfile:probe','1'); localStorage.removeItem('gitfile:probe');
              return 'browser storage (may not survive a restart)'; }
        catch { return 'memory only (will not survive a restart)'; }
      })();
}

$('assetpick').addEventListener('change', e => {
  takeAsset(e.target.files);
  e.target.value = '';        // so picking the same file twice still fires
});

// Release assets staged in the New release sheet. Appends, so tapping "Add
// files" more than once (or a picker that only returns one at a time) accrues.
$('relpick').addEventListener('change', e => {
  const picked = [...e.target.files];
  e.target.value = '';
  if (!picked.length) return;
  S.relFiles = (S.relFiles || []).concat(picked);
  renderRelFiles();
});

// Offline queue: flush automatically the moment the connection returns, and let
// the header badge trigger a manual sync.
window.addEventListener('online', () => flushQueue(true));
document.addEventListener('DOMContentLoaded', () => {
  const b = document.getElementById('queuebadge');
  if (b) b.onclick = () => flushQueue(false);
});

async function boot(){
  const t0 = Date.now();
  paintBackend();

  // Read what's stored: either a plaintext token, or a PIN-sealed lock blob.
  let saved = null, lock = null;
  try { saved = await store.get(TOKEN_KEY); } catch {}
  try { lock  = await store.get(LOCK_KEY);  } catch {}

  // Desktop preference is cosmetic — apply it, but never let it gate the view.
  try { applyDesktop((await store.get(DESKTOP_KEY)) === '1'); } catch {}
  // Editor appearance preferences.
  try { const f = await store.get(FONT_KEY);  if (f) applyFont(parseInt(f, 10)); } catch {}
  try { const t = await store.get(THEME_KEY); if (t) applyTheme(t); } catch {}
  try { const z = parseFloat(await store.get(ZOOM_KEY)); if (z) applyZoom(z); } catch {}
  paintRef();

  // Hold the splash for a readable minimum so the logo isn't just a flash.
  await holdSplash(t0);

  // A PIN is set: show the lock screen. Unlocking decrypts the token, then enters.
  if (lock) { showLock(lock); return; }

  if (!saved) { show('auth'); setBar(null); return; }
  S.token = saved;
  enterApp();
}

/* Reveal the app once a live token is in hand — from a fresh boot or an unlock.
   Leaves the splash for the repos list BEFORE the network round-trip, so the
   sign-in form is never shown to a signed-in user. */
function enterApp(){
  show('repos');
  const bootList = $('repolist');
  if (bootList) bootList.innerHTML = '<div class="empty">Loading…</div>';

  paintQueueBadge();
  if (navigator.onLine) { try { flushQueue(true); } catch {} }

  (async () => {
    try {
      S.user = await api.me();
      paintRef();
      await openRepos();
    } catch (e) {
      // ONLY forget the token when GitHub actually rejects it (401/403). A network
      // blip, a timeout, or a 5xx must NOT log you out — that would sign you out
      // every time you open the app offline or on a bad connection.
      if (e && (e.status === 401 || e.status === 403)) {
        S.token = null;
        await store.del(TOKEN_KEY);
        if ($('tok')) $('tok').value = '';
        paintTokCount();
        show('auth');
        toast('The saved token was rejected by GitHub. Sign in again.', 6000);
      } else {
        paintRef();
        show('repos');
        $('v-repos').innerHTML = `
          <div class="empty">
            Could not reach GitHub just now.<br>
            You are still signed in.
            <div style="height:14px"></div>
            <button class="btn solid" id="boot-retry">Retry</button>
          </div>`;
        const rb = document.getElementById('boot-retry');
        if (rb) rb.onclick = () => openRepos().catch(() => toast('Still cannot reach GitHub.', 5000));
      }
    }
  })();
}

/* ── Lock screen ──────────────────────────────────────────────────────────*/
const hasBiometric = () => !!(window.Native && typeof window.Native.biometricUnlock === 'function');

function showLock(blob){
  S.lockBlob = blob;
  show('lock');
  setBar(null);
  const pin = $('pin');
  if (pin) { pin.value = ''; setTimeout(() => pin.focus(), 120); }
  if ($('pinerr')) $('pinerr').textContent = '';
  // Offer fingerprint only if the native side actually provides it.
  const bio = $('pinbio');
  if (bio) bio.style.display = hasBiometric() ? '' : 'none';
}
async function tryUnlock(){
  const pin = ($('pin').value || '').trim();
  if (!pin) return;
  const btn = $('pinunlock');
  busy(btn, true, 'Unlocking…');
  try {
    const token = await openToken(pin, S.lockBlob);   // throws on a wrong PIN
    S.token = token;
    S.lockBlob = null;
    busy(btn, false);
    enterApp();
  } catch {
    busy(btn, false);
    $('pinerr').textContent = 'Wrong PIN.';
    $('pin').value = '';
    $('pin').focus();
  }
}
$('pinunlock').onclick = tryUnlock;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

/* Biometric unlock is done entirely on the native side (Android Keystore +
   BiometricPrompt); the page just asks for it and receives the token back.
   Native contract:
     window.Native.biometricUnlock()  → prompt; on success call
        window.onBiometricUnlock(token); on failure window.onBiometricFail(msg)
     window.Native.enableBiometric(token) / disableBiometric() to manage it. */
$('pinbio').onclick = () => { try { window.Native.biometricUnlock(); } catch {} };
window.onBiometricUnlock = (token) => {
  if (token) { S.token = token; S.lockBlob = null; enterApp(); }
};
window.onBiometricFail = (msg) => {
  if ($('pinerr')) $('pinerr').textContent = msg || 'Fingerprint not recognised.';
};

/* ── Auto-lock: re-lock after the app has been in the background a while ───*/
const AUTOLOCK_KEY = 'gitfile:autolock';   // minutes; -1 = never, 0 = immediately
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { S.hiddenAt = Date.now(); return; }
  if (!S.token) return;                             // not signed in / already locked
  let locked = false;
  try { locked = !!(await store.get(LOCK_KEY)); } catch {}
  if (!locked) return;                              // no PIN → nothing to re-lock
  let min = 1;
  try { const v = await store.get(AUTOLOCK_KEY); if (v !== null && v !== undefined && v !== '') min = parseInt(v, 10); } catch {}
  if (min < 0) return;                              // "Never"
  if (Date.now() - (S.hiddenAt || 0) >= min * 60000) {
    try { const blob = await store.get(LOCK_KEY); S.token = null; showLock(blob); } catch {}
  }
});
/* Keep the splash up for a readable minimum, however fast the token loads. */
const SPLASH_MIN = 1500;
function holdSplash(t0){
  return new Promise(r => setTimeout(r, Math.max(0, SPLASH_MIN - (Date.now() - t0))));
}

boot();
</script>
</body>
</html>
