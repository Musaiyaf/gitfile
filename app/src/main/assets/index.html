/* --- 7a. Commit ---------------------------------------------
   The sheet deliberately shows the blob sha you are about to
   overwrite. That sha is sent with the request; if the branch has
   moved underneath you, GitHub returns 409 rather than clobbering.
   ------------------------------------------------------------ */
function commitSheet(){
  if (!isDirty() && !isMoved()) return;

  const newPath = $('pathin').value.trim();
  const moved   = isMoved();
  const d       = isDirty() ? diffLines(S.file.text, S.buffer) : null;

  sheet('Commit', `
    <div class="overwrite">
      ${moved
        ? `Moving <b>${S.file.path}</b><br>to <b>${newPath}</b>`
        : `Replacing blob <b>${S.file.sha.slice(0, 7)}</b><br>at <b>${S.file.path}</b>`}
      <br>on <b>${S.branch}</b>
    </div>

    ${d ? `<div class="diffstat"><span class="a">+${d.added}</span> <span class="d">−${d.removed}</span> lines changed</div>
           <div class="diff">${d.html}</div>`
        : '<div class="diffstat">Contents unchanged — only the path moves.</div>'}

    <div class="field">
      <label for="cmsg">Message</label>
      <input type="text" id="cmsg" placeholder="${moved ? 'Move ' + S.file.path.split('/').pop() : 'Update ' + S.file.path.split('/').pop()}">
      <div class="msgsuggest" id="msgsuggest"></div>
    </div>
    <label class="check" id="crun-row" style="margin:4px 0 14px">
      <input type="checkbox" id="crun">
      <span class="box"></span>
      Run the build after committing
    </label>
    <button class="btn solid wide" id="cgo">Commit to ${S.branch}</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('cgo').onclick = doCommit;
    $('cmsg').addEventListener('keydown', e => { if (e.key === 'Enter') doCommit(); });

    // Tappable message suggestions, built from what actually changed — a
    // conventional-commits starter without making you type it.
    const name = (newPath || S.file.path).split('/').pop();
    const verb = moved ? 'Move'
      : (d && d.added && !d.removed) ? 'Add to'
      : (d && d.removed && !d.added) ? 'Trim'
      : 'Update';
    const suggestions = [
      `${verb} ${name}`,
      `docs: update ${name}`,
      `fix: ${name}`,
      `refactor ${name}`
    ];
    $('msgsuggest').innerHTML = suggestions
      .map(m => `<button type="button" class="msgchip">${esc(m)}</button>`).join('');
    $('msgsuggest').querySelectorAll('.msgchip').forEach(b => {
      b.onclick = () => { $('cmsg').value = b.textContent; $('cmsg').focus(); };
    });
  });
}

async function doCommit(){
  const btn     = $('cgo');
  const alsoRun = $('crun') && $('crun').checked;   // read before the sheet closes
  const newPath = $('pathin').value.trim();
  const moved   = isMoved();
  const name    = S.file.path.split('/').pop();
  const msg     = $('cmsg').value.trim() ||
                  (moved ? 'Move ' + name + ' to ' + newPath : 'Update ' + name);

  busy(btn, true, 'Committing…');
  try {
    if (moved) {
      // A move is one commit that writes the new path and drops the old one. The
      // contents API can't express that — it only ever touches a single file — so
      // this goes through the tree plumbing, same as an upload.
      const c = await commitFiles([
        { path: newPath,     b64: b64encode(S.buffer) },
        { path: S.file.path, delete: true }
      ], msg);

      // Re-read the file at its new home so we hold the right blob sha.
      const f = await api.contents(S.repo.owner, S.repo.name, newPath, S.branch);
      S.file = { path: f.path, sha: f.sha, text: S.buffer, binary: false };

      closeSheet();
      paintPath(); paintStats(); paintRef(); refreshCommitBtn();
      toast('Moved · ' + c.sha.slice(0, 7));
      commitCleanup();
      if (alsoRun) await runDefaultWorkflow();

    } else {
      const b64 = b64encode(S.buffer);

      // The contents API refuses a body over about 1 MB, the same ceiling that
      // stops it reading one. Past that, commit through the tree plumbing — which
      // has no such limit, but also no sha lock, so a concurrent edit would be
      // silently overwritten. On a personal repo that trade is worth making; it
      // is the difference between saving the file and not.
      if (b64.length > 900000) {
        const c = await commitFiles([{ path: S.file.path, b64 }], msg);
        const f = await api.contents(S.repo.owner, S.repo.name, S.file.path, S.branch);
        S.file.sha  = f.sha;
        S.file.text = S.buffer;
        closeSheet();
        paintStats(); paintRef(); refreshCommitBtn();
        toast('Committed · ' + c.sha.slice(0, 7));
        commitCleanup();
        if (alsoRun) await runDefaultWorkflow();
        return;
      }

      const res = await api.putFile(S.repo.owner, S.repo.name, S.file.path, {
        message: msg,
        content: b64,
        sha:     S.file.sha,        // ← the lock
        branch:  S.branch
      });

      S.file.sha  = res.content.sha;
      S.file.text = S.buffer;

      closeSheet();
      paintStats(); paintRef(); refreshCommitBtn();
      toast('Committed · ' + res.commit.sha.slice(0, 7));
      commitCleanup();
      if (alsoRun) await runDefaultWorkflow();
    }
  } catch (e) {
    // Offline? Queue the write instead of losing it, and flush when back online.
    if (isOffline(e)) {
      await queueCommit({
        owner: S.repo.owner, name: S.repo.name, branch: S.branch,
        path: S.file.path, newPath: moved ? newPath : null,
        b64: b64encode(S.buffer), message: msg
      });
      // Optimistically update local state so the editor reflects the pending save.
      if (moved) S.file = { path: newPath, sha: S.file.sha, text: S.buffer, binary: false };
      else S.file.text = S.buffer;
      closeSheet();
      if (typeof paintPath === 'function') paintPath();
      paintStats(); paintRef(); refreshCommitBtn();
      toast('No connection — saved offline. It will commit when you are back online.', 6000);
      commitCleanup();
    } else {
      // GitHub blocks committing to .github/workflows/* unless the token carries
      // the Workflows permission — its own error is cryptic, so say it plainly.
      const isWorkflow = /(^|\/)\.github\/workflows\//.test(moved ? newPath : S.file.path);
      if (isWorkflow && e.status === 403) {
        toast('This is a GitHub Actions workflow file. Your token needs the Workflows permission (Read and write) to commit it.', 8000);
      } else {
        toast(e.message, 6000);
      }
    }
  } finally {
    busy(btn, false);
  }
}

/* ── Offline commit queue ─────────────────────────────────────────────────
   A commit made with no signal is not lost — it is stored on-device and
   replayed when the connection returns. The GitHub app just fails; this is the
   write half of the tree cache.
   ──────────────────────────────────────────────────────────────────────── */
const QUEUE_KEY = 'gitfile:queue';

function isOffline(e){
  return !navigator.onLine ||
    /failed to fetch|network|networkerror/i.test(e && e.message || '');
}

async function loadQueue(){
  try { return JSON.parse((await store.get(QUEUE_KEY)) || '[]'); }
  catch { return []; }
}
async function saveQueue(q){ await store.set(QUEUE_KEY, JSON.stringify(q)); }

async function queueCommit(item){
  const q = await loadQueue();
  q.push({ ...item, at: Date.now() });
  await saveQueue(q);
  paintQueueBadge();
}

/* Replay everything queued, oldest first. Stops on the first failure so items
   stay in order and nothing is dropped. */
async function flushQueue(silent){
  let q = await loadQueue();
  if (!q.length) { if (!silent) toast('Nothing queued.'); return; }
  if (!navigator.onLine) { if (!silent) toast('Still offline.'); return; }

  let done = 0;
  while (q.length) {
    const item = q[0];
    try {
      const entries = item.newPath
        ? [{ path: item.newPath, b64: item.b64 }, { path: item.path, delete: true }]
        : [{ path: item.path, b64: item.b64 }];
      // commitFiles targets the current repo/branch context, so set it for each.
      await commitFilesTo(item.owner, item.name, item.branch, entries, item.message);
      q.shift();
      await saveQueue(q);
      done++;
    } catch (e) {
      if (isOffline(e)) break;         // lost signal again — keep the rest queued
      // A real error (e.g. the file now conflicts): drop this one so it can't
      // block the queue forever, and tell the user.
      q.shift(); await saveQueue(q);
      toast('Skipped a queued change to ' + item.path + ': ' + e.message, 6000);
    }
  }
  paintQueueBadge();
  if (done && !silent) toast('Synced ' + done + ' queued change' + (done === 1 ? '' : 's') + '.');
  if (done) { paintQueueBadge(); if (S.view === 'tree') loadTree(S.path); }
}

/* A repo-explicit commit, so the queue can target repos other than the one
   currently open. Mirrors commitFiles but takes the coordinates directly. */
async function commitFilesTo(owner, name, branch, entries, message){
  const savedRepo = S.repo, savedBranch = S.branch;
  S.repo = { owner, name }; S.branch = branch;
  try { return await commitFiles(entries, message); }
  finally { S.repo = savedRepo; S.branch = savedBranch; }
}

function paintQueueBadge(){
  loadQueue().then(q => {
    const el = $('queuebadge');
    if (!el) return;
    el.style.display = q.length ? 'inline-flex' : 'none';
    el.textContent = q.length + ' queued';
  });
}

/* ── A line diff ──────────────────────────────────────────────────────────
   Longest common subsequence, then walk the table back. Fine for the sizes a
   phone editor deals with; a 3000-line file would make the table 9,000,000
   cells, so past that we don't pretend.
   ──────────────────────────────────────────────────────────────────────── */
function diffLines(before, after){
  const A = before.split('\n'), B = after.split('\n');

  if (A.length > 3000 || B.length > 3000) {
    return { added:0, removed:0,
             html:'<div class="gap">Too large to diff on a phone.</div>' };
  }

  // lcs[i][j] = length of the longest common subsequence of A[i..] and B[j..]
  const lcs = Array.from({ length: A.length + 1 }, () => new Uint32Array(B.length + 1));
  for (let i = A.length - 1; i >= 0; i--) {
    for (let j = B.length - 1; j >= 0; j--) {
      lcs[i][j] = A[i] === B[j] ? lcs[i + 1][j + 1] + 1
                                : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
  }

  const rows = [];
  let i = 0, j = 0, added = 0, removed = 0;
  while (i < A.length && j < B.length) {
    if (A[i] === B[j])                   { rows.push(['ctx', A[i]]); i++; j++; }
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) { rows.push(['del', A[i]]); i++; removed++; }
    else                                 { rows.push(['add', B[j]]); j++; added++; }
  }
  while (i < A.length) { rows.push(['del', A[i++]]); removed++; }
  while (j < B.length) { rows.push(['add', B[j++]]); added++; }

  // Collapse long stretches of unchanged lines — nobody scrolls through those.
  const html = [];
  let run = 0;
  rows.forEach((row, k) => {
    if (row[0] === 'ctx') {
      run++;
      const nearChange = rows.slice(Math.max(0, k - 3), k + 4).some(r => r[0] !== 'ctx');
      if (!nearChange) { if (run === 4) html.push('<div class="gap">⋯</div>'); return; }
    } else run = 0;
    html.push(`<div class="${row[0]}">${esc(row[1]) || '&nbsp;'}</div>`);
  });

  return { added, removed, html: html.join('') };
}

const esc = t => String(t).replace(/[&<>"]/g, c =>

async function gotoFileLoad(){
    const cacheKey = S.repo.owner + '/' + S.repo.name + ':' + S.branch;
    if (!GOTO_FILES || GOTO_FILES.key !== cacheKey) {
      try {
        const t = await api.tree(S.repo.owner, S.repo.name, S.branch);
        GOTO_FILES = { key: cacheKey, files: t.tree.filter(n => n.type === 'blob').map(n => n.path) };
      } catch (e) {
        if ($('gf-list')) $('gf-list').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        return;
      }
    }
    if (!$('gf-q')) return;   // sheet closed before the tree arrived

    const paint = () => {
      const q = $('gf-q').value.trim().toLowerCase();
      const files = q ? rankFiles(GOTO_FILES.files, q) : GOTO_FILES.files.slice(0, 50);

      if (!files.length) { $('gf-list').innerHTML = '<div class="empty">No match.</div>'; return; }

      $('gf-list').innerHTML = `<div class="filebox">${files.slice(0, 50).map((path, i) => `
        <button class="rowmain" data-i="${i}" style="width:100%;border-top:1px solid var(--border)">
          <span class="glyph ${fileClass(path.split('/').pop())}">${fileGlyph({ type:'file', name:path })}</span>
          <span class="body" style="flex:1;min-width:0">
            <span class="name">${esc(path.split('/').pop())}</span>
            <span class="sub" style="display:block;color:var(--fg-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(path)}</span>
          </span>
        </button>`).join('')}</div>`;

      $('gf-list').querySelectorAll('[data-i]').forEach(b => {
        b.onclick = () => { closeSheet(); openFile(files[Number(b.dataset.i)]); };
      });
    };

    $('gf-q').addEventListener('input', paint);
    paint();
    setTimeout(() => { if ($('gf-q')) $('gf-q').focus(); }, 60);
}

/* Subsequence match with a light score: matches where the query hits the file
   name (not just the folder path) rank first, then shorter paths. */
function rankFiles(files, q){
  const scored = [];
  for (const path of files) {
    const lower = path.toLowerCase();
    if (!isSubsequence(q, lower)) continue;
    const name = path.split('/').pop().toLowerCase();
    let score = 0;
    if (name.includes(q)) score += 100;          // contiguous hit in the name
    else if (lower.includes(q)) score += 50;     // contiguous somewhere
    if (name.startsWith(q)) score += 50;
    score -= path.length * 0.1;                   // prefer shorter paths
    scored.push({ path, score });
  }
  return scored.sort((a, b) => b.score - a.score).map(x => x.path);
}

/* Are all of q's characters present in text, in order? "mainjava" ⊂ "…/MainActivity.java". */
function isSubsequence(q, text){
  let i = 0;
  for (let j = 0; j < text.length && i < q.length; j++)
    if (text[j] === q[i]) i++;
  return i === q.length;
}

const ago = iso => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600)  return Math.round(s / 60) + 'm';
  if (s < 86400) return Math.round(s / 3600) + 'h';
  if (s < 2592000) return Math.round(s / 86400) + 'd';
  return new Date(iso).toISOString().slice(0, 10);
};

/* ── History ─────────────────────────────────────────────────────────── */
async function openLog(path){
  show('log');
  const v = $('v-log');
  v.innerHTML = '<div class="empty">Loading…</div>';
  setBar([{ label:'Back', onClick:() => path ? openFile(path) : loadTree(S.path), solid:true }]);

  try {
    const cs = await api.commits(S.repo.owner, S.repo.name, S.branch, path);
    if (!cs.length) { v.innerHTML = '<div class="empty">No commits.</div>'; return; }

    v.innerHTML = `<h1>${path ? path.split('/').pop() : S.branch}</h1>`;
    cs.forEach(c => {
      const b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = `
        <span class="glyph">${c.sha.slice(0, 2)}</span>
        <span class="name">${esc(c.commit.message.split('\n')[0])}</span>
        <span class="meta">${ago(c.commit.author.date)}</span>`;
      b.onclick = () => openCommit(c.sha, () => openLog(path));
      v.appendChild(b);
    });
  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ── One commit, with its diff ────────────────────────────────────────────
   GitHub returns a unified-diff patch per file on the commit endpoint. This is
   the last screen that used to kick you out to the browser; now the diff renders
   in place, coloured the same as the editor's commit diff.
   ──────────────────────────────────────────────────────────────────────── */
async function openCommit(sha, backTo){
  show('commit');
  const v = $('v-commit');
  v.innerHTML = '<div class="empty">Loading…</div>';
  setBar([{ label:'Back', onClick: backTo || (() => openLog(null)), solid:true }]);

  try {
    const c = await api.commitFull(S.repo.owner, S.repo.name, sha);
    S.commit = c;

    const files = c.files || [];
    const add = files.reduce((n, f) => n + (f.additions || 0), 0);
    const del = files.reduce((n, f) => n + (f.deletions || 0), 0);

    v.innerHTML = `
      <div class="commitmeta">
        <div class="msg">${esc(c.commit.message.split('\n')[0])}</div>
        <div class="by">${esc(c.author ? c.author.login : c.commit.author.name)} · ${ago(c.commit.author.date)} · <span class="mono">${c.sha.slice(0, 7)}</span></div>
        <div class="diffstat"><span class="a">+${add}</span> <span class="d">−${del}</span> across ${files.length} file${files.length === 1 ? '' : 's'}</div>
      </div>
      ${files.map((f, i) => renderPatch(f, i)).join('')}`;

    setBar([
      { label:'Back',   onClick: backTo || (() => openLog(null)) },
      { label:'Revert', onClick: () => revertCommit(c), grow:true },
      { label:'GitHub', onClick: () => (window.Native ? window.Native.openUrl(c.html_url) : window.open(c.html_url, '_blank')), solid:true }
    ]);
  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* Turn a GitHub file patch into coloured diff lines. The patch is standard
   unified-diff text: @@ hunks, +added, -removed, space=context. */
function renderPatch(f, i){
  const head = `
    <div class="filediff">
      <div class="fdhead">
        <span class="fdname">${esc(f.filename)}</span>
        <span class="fdstat"><span class="a">+${f.additions}</span> <span class="d">−${f.deletions}</span></span>
      </div>`;

  if (f.status === 'renamed' && !f.patch)
    return head + `<div class="fdnote">Renamed from ${esc(f.previous_filename)}</div></div>`;
  if (!f.patch)
    return head + `<div class="fdnote">${esc(f.status)} · binary or too large to show</div></div>`;

  const rows = f.patch.split('\n').map(line => {
    const c = line[0];
    const cls = c === '+' ? 'add' : c === '-' ? 'del' : c === '@' ? 'gap' : 'ctx';
    return `<div class="${cls}">${esc(line) || '&nbsp;'}</div>`;
  }).join('');

  return head + `<div class="diff">${rows}</div></div>`;
}

/* Revert: put every file in the commit back to how it was in the parent, as one
   new commit. GitHub has no one-click revert API for a plain commit, so we
   rebuild the previous state and commit it — which is exactly what a revert is. */
async function revertCommit(c){
  const files = (c.files || []).filter(f => f.status !== 'removed' || true);
  if (!files.length) { toast('Nothing to revert.'); return; }

  sheet('Revert commit', `
    <div class="overwrite">
      Undo <b>${esc(c.commit.message.split('\n')[0])}</b><br>
      ${c.sha.slice(0, 7)} · ${files.length} file${files.length === 1 ? '' : 's'}
    </div>
    <p class="hint" style="margin-bottom:16px">
      This makes a new commit restoring these files to how they were just before
      this one. The history is kept — nothing is erased.
    </p>
    <button class="btn danger wide" id="rv-go">Revert as a new commit</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('rv-go').onclick = async () => {
      const btn = $('rv-go');
      busy(btn, true, 'Reverting…');
      try {
        const parent = await api.commitParent(S.repo.owner, S.repo.name, c.sha);
        const changes = [];

        for (const f of c.files || []) {
          if (f.status === 'added') {
            // It was created by this commit — reverting means deleting it.
            changes.push({ path: f.filename, delete: true });
          } else {
            // Fetch the parent's version and restore it.
            if (!parent) throw new Error('This is the first commit; nothing to revert to.');
            try {
              const prev = await api.contents(S.repo.owner, S.repo.name, f.filename, parent);
              const b64 = prev.content ? prev.content.replace(/\n/g, '')
                        : b64encode(b64decode((await api.blob(S.repo.owner, S.repo.name, prev.sha)).content));
              changes.push({ path: f.filename, b64 });
            } catch {
              changes.push({ path: f.filename, delete: true });
            }
          }
        }

        await commitFiles(changes, 'Revert "' + c.commit.message.split('\n')[0] + '"');
        closeSheet();
        toast('Reverted in a new commit');
        openLog(null);
      } catch (e) {
        toast(e.message, 6000);
        busy(btn, false);
      }
    };
  });
}

/* ── Code search ─────────────────────────────────────────────────────── */
function openSearch(){
  show('search');
  setBar([{ label:'Back', onClick:() => loadTree(S.path), solid:true }]);
  $('results').innerHTML = '<div class="empty">Type to search.</div>';
  setTimeout(() => $('q').focus(), 60);
}

$('q').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

async function runSearch(){
  const q = $('q').value.trim();
  if (!q) return;

  const box = $('results');
  box.innerHTML = '<div class="empty">Searching…</div>';

  try {
    const res = await api.search(S.repo.owner, S.repo.name, q);
    if (!res.items.length) {
      box.innerHTML = '<div class="empty">Nothing found.<br><br>' +
        'GitHub indexes code lazily — a repository created minutes ago may not be searchable yet.</div>';
      return;
    }
    box.innerHTML = '';
    res.items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = `
        <span class="glyph">·</span>
        <span class="name">${esc(it.path)}</span>`;
      b.onclick = () => openFile(it.path);
      box.appendChild(b);
    });
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ── Actions ─────────────────────────────────────────────────────────── */
async function openActions(status){
  show('actions');
  S.runFilter = status || '';
  const v = $('v-actions');
  v.innerHTML = '<div class="empty">Loading…</div>';
  const actBar = [{ label:'Back', onClick:() => loadTree(S.path), solid:!S.canPush, grow:!S.canPush }];
  if (S.canPush) {
    actBar.push({ label:'Caches', onClick:cachesSheet });
    actBar.push({ label:'Run',    onClick:runSheet, solid:true, grow:true });
  }
  setBar(actBar);

  try {
    const { workflow_runs: runs } = await api.runs(S.repo.owner, S.repo.name, S.runFilter);

    // Status filter tabs, GitHub-style.
    const tabs = [['','All'], ['completed','Completed'], ['in_progress','Running'], ['queued','Queued']];
    let html = `<div class="statetabs">${tabs.map(([k, label]) =>
      `<button class="${S.runFilter === k ? 'on' : ''}" data-f="${k}">${label}</button>`).join('')}</div>`;

    if (!runs.length) {
      v.innerHTML = html + '<div class="empty">No runs.</div>';
    } else {
      html += '<div class="filebox">';
      runs.forEach(r => {
        const cls = r.status !== 'completed' ? 'run-wait'
                  : r.conclusion === 'success' ? 'run-ok' : 'run-bad';
        const dur = r.run_started_at && r.updated_at
          ? runDuration(r.run_started_at, r.updated_at) : '';
        html += `
          <div class="row">
            <button class="rowmain" data-run="${r.id}">
              <span class="glyph ${cls}"></span>
              <span class="body" style="flex:1;min-width:0">
                <span class="name">${esc(r.name)} <span style="color:var(--fg-subtle)">#${r.run_number}</span></span>
                <span class="sub" style="display:block;color:var(--fg-muted);font-size:11px">
                  ${esc(r.head_branch)} · ${esc(r.actor ? r.actor.login : '')} · ${ago(r.created_at)}${dur ? ' · ' + dur : ''}
                </span>
              </span>
            </button>
            <button class="rowmenu" data-del="${r.id}" data-n="${r.run_number}" aria-label="Delete run">⋯</button>
          </div>`;
      });
      html += '</div>';
      v.innerHTML = html;
    }

    // wire the tabs
    v.querySelectorAll('.statetabs button').forEach(b =>
      b.onclick = () => openActions(b.dataset.f));
    // wire the rows and delete buttons
    v.querySelectorAll('[data-run]').forEach(b =>
      b.onclick = () => openRun(Number(b.dataset.run)));
    v.querySelectorAll('[data-del]').forEach(b =>
      b.onclick = () => deleteRunConfirm(Number(b.dataset.del), b.dataset.n));

  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function runDuration(a, b){
  const sec = Math.round((new Date(b) - new Date(a)) / 1000);
  if (sec < 0) return '';
  return sec < 60 ? sec + 's' : Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
}

function deleteRunConfirm(id, n){
  sheet('Delete run', `
    <div class="overwrite">Delete <b>run #${n}</b> and its logs? This cannot be undone.</div>
    <button class="btn danger wide" id="dr-go">Delete run #${n}</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('dr-go').onclick = async () => {
      try {
        await api.deleteRun(S.repo.owner, S.repo.name, id);
        closeSheet();
        toast('Deleted run #' + n);
        openActions(S.runFilter);
      } catch (e) {
        toast(e.status === 403 ? 'The token cannot delete runs. Actions must be read and write.' : e.message, 6000);
      }
    };
  });
}

/* ── Build caches ─────────────────────────────────────────────────────────
   Caches accumulate from every build and count against the repo's storage.
   This lists them with sizes and lets you clear them, individually or all.
   ──────────────────────────────────────────────────────────────────────── */
async function cachesSheet(){
  sheet('Build caches', '<div class="empty">Loading…</div>');
  try {
    const data = await api.caches(S.repo.owner, S.repo.name);
    const list = data.actions_caches || [];

    if (!list.length) {
      $('sheetbody').innerHTML = '<div class="empty">No caches. Nothing to clear.</div>';
      return;
    }

    const total = list.reduce((n, c) => n + (c.size_in_bytes || 0), 0);

    $('sheetbody').innerHTML = `
      <div class="overwrite">${list.length} cache${list.length === 1 ? '' : 's'} · ${bytes(total)} total</div>
      <div class="filebox">
        ${list.map((c, i) => `
          <div class="row">
            <span class="rowmain" style="flex:1">
              <span class="body" style="flex:1;min-width:0">
                <span class="name" style="font-size:13px">${esc(c.key.slice(0, 40))}</span>
                <span class="sub" style="display:block;color:var(--fg-muted);font-size:11px">${esc(c.ref.replace('refs/heads/', ''))} · ${bytes(c.size_in_bytes)}</span>
              </span>
            </span>
            <button class="rowmenu" data-cache="${c.id}" aria-label="Delete cache">${ICON_TRASH}</button>
          </div>`).join('')}
      </div>
      <button class="btn danger wide" id="ca-all">Clear all caches</button>
      <div style="height:10px"></div>
      <button class="btn wide" onclick="closeSheet()">Close</button>`;

    $('sheetbody').querySelectorAll('[data-cache]').forEach(b => {
      b.onclick = async () => {
        try {
          await api.deleteCache(S.repo.owner, S.repo.name, Number(b.dataset.cache));
          toast('Cache cleared');
          cachesSheet();
        } catch (e) { toast(e.message, 6000); }
      };
    });
    $('ca-all').onclick = async () => {
      if (!confirm('Clear all ' + list.length + ' caches?')) return;
      try {
        for (const c of list) await api.deleteCache(S.repo.owner, S.repo.name, c.id);
        toast('All caches cleared');
        cachesSheet();
      } catch (e) { toast(e.message, 6000); }
    };
  } catch (e) {
    $('sheetbody').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* Commit-and-run: fire the repo's workflow straight after a commit, then jump to
   the live run. The whole loop — edit, commit, build, watch — in one tap. */
async function runDefaultWorkflow(){
  try {
    const { workflows } = await api.workflows(S.repo.owner, S.repo.name);
    const active = workflows.filter(w => w.state === 'active');
    if (!active.length) { toast('Committed, but there is no workflow to run.'); return; }

    // Prefer one that looks like a build; otherwise the only one; otherwise ask.
    const build = active.find(w => /build|apk|release|ci/i.test(w.name + w.path));
    const w = build || (active.length === 1 ? active[0] : null);

    if (!w) { runSheet(); return; }   // several, none obviously "the build" — let them pick

    const before = Date.now();
    await api.dispatch(S.repo.owner, S.repo.name, w.id, S.branch);
    toast('Building ' + w.name + '…');
    const id = await findNewRun(w.id, before);
    if (id) openRun(id); else openActions();
  } catch (e) {
    toast(e.status === 403
      ? 'Committed. To run builds, the token needs Actions: read and write.'
      : 'Committed, but could not start the build: ' + e.message, 6000);
  }
}

/* ── Start a workflow ────────────────────────────────────────────────────
   The loop closes here: edit a file, commit it, run the build, watch the dot go
   green, tap through and install the APK — without leaving the app that is
   building itself.
   ──────────────────────────────────────────────────────────────────────── */
async function runSheet(){
  sheet('Run workflow', '<div class="empty">Loading…</div>');

  try {
    const { workflows } = await api.workflows(S.repo.owner, S.repo.name);
    const active = workflows.filter(w => w.state === 'active');

    if (!active.length) {
      $('sheetbody').innerHTML = '<div class="empty">No workflows in this repository.</div>';
      return;
    }

    $('sheetbody').innerHTML = `
      <div class="overwrite">Runs against <b>${S.branch}</b></div>
      <div class="sheetlist">
        ${active.map((w, i) => `
          <button id="w-${i}">${esc(w.name)}<small>${esc(w.path.replace('.github/workflows/', ''))}</small></button>
        `).join('')}
      </div>
      <button class="btn wide" onclick="closeSheet()">Cancel</button>`;

    active.forEach((w, i) => {
      $('w-' + i).onclick = async () => {
        const btn = $('w-' + i);
        busy(btn, true, 'Starting…');
        try {
          const before = Date.now();
          await api.dispatch(S.repo.owner, S.repo.name, w.id, S.branch);
          closeSheet();
          toast('Starting ' + w.name + '…');

          // The dispatch returns 204 the moment GitHub accepts the request — the
          // run itself does not exist yet. So poll for a run of this workflow that
          // did not exist a second ago, then open it.
          const id = await findNewRun(w.id, before);
          if (id) openRun(id);
          else { toast('Started, but the run has not appeared yet.'); openActions(); }

        } catch (e) {
          toast(e.status === 403
            ? 'The token cannot start workflows. Set Actions to read and write.'
            : e.status === 404
              ? 'This workflow has no workflow_dispatch trigger, so it cannot be started by hand.'
              : e.message, 6000);
          busy(btn, false);
        }
      };
    });
  } catch (e) {
    $('sheetbody').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* Wait for GitHub to actually create the run we just asked for. */
async function findNewRun(workflowId, since){
  for (let i = 0; i < 8; i++) {
    await sleep(1200);
    try {
      const { workflow_runs: runs } = await api.runs(S.repo.owner, S.repo.name);
      const mine = runs.find(r =>
        r.workflow_id === workflowId &&
        new Date(r.created_at).getTime() >= since - 10000);
      if (mine) return mine.id;
    } catch { /* keep waiting */ }
  }
  return null;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ── A run, live ──────────────────────────────────────────────────────────
   Every step of every job, updating in place while it runs, with the artifact
   dropping in at the bottom the moment it exists. This is the whole point: you
   commit from the app, build from the app, and install what the app built,
   without ever leaving it.
   ──────────────────────────────────────────────────────────────────────── */
function stopPoll(){
  if (S.poll) { clearTimeout(S.poll); S.poll = null; }
}

const STEP = {
  success:   ['done',  '●'],
  failure:   ['fail',  '×'],
  cancelled: ['fail',  '⊘'],
  skipped:   ['skip',  '–'],
  timed_out: ['fail',  '×']
};

function stepClass(st){
  if (st.status === 'in_progress') return ['live',  '◐'];
  if (st.status === 'queued')      return ['queue', '○'];
  return STEP[st.conclusion] || ['queue', '○'];
}

const secs = (a, b) => {
  if (!a) return '';
  const d = Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000);
  return d < 60 ? d + 's' : Math.floor(d / 60) + 'm ' + (d % 60) + 's';
};

async function openRun(id){
  S.runId = id;
  show('run');
  $('v-run').innerHTML = '<div class="empty">Loading…</div>';
  await tickRun();
}

async function tickRun(){
  // If the user navigated away, stop — do not keep polling a screen nobody is on.
  if (S.view !== 'run') { stopPoll(); return; }

  const o = S.repo.owner, r = S.repo.name, id = S.runId;

  try {
    const [run, { jobs }] = await Promise.all([
      api.run(o, r, id),
      api.runJobs(o, r, id)
    ]);

    const running = run.status !== 'completed';

    // Progress is real: how many steps have finished, out of how many exist.
    const steps = jobs.flatMap(j => j.steps || []);
    const done  = steps.filter(st => st.status === 'completed').length;
    const pct   = steps.length ? Math.round(done / steps.length * 100) : (running ? 5 : 100);

    const state = running
      ? ['wait', run.status === 'queued' ? 'Queued' : 'Running']
      : run.conclusion === 'success' ? ['ok', 'Succeeded'] : ['bad', capitalise(run.conclusion || 'Finished')];

    let html = `
      <div class="runhead">
        <div class="title">${esc(run.name)} <span style="color:var(--fg-muted);font-weight:400">#${run.run_number}</span></div>
        <div class="sub">${esc(run.head_branch)} · ${run.head_sha.slice(0, 7)} · ${ago(run.created_at)}</div>
        <div class="state ${state[0]}">${state[1]}${running ? ' · ' + secs(run.run_started_at) : ' in ' + secs(run.run_started_at, run.updated_at)}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="barstat"><span>${done}/${steps.length || '?'} steps</span><span>${pct}%</span></div>
      </div>`;

    jobs.forEach(j => {
      const [jc, jg] = stepClass(j);
      html += `
        <div class="jobbox">
          <button class="jhead" id="job-${j.id}">
            <span class="g ${jc === 'live' ? 'live' : ''}">${jg}</span>
            <span class="jn">${esc(j.name)}</span>
            <span class="when">${secs(j.started_at, j.completed_at)}</span>
            <span class="chev">log ›</span>
          </button>
          ${(j.steps || []).map(st => {
            const [c, g] = stepClass(st);
            return `<div class="step ${c}">
                      <span class="g">${g}</span>
                      <span class="n">${esc(st.name)}</span>
                      <span class="t">${secs(st.started_at, st.completed_at)}</span>
                    </div>`;
          }).join('')}
        </div>`;
    });

    // ── The artifact. It only exists once the run has finished. ────────────
    if (!running) {
      try {
        const { artifacts } = await api.artifacts(o, r, id);
        const live = artifacts.filter(a => !a.expired);
        if (live.length) {
          html += `
            <div class="artbox">
              <div class="ahead">Artifacts</div>
              ${live.map((a, i) => `
                <button class="art" id="art-${i}">
                  <span class="g"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M7.25 1.5v6.19L4.78 5.22 3.72 6.28 8 10.56l4.28-4.28-1.06-1.06-2.47 2.47V1.5zM3 12.25h10v1.5H3z"/></svg></span>
                  <span class="n">${esc(a.name)}</span>
                  <span class="s">${bytes(a.size_in_bytes)}</span>
                </button>`).join('')}
            </div>`;
        }
      } catch { /* Actions read permission may be missing; the run still shows */ }
    }

    $('v-run').innerHTML = html;

    jobs.forEach(j => {
      const el = $('job-' + j.id);
      if (el) el.onclick = () => openLogs(j);
    });

    // Artifacts download inside the app now. The fetch, the unzip and the install
    // all happen natively, because the download URL 302s to blob storage and blob
    // storage sends no CORS header — a WebView simply cannot follow it.
    if (!running) {
      try {
        const { artifacts } = await api.artifacts(o, r, id);
        const live = artifacts.filter(a => !a.expired);

        live.forEach((a, i) => {
          const el = $('art-' + i);
          if (!el) return;
          el.onclick = () => {
            if (!(window.Native && window.Native.download)) { window.open(run.html_url, '_blank'); return; }
            // An APK is for installing; anything else might be firmware worth flashing.
            const isApk = /\.apk$/i.test(a.name) || /apk/i.test(a.name);
            if (!isApk && flashAvailable()) artifactSheet(a);
            else downloadArtifact(a);
          };
        });

        // The build just went green while you were watching it. Do not make
        // someone who sat through a five-minute build then go hunting for the
        // file — offer it. Once per run: the poll would otherwise re-ask every
        // four seconds.
        if (run.conclusion === 'success' && live.length
            && !S.asked.has(id) && window.Native && window.Native.download) {
          S.asked.add(id);
          setTimeout(() => finishSheet(run, live[0]), 400);
        }
      } catch { /* the list already rendered; nothing to wire */ }
    }

    setBar([
      { label:'Back',   onClick:openActions },
      running
        ? { label:'Cancel', onClick:() => controlRun('cancel'), grow:true }
        : { label:'Re-run', onClick:() => controlRun('rerun'), grow:true },
      { label:'GitHub', onClick:() => window.Native
          ? window.Native.openUrl(run.html_url)
          : window.open(run.html_url, '_blank'), solid:true }
    ]);

    // Poll while it is alive. Four seconds is frequent enough to feel live and
    // slow enough that a ten-minute build costs 150 of the 5000 requests an hour.
    stopPoll();
    if (running) S.poll = setTimeout(tickRun, 4000);

  } catch (e) {
    stopPoll();
    $('v-run').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    setBar([{ label:'Back', onClick:openActions, solid:true }]);
  }
}

const capitalise = w => w.charAt(0).toUpperCase() + w.slice(1);

async function controlRun(what){
  try {
    if (what === 'cancel') {
      await api.cancelRun(S.repo.owner, S.repo.name, S.runId);
      toast('Cancelling…');
    } else {
      await api.rerun(S.repo.owner, S.repo.name, S.runId);
      toast('Re-running…');
    }
    setTimeout(tickRun, 1500);
  } catch (e) {
    toast(e.status === 403 ? 'The token cannot control workflows. Set Actions to read and write.' : e.message, 6000);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   RELEASES

   A GitHub release is three things bundled: a tag, a set of notes, and files.
   The page shows all three, plus the badges that tell you which release people
   should actually download.
   ═══════════════════════════════════════════════════════════════════════ */

async function openReleases(){
  show('releases');
  const v = $('v-releases');
  v.innerHTML = '<div class="empty">Loading…</div>';

  const relBar = [{ label:'Back', onClick:() => loadTree(S.path), solid:!S.canPush, grow:!S.canPush }];
  if (S.canPush) relBar.push({ label:'+ Release', onClick:newReleaseSheet, solid:true, grow:true });
  setBar(relBar);

  try {
    const rels = await api.releases(S.repo.owner, S.repo.name);
    if (!rels.length) {
      v.innerHTML = '<div class="empty">No releases yet.<br><br>A release turns a tag into something people can download.</div>';
      return;
    }

    // GitHub's "Latest" is the newest published, non-draft, non-prerelease one.
    const latest = rels.find(r => !r.draft && !r.prerelease);

    v.innerHTML = '';
    rels.forEach(r => {
      const card = document.createElement('div');
      card.className = 'rel';
      card.innerHTML = `
        <div class="tagline">
          <span class="tag">${esc(r.tag_name)}</span>
          ${r === latest             ? '<span class="badge latest">Latest</span>' : ''}
          ${r.prerelease             ? '<span class="badge pre">Pre-release</span>' : ''}
          ${r.draft                  ? '<span class="badge draft">Draft</span>' : ''}
        </div>
        <div class="title">${esc(r.name || r.tag_name)}</div>
        <div class="by">${esc(r.author ? r.author.login : '')} · ${
          r.published_at ? ago(r.published_at) : 'unpublished'
        } · ${r.assets.length} asset${r.assets.length === 1 ? '' : 's'}</div>`;
      card.onclick = () => openRelease(r.id);
      v.appendChild(card);
    });
  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ── One release, in full ─────────────────────────────────────────────── */
async function openRelease(id){
  show('release');
  const v = $('v-release');
  v.innerHTML = '<div class="empty">Loading…</div>';

  try {
    const r = await api.release(S.repo.owner, S.repo.name, id);
    S.rel = r;

    v.innerHTML = `
      <div class="rel">
        <div class="tagline">

        </div>
        <div class="title">${esc(r.name || r.tag_name)}</div>
        <div class="by">
          ${esc(r.author ? r.author.login : '')} released this
          ${r.published_at ? ago(r.published_at) + ' ago' : '(unpublished draft)'}
          · commit ${esc((r.target_commitish || '').slice(0, 7))}
        </div>
        ${r.body ? `<div class="notes md">${markdown(r.body)}</div>` : ''}
      </div>

      <div class="assets">
        <div class="ahead">Assets · ${r.assets.length + 2}</div>
        ${r.assets.map((a, i) => `

            <span class="n">${esc(a.name)}</span>
            <span class="dl">${a.download_count}↓</span>
            <span class="s">${bytes(a.size)}</span>
          </button>`).join('')}

        <!-- GitHub attaches these two to every release automatically. They are
             not in the assets array; they are generated from the tag. -->
        <button class="asset" id="as-zip">
          <span class="g"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M7.25 1.5v6.19L4.78 5.22 3.72 6.28 8 10.56l4.28-4.28-1.06-1.06-2.47 2.47V1.5zM3 12.25h10v1.5H3z"/></svg></span><span class="n">Source code (zip)</span><span class="s"></span>
        </button>
        <button class="asset" id="as-tar">
          <span class="g"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M7.25 1.5v6.19L4.78 5.22 3.72 6.28 8 10.56l4.28-4.28-1.06-1.06-2.47 2.47V1.5zM3 12.25h10v1.5H3z"/></svg></span><span class="n">Source code (tar.gz)</span><span class="s"></span>
        </button>

    const src = url => () => window.Native ? window.Native.openUrl(url) : window.open(url, '_blank');
    $('as-zip').onclick = src(r.zipball_url ? r.html_url.replace(/\/releases\/tag\/.*$/, '') + '/archive/refs/tags/' + r.tag_name + '.zip' : r.html_url);
    $('as-tar').onclick = src(r.html_url.replace(/\/releases\/tag\/.*$/, '') + '/archive/refs/tags/' + r.tag_name + '.tar.gz');

    const relDetail = [{ label:'Back', onClick:openReleases, solid:!S.canPush, grow:!S.canPush }];
    if (S.canPush) {

      relDetail.push({ label:'Attach', onClick:() => attachSheet(r), solid:true, grow:true });
    }

  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    setBar([{ label:'Back', onClick:openReleases, solid:true }]);
  }
}

/* ── An asset: download it, install it, or delete it ──────────────────── */
function assetSheet(a, r){
  sheet(a.name, `
    <div class="overwrite">
      ${bytes(a.size)} · downloaded ${a.download_count} time${a.download_count === 1 ? '' : 's'}<br>
      ${esc(a.content_type)}
    </div>
    <button class="btn solid wide" id="a-dl">Download</button>
    <div style="height:10px"></div>
    <div class="sheetlist">
      <button id="a-del" class="danger">Delete asset<small>Removes the file from this release</small></button>
    </div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('a-dl').onclick = () => {
      if (!window.Native || !window.Native.download) {
        window.open(a.browser_download_url, '_blank');
        return;
      }
      // An asset is the file itself, not a zip around it — hence unzip = false.
      // And it needs octet-stream, or GitHub returns the asset's JSON metadata.
      downloadNative({
        url: a.url,
        accept: 'application/octet-stream',
        name: a.name,
        unzip: false,
        size: a.size,
        label: a.name
      });
    };

    $('a-del').onclick = async () => {
      if (!confirm('Delete ' + a.name + ' from this release?')) return;
      try {
        await api.delAsset(S.repo.owner, S.repo.name, a.id);
        closeSheet();
        toast('Deleted ' + a.name);
        openRelease(r.id);
      } catch (e) { toast(e.message, 6000); }
    };
  });
}

/* ── Attach a file to a release ───────────────────────────────────────── */

async function takeAsset(files){
  const f = files[0];

  const r = S.attachTo;

  sheet('Attach', `
    <div class="overwrite"><b>${esc(f.name)}</b><br>${bytes(f.size)} → ${esc(r.tag_name)}</div>
    <div class="bar"><i id="abar" style="width:35%"></i></div>
    <div class="barstat"><span class="now" id="anow">Uploading…</span><span></span></div>
    <div style="height:16px"></div>
    <button class="btn wide" id="aclose">Close</button>
  `, () => { $('aclose').onclick = closeSheet; });

  window.onAssetUploaded = (name, err) => {

    if (err) { $('anow').textContent = err; return; }
    $('abar').style.width = '100%';
    $('anow').textContent = 'Attached ' + name;
    setTimeout(() => { closeSheet(); openRelease(r.id); }, 700);

  try {

async function doNewRelease(){
  const btn = $('rl-go');
  const tag = $('rl-tag').value.trim();
  if (!tag) { toast('A release needs a tag.'); return; }

  busy(btn, true, 'Publishing…');
  try {
    const rel = await api.makeRelease(S.repo.owner, S.repo.name, {
      tag_name:         tag,
      target_commitish: S.branch,
      name:             $('rl-name').value.trim() || tag,
      body:             $('rl-body').value,
      draft:            $('rl-draft').checked,
      prerelease:       $('rl-pre').checked,
      // GitHub writes the changelog from the commits since the last tag. It is
      // better at it than you will be at 11pm on a phone.
      generate_release_notes: $('rl-gen').checked
    });

    const files = S.relFiles || [];
    if (files.length) {
      // Hand off to the uploader, which swaps in its own progress sheet and
      // opens the release when every file is attached.
      await uploadAssets(rel, files);
    } else {
      closeSheet();
      toast('Released ' + tag);
      openRelease(rel.id);

  } catch (e) {
    toast(e.status === 422 ? 'That tag already has a release.' : e.message, 6000);
  } finally {
    busy(btn, false);
  }
}

/* ── Uploading release assets, with a real progress bar ───────────────────
   Assets go to uploads.github.com, whose cross-origin rules are unreliable in a
   browser — which is why the app ships a native uploader. So each file is tried
   two ways: first an XMLHttpRequest, because its upload.onprogress gives a true
   byte-level percentage; and if that is blocked, the native bridge, which has no
   per-byte signal but always gets through. Files upload one at a time so the bar
   reads cleanly and a big APK never has to share bandwidth.
   ──────────────────────────────────────────────────────────────────────── */
async function uploadAssets(rel, files){
  let done = 0;
  const total = files.length;

  sheet('Uploading', `
    <div class="overwrite">
      <b id="up-name">${esc(files[0].name)}</b><br>
      <span id="up-count">File 1 of ${total}</span> → ${esc(rel.tag_name)}
    </div>
    <div class="bar"><i id="up-bar" style="width:0%"></i></div>
    <div class="barstat">
      <span class="now" id="up-now">Starting…</span>
      <span id="up-pct">0%</span>
    </div>
    <div style="height:16px"></div>
    <div id="up-act"></div>
  `);

  // Overall percentage across the whole batch: whole files done, plus the
  // fraction of the file currently uploading.
  const paint = frac => {
    const pct = Math.min(100, Math.round(((done + frac) / total) * 100));
    if ($('up-bar')) $('up-bar').style.width = pct + '%';
    if ($('up-pct')) $('up-pct').textContent = pct + '%';
  };

  try {
    for (let i = 0; i < total; i++) {
      const f = files[i];
      if ($('up-name'))  $('up-name').textContent  = f.name;
      if ($('up-count')) $('up-count').textContent = 'File ' + (i + 1) + ' of ' + total;
      if ($('up-now'))   $('up-now').textContent   = 'Uploading ' + f.name;
      await uploadOneAsset(rel.upload_url, f, paint);
      done++;
      paint(0);
    }
    if ($('up-now')) $('up-now').textContent = total === 1 ? 'Uploaded' : 'Uploaded ' + total + ' files';
    S.relFiles = [];
    setTimeout(() => { closeSheet(); openRelease(rel.id); }, 700);
  } catch (e) {
    // The release itself already exists — only an asset failed. Let the user in.
    if ($('up-now')) $('up-now').textContent = e.message;
    if ($('up-act')) {
      $('up-act').innerHTML =
        `<button class="btn wide" id="up-view">The release was created — open it</button>`;
      $('up-view').onclick = () => { closeSheet(); openRelease(rel.id); };
    }
  }
}

/* Upload one file. Resolves when GitHub has it; onProgress(fraction 0..1) is
   called as the bytes go up (XHR path) or once at the end (native path). */
function uploadOneAsset(uploadUrl, file, onProgress){
  // upload_url is a URI template: ".../assets{?name,label}". Drop the template
  // and pass the name ourselves.
  const base = String(uploadUrl).replace(/\{[^}]*\}$/, '');
  const url  = base + '?name=' + encodeURIComponent(file.name);
  const type = file.type || 'application/octet-stream';

  return new Promise((resolve, reject) => {
    let settled = false;
    const finish = fn => { if (!settled) { settled = true; fn(); } };

    // Fallback: the native bridge the app already ships with.
    const native = () => {
      if (!window.Native || !window.Native.uploadAsset) {
        finish(() => reject(new Error('Upload blocked, and no native uploader available.')));
        return;
      }
      window.onAssetUploaded = (name, err) => {
        window.onAssetUploaded = null;
        if (err) finish(() => reject(new Error(err)));
        else     finish(() => { onProgress(1); resolve('native'); });
      };
      fileToB64(file)
        .then(b64 => window.Native.uploadAsset(uploadUrl, S.token, file.name, type, b64))
        .catch(e => finish(() => reject(e)));
    };

    // Preferred: XMLHttpRequest, for real byte-level progress.
    try {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Authorization', 'Bearer ' + S.token);
      xhr.setRequestHeader('Content-Type', type);
      xhr.setRequestHeader('Accept', 'application/vnd.github+json');
      xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload  = () => {
        if (xhr.status >= 200 && xhr.status < 300) finish(() => { onProgress(1); resolve('xhr'); });
        else native();   // rejected (e.g. 422 duplicate name) or an error body
      };
      xhr.onerror = () => native();   // almost always cross-origin being blocked
      xhr.send(file);                 // streams the File directly — no base64, no big buffer
    } catch (e) {
      native();
    }
  });
}

/* ── The build finished ───────────────────────────────────────────────────
   Install it, or keep it. Those are different things: the download lives in a
   cache that the next download wipes, so "install" and "save" are not the same
   choice wearing two hats.
   ──────────────────────────────────────────────────────────────────────── */
function finishSheet(run, artifact){
  const apk = /\.apk$/i.test(artifact.name) || /apk/i.test(artifact.name);

  sheet('Build succeeded', `
    <div class="overwrite">
      <b>${esc(run.name)} #${run.run_number}</b><br>
      ${esc(artifact.name)} · ${bytes(artifact.size_in_bytes)}<br>
      built in ${secs(run.run_started_at, run.updated_at)}
    </div>

    <p class="hint" style="margin:0 0 16px">What would you like to do with it?</p>

    ${apk ? `<button class="btn solid wide" id="fin-install">Install the APK</button>
             <div style="height:10px"></div>` : ''}
    ${!apk && flashAvailable() ? `<button class="btn solid wide" id="fin-flash">⚡ Flash to board</button>
             <div style="height:10px"></div>` : ''}
    <button class="btn wide" id="fin-save">Save to Downloads</button>
    <div style="height:10px"></div>
    <button class="btn wide" id="fin-no">Not now</button>
  `, () => {
    if ($('fin-flash')) $('fin-flash').onclick = () => { closeSheet(); flashPrepare(artifact); };
    const go = after => {
      closeSheet();
      downloadNative({
        url:    artifact.archive_download_url,
        accept: 'application/vnd.github+json',
        name:   artifact.name,
        unzip:  true,                  // every GitHub artifact is a zip
        size:   artifact.size_in_bytes,
        label:  artifact.name,
        after                          // 'install' | 'save' — skip the second ask
      });
    };

    if ($('fin-install')) $('fin-install').onclick = () => go('install');
    $('fin-save').onclick = () => go('save');
    $('fin-no').onclick   = closeSheet;
  });
}

/* ── Downloading an artifact ──────────────────────────────────────────────
   GitHub always wraps an artifact in a ZIP, even a single APK. Java pulls the
   APK out and hands it to Android's package installer, which is the last step
   that used to require leaving the app.
   ──────────────────────────────────────────────────────────────────────── */
const downloadArtifact = a => downloadNative({
  url:    a.archive_download_url,
  accept: 'application/vnd.github+json',
  name:   a.name,
  unzip:  true,                      // every GitHub artifact is a zip
  size:   a.size_in_bytes,
  label:  a.name
});

/* The cache is wiped on the next download, so installing and keeping a copy are
   genuinely different things — which is why the app asks rather than guessing. */
const installHint = () =>
  toast('Android will ask you to allow gitfile to install apps.', 6000);

function downloadNative(a){
  sheet('Download', `
    <div class="overwrite">
      <b>${esc(a.label)}</b><br>${bytes(a.size)}
    </div>
    <div class="bar"><i id="dbar"></i></div>
    <div class="barstat">
      <span class="now" id="dnow">Starting…</span>
      <span id="dpct">0%</span>
    </div>
    <div style="height:16px"></div>
    <div id="dact"></div>
    <button class="btn wide" id="dclose">Cancel</button>
  `, () => { $('dclose').onclick = closeSheet; });

  window.onDownloadProgress = pct => {
    const p = Number(pct);
    if ($('dbar')) { $('dbar').style.width = p + '%'; $('dpct').textContent = p + '%'; }
    if ($('dnow')) $('dnow').textContent = 'Downloading…';
  };

  window.onDownloadDone = (kind, path, name) => {
    if (!$('dbar')) return;                 // the sheet was closed mid-download

    $('dclose').textContent = 'Close';

    if (kind === 'apk') {
      $('dnow').textContent = name;

      // Told what to do already? Do it, and don't make them tap twice.
      if (a.after === 'install') { window.Native.install(path); installHint(); return; }
      if (a.after === 'save')    { window.Native.saveFile(path); return; }

      $('dact').innerHTML = `
        <button class="btn solid wide" id="dinstall">Install</button>
        <div style="height:10px"></div>
        <button class="btn wide" id="dsave">Save to Downloads</button>

      $('dinstall').onclick = () => { window.Native.install(path); installHint(); };
      $('dsave').onclick    = () => { window.Native.saveFile(path); $('dnow').textContent = 'Saving…'; };

      $('dnow').textContent = 'Saved to Downloads';

  };

/* ── Flashing an ESP board ─────────────────────────────────────────────────
   The build artifact is a zip of .bin files (bootloader, partition table, app).
   Instead of only saving it, we can push it straight onto a connected ESP over
   USB — the same job esptool does on a laptop. All the serial work is native
   (a WebView can't touch USB); this is just the wizard: pick the board, the
   chip, the baud, and which .bin goes to which offset, then watch it flash.
   ──────────────────────────────────────────────────────────────────────── */
let FL = {};

const flashAvailable = () => !!(window.Native && window.Native.prepareFlash);

/* Per-chip bootloader offset — the one default that actually varies by chip.
   ESP32/S2 keep it at 0x1000; the newer parts moved it to 0x0; a couple to 0x2000. */
function blOffset(chip){
  switch (chip) {
    case 'ESP32': case 'ESP32-S2': return '0x1000';
    case 'ESP32-C5': case 'ESP32-P4': return '0x2000';
    default: return '0x0';   // S3/C3/C6/H2/C2/C61/8266, and a sane 'auto' fallback
  }
}

/* Guess where a .bin belongs from its name. Everything here is editable after. */
function guessOffset(name, chip){
  const n = (name || '').toLowerCase();
  if (/boot[_-]?app0|ota[_-]?data|otadata/.test(n)) return '0xe000';
  if (/bootloader/.test(n))                          return blOffset(chip);
  if (/partition/.test(n))                           return '0x8000';
  if (/merged|combined|factory|flash[_-]?all/.test(n)) return '0x0';
  return '0x10000';   // the app image, by convention
}

/* Step 1 — download the artifact and let native pull the .bin files out of it. */
function flashPrepare(a){
  if (!flashAvailable()) { toast('Flashing needs the newest gitfile — update the app first.', 6000); return; }
  FL = { artifact: a };

  sheet('Preparing firmware', `
    <div class="overwrite"><b>${esc(a.name)}</b><br>${bytes(a.size_in_bytes)}</div>
    <div class="bar"><i id="fp-bar"></i></div>
    <div class="barstat"><span class="now" id="fp-now">Downloading…</span><span id="fp-pct">0%</span></div>
    <div style="height:16px"></div>
    <button class="btn wide" id="fp-cancel">Cancel</button>
  `, () => { $('fp-cancel').onclick = closeSheet; });

  window.onFlashPrepProgress = pct => {
    const p = Number(pct);
    if ($('fp-bar')) { $('fp-bar').style.width = p + '%'; $('fp-pct').textContent = p + '%'; }
  };
  window.onFlashFilesReady = json => {
    let files = [];
    try { files = JSON.parse(json); } catch { }
    flashWizard(files);
  };
  window.onFlashError = flashSimpleError;

  window.Native.prepareFlash(a.archive_download_url, S.token, 'application/vnd.github+json');
}

function flashSimpleError(msg){
  sheet('Couldn’t prepare firmware', `
    <div class="overwrite" style="color:var(--red)">${esc(msg)}</div>
    <div style="height:16px"></div>
    <button class="btn wide" id="fe-x">Close</button>
  `, () => { $('fe-x').onclick = closeSheet; });
}

/* Step 2 — the configuration wizard: board, chip, baud, options, file→offset. */
function flashWizard(files){
  FL.files = files;
  const chips = ['auto','ESP32','ESP32-S2','ESP32-S3','ESP32-C2','ESP32-C3',
                 'ESP32-C5','ESP32-C6','ESP32-C61','ESP32-H2','ESP32-P4','ESP8266'];
  const bauds = [115200, 230400, 460800, 921600];

  let devs = [];
  try { devs = JSON.parse(window.Native.listSerialDevices()); } catch { }
  FL.devs = devs;

  const chip0 = 'auto';
  const deviceHtml = devs.length ? `
    <div class="field">
      <label class="lbl" for="fl-dev">Board</label>
      <select id="fl-dev">
        ${devs.map(d => `<option value="${d.id}">${esc(d.name)}${d.hasPermission ? '' : ' (needs permission)'}</option>`).join('')}
      </select>
    </div>` : `
    <div class="overwrite" style="margin-bottom:16px">
      No board detected. Connect your ESP board with a USB-OTG cable, then tap Refresh.
    </div>`;

  const fileRows = files.map((f, i) => `
    <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border)">
      <label class="check" style="flex:none">
        <input type="checkbox" id="fl-inc-${i}" checked><span class="box"></span>
      </label>
      <div style="flex:1; min-width:0">
        <div style="font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(f.name)}</div>
        <div style="font-size:11px; color:var(--fg-muted)">${bytes(f.size)}</div>
      </div>
      <input type="text" id="fl-off-${i}" value="${guessOffset(f.name, chip0)}"
             inputmode="text" spellcheck="false"
             style="width:96px; flex:none; font-family:var(--mono); text-align:right">
    </div>`).join('');

  sheet('Flash to board', `
    ${deviceHtml}
    <div class="field">
      <label class="lbl" for="fl-chip">Chip type</label>
      <select id="fl-chip">${chips.map(c => `<option value="${c}">${c === 'auto' ? 'Auto-detect' : c}</option>`).join('')}</select>
    </div>
    <div class="field">
      <label class="lbl" for="fl-baud">Baud rate</label>
      <select id="fl-baud">${bauds.map(b => `<option value="${b}"${b === 115200 ? ' selected' : ''}>${b}</option>`).join('')}</select>
    </div>
    <label class="check" style="margin-bottom:10px">
      <input type="checkbox" id="fl-stub" checked><span class="box"></span>
      <span>High-speed mode <span style="color:var(--fg-muted); font-weight:400">(stub loader)</span></span>
    </label>
    <label class="check" style="margin-bottom:16px">
      <input type="checkbox" id="fl-comp" checked><span class="box"></span>
      <span>Compress <span style="color:var(--fg-muted); font-weight:400">(faster transfer)</span></span>
    </label>

    <div class="lbl" style="margin-bottom:4px">Files &amp; offsets</div>
    <div class="hint" style="margin:0 0 8px">Tick what to write, and where. Offsets are hex.</div>
    ${fileRows || '<div class="overwrite">No .bin files were found.</div>'}

    <div style="height:16px"></div>
    <button class="btn solid wide" id="fl-go"${devs.length ? '' : ' disabled'}>Flash</button>
    <div style="height:10px"></div>
    <button class="btn wide" id="fl-refresh">Refresh boards</button>
  `, () => {
    $('fl-refresh').onclick = () => flashWizard(FL.files);
    if ($('fl-go')) $('fl-go').onclick = flashDoFlash;
    // Re-guessing offsets when the chip changes only affects the bootloader row,
    // but recompute all so a fresh pick lines everything up; edit afterwards.
    $('fl-chip').onchange = () => {
      const chip = $('fl-chip').value;
      files.forEach((f, i) => { if ($('fl-off-' + i)) $('fl-off-' + i).value = guessOffset(f.name, chip); });
    };
  });
}

/* Step 3a — gather the config, get USB permission if needed, then flash. */
function flashDoFlash(){
  const dev = FL.devs.find(d => String(d.id) === $('fl-dev').value);
  if (!dev) { toast('Pick a board first.'); return; }

  const files = [];
  FL.files.forEach((f, i) => {
    if (!$('fl-inc-' + i).checked) return;
    const off = ($('fl-off-' + i).value || '').trim() || '0x0';
    files.push({ name: f.name, path: f.path, offset: off });
  });
  if (!files.length) { toast('Tick at least one file to flash.'); return; }

  FL.cfg = {
    deviceId: dev.id,
    chip:     $('fl-chip').value,
    baud:     Number($('fl-baud').value),
    stub:     $('fl-stub').checked,
    compress: $('fl-comp').checked,
    files
  };

  window.onUsbPermission = granted => {
    if (!granted) { toast('USB permission was denied.', 5000); return; }
    flashRun();
  };
  if (dev.hasPermission) flashRun();
  else window.Native.requestUsbPermission(dev.id);
}

function flashRun(){
  flashProgressSheet();
  window.Native.flash(JSON.stringify(FL.cfg));
}

/* Step 3b — live progress: overall bar, current file, and a scrolling log. */
function flashProgressSheet(){
  sheet('Flashing', `
    <div id="fl-stage" class="overwrite">Starting…</div>
    <div class="bar"><i id="fl-obar"></i></div>
    <div class="barstat"><span class="now" id="fl-fname">—</span><span id="fl-opct">0%</span></div>
    <pre id="fl-log" style="max-height:170px; overflow:auto; margin:14px 0 0;
         background:var(--inset); border-radius:var(--r); padding:8px 10px;
         font-family:var(--mono); font-size:11px; line-height:1.5; white-space:pre-wrap;
         color:var(--fg-muted)"></pre>
    <div style="height:12px"></div>
    <button class="btn wide danger" id="fl-cancel">Cancel</button>
  `, () => {
    $('fl-cancel').onclick = () => { if (window.Native.cancelFlash) window.Native.cancelFlash(); flog('Cancelling…'); };
  });

  const finishBtn = () => {
    const b = $('fl-cancel');
    if (!b) return;
    b.textContent = 'Close';
    b.classList.remove('danger');
    b.onclick = closeSheet;
  };

  window.onFlashStage = s => { if ($('fl-stage')) $('fl-stage').textContent = s; flog(s); };
  window.onFlashLog   = l => flog(l);
  window.onFlashProgress = (idx, name, sent, total, overall) => {
    if (!$('fl-obar')) return;
    const p = Number(overall);
    $('fl-obar').style.width = p + '%';
    $('fl-opct').textContent = p + '%';
    $('fl-fname').textContent = name;
  };
  window.onFlashDone = msg => {
    if ($('fl-obar')) { $('fl-obar').style.width = '100%'; $('fl-opct').textContent = '100%'; }
    if ($('fl-stage')) { $('fl-stage').textContent = '✓ ' + (msg || 'Done'); $('fl-stage').style.color = 'var(--green-fg)'; }
    flog(msg || 'Done');
    finishBtn();
  };
  window.onFlashError = msg => {
    if ($('fl-stage')) { $('fl-stage').textContent = 'Failed'; $('fl-stage').style.color = 'var(--red)'; }
    if ($('fl-obar')) $('fl-obar').style.background = 'var(--del-bg)';
    flog('Error: ' + msg);
    finishBtn();
  };
}

function flog(line){
  const el = $('fl-log');
  if (!el) return;
  el.textContent += (el.textContent ? '\n' : '') + line;
  el.scrollTop = el.scrollHeight;
}

/* Tapping an artifact that isn't an APK: flash it, or just download it. */
function artifactSheet(a){
  sheet('Artifact', `
    <div class="overwrite"><b>${esc(a.name)}</b><br>${bytes(a.size_in_bytes)}</div>
    <p class="hint" style="margin:0 0 16px">Flash it straight to a connected ESP board, or download it.</p>

/* ── Job logs ─────────────────────────────────────────────────────────────
   The run screen tells you WHICH step failed. This tells you why — which is the
   only reason you were leaving the app for the browser.

   The fetch happens natively: GitHub's log endpoint redirects to blob storage,
   and blob storage sends no CORS header, so the WebView cannot follow it.
   ──────────────────────────────────────────────────────────────────────── */
function openLogs(job){
  if (!window.Native || !window.Native.fetchLog) {
    toast('Logs need the app — the browser cannot fetch them.', 5000);
    return;
  }

  sheet('Log · ' + job.name, '<div class="empty">Fetching…</div>');

  window.onJobLog = (text, err) => {
    if (err) { $('sheetbody').innerHTML = `<div class="empty">${esc(err)}</div>`; return; }

    // Strip the leading ISO timestamp GitHub stamps on every line — it is the
    // same 28 characters over and over, and on a phone it costs half the width.
    const clean = text
      .split('\n')
      .map(l => l.replace(/^\d{4}-\d\d-\d\dT[\d:.]+Z\s?/, ''))
      .join('\n')
      .replace(/\x1b\[[0-9;]*m/g, '');          // and the ANSI colour codes

    $('sheetbody').innerHTML = `
      <pre class="log">${esc(clean)}</pre>
      <button class="btn wide" onclick="closeSheet()">Close</button>`;

    // The end of a log is the part you came for.
    const el = $('sheetbody').querySelector('.log');
    el.scrollTop = el.scrollHeight;
  };

  window.Native.fetchLog(
    `${API}/repos/${S.repo.owner}/${S.repo.name}/actions/jobs/${job.id}/logs`,
    S.token,
    'onJobLog');
}

/* Export the current branch as a .zip. The native downloader carries the token
   and follows GitHub's redirect; in a plain browser we open the web archive. */
function exportZip(){
  const o = S.repo.owner, r = S.repo.name, ref = S.branch;
  const name = r + '-' + ref + '.zip';
  if (window.Native && window.Native.download) {
    downloadNative({
      url: 'https://api.github.com/repos/' + o + '/' + r + '/zipball/' + encodeURIComponent(ref),
      accept: 'application/zip', name, unzip: false, size: 0, label: name
    });
  } else {
    const web = 'https://github.com/' + o + '/' + r + '/archive/refs/heads/' + encodeURIComponent(ref) + '.zip';
    window.open(web, '_blank');
  }
  toast('Downloading ' + name + '…');
}

function wireSettings(R){
  const o = S.repo.owner, r = S.repo.name;

  $('set-rename').onclick = async () => {
    const name = $('set-name').value.trim();
    if (!name || name === R.name) return;
    if (!confirm('Rename to ' + name + '? Links to the old name will redirect.')) return;
    try {
      const up = await api.patchRepo(o, r, { name });
      toast('Renamed to ' + up.name);
      // The repo's name changed underneath us; reopen it fresh.
      S.repo.name = up.name;
      openSettings();
    } catch (e) { toast(e.message, 6000); }
  };

  $('set-descsave').onclick = async () => {
    try { await api.patchRepo(o, r, { description: $('set-desc').value }); toast('Saved'); }
    catch (e) { toast(e.message, 6000); }

  $('set-branch').onchange = async (e) => {

      catch (err) { e.target.checked = !e.target.checked; toast(err.message, 6000); }

  feature('set-wiki',     'has_wiki');

  $('set-vis').onclick = doToggleVisibility;

  $('set-archive').onclick = async () => {
    const to = !R.archived;

    try { await api.patchRepo(o, r, { archived: to }); toast(to ? 'Archived' : 'Unarchived'); openSettings(); }
    catch (e) { toast(e.message, 6000); }
  };

  // Delete demands the full name typed out, exactly as GitHub does — it is the
  // one action here with no undo.

    sheet('Delete repository', `

        }

async function openIssues(state){
  // Guard against a click event arriving here as the argument — an onclick
  // handler passes the event as arg 0, and "state=[object PointerEvent]" is a
  // 422 from GitHub. Only 'open' or 'closed' are ever valid.
  state = (state === 'closed') ? 'closed' : 'open';
  S.issueState = state;
  show('issues');

  const v = $('v-issues');
  v.innerHTML = `
    <div class="statetabs">
      <button id="is-open"   class="${state === 'open'   ? 'on' : ''}">Open</button>
      <button id="is-closed" class="${state === 'closed' ? 'on' : ''}">Closed</button>
    </div>
    <div class="filebox"><div id="isslist"><div class="empty">Loading…</div></div></div>`;

  $('is-open').onclick   = () => openIssues('open');
  $('is-closed').onclick = () => openIssues('closed');   // event never reaches the arg

  const issBar = [{ label:'Back', onClick:() => loadTree(S.path), solid:!S.canPush, grow:!S.canPush }];
  if (S.canPush) issBar.push({ label:'New issue', onClick:newIssueSheet, solid:true, grow:true });
  setBar(issBar);

  try {
    const all = await api.issues(S.repo.owner, S.repo.name, state);
    // GitHub's issues endpoint includes pull requests. Drop them — they have
    // their own tab, and counting them here would be misleading.
    const issues = all.filter(i => !i.pull_request);

    const list = $('isslist');
    if (!issues.length) { list.innerHTML = `<div class="empty">No ${state} issues.</div>`; return; }

    list.innerHTML = '';
    issues.forEach(i => {
      const b = document.createElement('button');
      b.className = 'issrow';
      b.innerHTML = `
        <span class="ic ${i.state}">${i.state === 'open' ? '◉' : '⊘'}</span>
        <span class="body">
          <span class="t">${esc(i.title)}</span>
          <span class="sub">#${i.number} · ${esc(i.user.login)} · ${ago(i.created_at)}${
            i.comments ? ' · ' + i.comments + ' comment' + (i.comments === 1 ? '' : 's') : ''
          }</span>
        </span>`;
      b.onclick = () => openIssue(i.number);
      list.appendChild(b);
    });
  } catch (e) {
    $('isslist').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ── PR files & per-line comments ─────────────────────────────────────────
   Show the PR's diff, and let a tap on any line leave a review comment there.
   The tricky part is turning a unified-diff patch back into real line numbers:
   each hunk header @@ -a,b +c,d @@ resets the old/new counters, then + advances
   the new side, - the old side, and context both. */
async function openPRFiles(pr){
  show('prfiles');
  const v = $('v-prfiles');
  v.innerHTML = '<div class="empty">Loading…</div>';
  setBar([{ label:'Back', onClick: openPRs, solid:true }]);
  try {
    const files = await api.prFiles(S.repo.owner, S.repo.name, pr.number);
    S.prCtx = { number: pr.number, commit_id: pr.head.sha };
    if (!files.length) { v.innerHTML = '<div class="empty">No changed files.</div>'; return; }
    v.innerHTML = `<h1>#${pr.number} · Files</h1>
      <p class="hint" style="margin-top:-8px">Tap any changed line to comment on it.</p>`
      + files.map(renderPRPatch).join('');
    v.querySelectorAll('.cline').forEach(el => el.onclick = () =>
      prCommentSheet(el.dataset.path, +el.dataset.line, el.dataset.side));
  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderPRPatch(f){
  const head = `
    <div class="filediff">
      <div class="fdhead">
        <span class="fdname">${esc(f.filename)}</span>
        <span class="fdstat"><span class="a">+${f.additions}</span> <span class="d">−${f.deletions}</span></span>
      </div>`;
  if (!f.patch) return head + `<div class="fdnote">${esc(f.status)} · binary or too large to show</div></div>`;

  let oldLine = 0, newLine = 0;
  const rows = f.patch.split('\n').map(line => {
    const ch = line[0];
    if (ch === '@') {
      const m = /@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
      if (m) { oldLine = +m[1]; newLine = +m[2]; }
      return `<div class="gap">${esc(line) || '&nbsp;'}</div>`;
    }
    if (ch === '\\') return `<div class="ctx">${esc(line)}</div>`;   // "No newline at end of file"
    let side, ln, cls;
    if (ch === '+')      { side = 'RIGHT'; ln = newLine; cls = 'add'; newLine++; }
    else if (ch === '-') { side = 'LEFT';  ln = oldLine; cls = 'del'; oldLine++; }
    else                 { side = 'RIGHT'; ln = newLine; cls = 'ctx'; oldLine++; newLine++; }
    return `<div class="${cls} cline" data-path="${esc(f.filename)}" data-line="${ln}" data-side="${side}">${esc(line) || '&nbsp;'}</div>`;
  }).join('');

  return head + `<div class="diff">${rows}</div></div>`;
}

function prCommentSheet(path, line, side){
  sheet('Comment on line', `
    <div class="overwrite" style="margin-top:0"><span class="mono">${esc(path.split('/').pop())}:${line}</span></div>
    <div class="field"><textarea id="rc-body" rows="4" placeholder="Markdown"></textarea></div>
    <button class="btn solid wide" id="rc-go">Comment</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('rc-go').onclick = async () => {
      const body = $('rc-body').value.trim();
      if (!body) { toast('Write a comment first.'); return; }
      const btn = $('rc-go'); busy(btn, true, 'Posting…');
      try {
        await api.reviewComment(S.repo.owner, S.repo.name, S.prCtx.number, {
          body, commit_id: S.prCtx.commit_id, path, line, side
        });
        closeSheet(); toast('Comment posted');
      } catch (e) {
        busy(btn, false);
        toast(e.status === 422 ? 'GitHub rejected the comment — that line may not be part of the diff.' : e.message, 7000);
      }
    };
  });
}

/* ── PR review ────────────────────────────────────────────────────────────*/
function reviewSheet(pr, event){
  const titles = { APPROVE:'Approve', REQUEST_CHANGES:'Request changes', COMMENT:'Comment' };
  const needBody = event !== 'APPROVE';
  sheet(titles[event] + ' · #' + pr.number, `
