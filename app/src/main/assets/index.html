/* ── Recent repos, favorites, and an offline read cache ───────────────────*/
const FAV_KEY = 'gitfile:favorites';
const RECENT_KEY = 'gitfile:recents';
const FC_PREFIX = 'gitfile:fc:';
const FC_IDX = 'gitfile:fcidx';

async function loadRepoPrefs(){
  if (!S.favorites) { try { S.favorites = new Set(JSON.parse((await store.get(FAV_KEY)) || '[]')); } catch { S.favorites = new Set(); } }
  if (!S.recents)   { try { S.recents = JSON.parse((await store.get(RECENT_KEY)) || '[]'); } catch { S.recents = []; } }
}
async function pushRecent(fullName){
  await loadRepoPrefs();
  S.recents = [fullName, ...S.recents.filter(x => x !== fullName)].slice(0, 8);
  try { await store.set(RECENT_KEY, JSON.stringify(S.recents)); } catch {}
}
async function toggleFav(fullName){
  await loadRepoPrefs();
  if (S.favorites.has(fullName)) S.favorites.delete(fullName); else S.favorites.add(fullName);
  try { await store.set(FAV_KEY, JSON.stringify([...S.favorites])); } catch {}
}

// Offline read cache — keep the last handful of opened files viewable with no
// signal. Small LRU so storage never balloons.
function fcKey(path){ return FC_PREFIX + S.repo.owner + '/' + S.repo.name + ':' + S.branch + ':' + path; }
async function cacheFile(path, text, sha){
  if (text == null || text.length > 400000) return;    // skip very large files
  try {
    const k = fcKey(path);
    await store.set(k, JSON.stringify({ text, sha, ts: Date.now() }));
    let idx = [];
    try { idx = JSON.parse((await store.get(FC_IDX)) || '[]'); } catch {}
    idx = [k, ...idx.filter(x => x !== k)];
    while (idx.length > 20) { const drop = idx.pop(); try { await store.del(drop); } catch {} }
    await store.set(FC_IDX, JSON.stringify(idx));
  } catch {}
}
async function cachedFile(path){
  try { const raw = await store.get(fcKey(path)); return raw ? JSON.parse(raw) : null; } catch { return null; }
}

/* Star / pin icon used on repo rows. */
const ICON_STAR = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 1.6l1.8 3.9 4.2.5-3.1 2.9.8 4.2L8 11.9 4.3 13.6l.8-4.2-3.1-2.9 4.2-.5z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6.5 1.5h3l.5 1H13v1.4H3V2.5h3zM3.8 4.9h8.4l-.62 8.7a1 1 0 0 1-1 .93H5.42a1 1 0 0 1-1-.93z"/></svg>';

async function openRepos(){
  S.repo = null; S.file = null; S.path = '';
  paintRef();
  show('repos');
  setBar([
    { label:'Sign out', onClick:signOut },
    { label:'Search',   onClick:openAllSearch },
    { label:'Profile',  onClick:openProfile },
    { label:'New repo', onClick:newRepoSheet, solid:true, grow:true }
  ]);

  const list = $('repolist');
  list.innerHTML = '<div class="empty">Loading…</div>';

  try {
    await loadRepoPrefs();
    const repos = await api.repos();
    if (!repos.length) { list.innerHTML = '<div class="empty">No repositories this token can reach.<br>Check the token\'s repository access.</div>'; return; }

    list.innerHTML = '';
    const byName = {}; repos.forEach(r => byName[r.full_name] = r);

    const makeRow = r => {
      const row = document.createElement('div');
      row.className = 'row';

      const b = document.createElement('button');
      b.className = 'rowmain';
      b.innerHTML = `
        <span class="glyph">${r.private ? '▪' : '▫'}</span>
        <span class="name">${r.full_name}</span>
        ${r.private ? '<span class="tag">private</span>' : ''}
        <span class="meta">${r.default_branch}</span>`;
      b.onclick = () => openRepo({
        owner: r.owner.login,
        name: r.name,
        default_branch: r.default_branch,
        private: r.private
      });

      // Pin / favorite toggle.
      const fav = document.createElement('button');
      fav.className = 'rowpin' + (S.favorites.has(r.full_name) ? ' on' : '');
      fav.innerHTML = ICON_STAR;
      fav.setAttribute('aria-label', (S.favorites.has(r.full_name) ? 'Unpin ' : 'Pin ') + r.name);
      fav.onclick = async e => { e.stopPropagation(); await toggleFav(r.full_name); openRepos(); };

      // Delete opens the type-the-name confirmation — never deletes on tap.
      const del = document.createElement('button');
      del.className = 'rowmenu';
      del.innerHTML = ICON_TRASH;
      del.setAttribute('aria-label', 'Delete ' + r.name);
      del.onclick = e => { e.stopPropagation(); deleteRepoConfirm(r.owner.login, r.name); };

      row.appendChild(b);
      row.appendChild(fav);
      row.appendChild(del);
      return row;
    };

    const section = (title, items) => {
      if (!items.length) return;
      const h = document.createElement('div');
      h.className = 'listhead';
      h.textContent = title;
      list.appendChild(h);
      items.forEach(r => list.appendChild(makeRow(r)));
    };

    const pinned = [...S.favorites].map(fn => byName[fn]).filter(Boolean);
    const recent = (S.recents || []).map(fn => byName[fn])
      .filter(r => r && !S.favorites.has(r.full_name)).slice(0, 6);

    if (pinned.length || recent.length) {
      section('Pinned', pinned);
      section('Recent', recent);
      section('All repositories', repos);
    } else {
      repos.forEach(r => list.appendChild(makeRow(r)));
    }
  } catch (e) {
    list.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}


/* ── Cross-repo search ────────────────────────────────────────────────────
   GitHub makes you search one repo at a time. This searches everything you own
   in a single query — the "where did I put that" problem, solved for a phone.
   ──────────────────────────────────────────────────────────────────────── */
async function openAllSearch(){
  show('allsearch');
  const v = $('v-allsearch');
  v.innerHTML = `
    <h1 style="padding-left:0">Search all repositories</h1>
    <div class="field">
      <input type="text" id="as-q" placeholder="Function name, string, anything…"
             spellcheck="false" autocapitalize="off">
    </div>
    <div id="as-results"></div>`;
  setBar([{ label:'Back', onClick:openRepos, solid:true }]);

  const run = async () => {
    const q = $('as-q').value.trim();
    if (!q) return;
    const box = $('as-results');
    box.innerHTML = '<div class="empty">Searching every repo…</div>';
    try {
      const user = (S.me && S.me.login) || (await api.me()).login;
      const res = await api.searchAll(user, q);

      if (!res.items.length) { box.innerHTML = '<div class="empty">No matches. GitHub\'s index can lag for brand-new repos.</div>'; return; }

      box.innerHTML = `<div class="filebox">${res.items.map((it, i) => `
        <button class="rowmain" data-i="${i}" style="width:100%;border-top:1px solid var(--border)">
          <span class="glyph ${fileClass(it.name)}">${fileGlyph({ type:'file', name:it.name })}</span>
          <span class="body" style="flex:1;min-width:0">
            <span class="name">${esc(it.name)}</span>
            <span class="sub" style="display:block;color:var(--fg-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.repository.full_name)} · ${esc(it.path)}</span>
          </span>
        </button>`).join('')}</div>`;

      box.querySelectorAll('[data-i]').forEach(b => {
        b.onclick = () => {
          const it = res.items[Number(b.dataset.i)];
          // Jump into that repo and open the file.
          openRepo({
            owner: it.repository.owner.login,
            name: it.repository.name,
            default_branch: it.repository.default_branch || 'main',
            private: it.repository.private
          }).then(() => openFile(it.path).catch(() => toast('Opened the repo; could not open the file directly.')));
        };
      });
    } catch (e) {
      box.innerHTML = `<div class="empty">${esc(e.status === 403 ? 'Search is rate-limited (about 10/min). Wait a moment.' : e.message)}</div>`;
    }
  };

  $('as-q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  setTimeout(() => $('as-q').focus(), 60);
}

/* ── Discover: search every public repository, live ───────────────────────
   Results arrive as you type. GitHub's search API allows roughly 10 requests a
   minute, so this debounces hard (450ms), ignores queries under 2 characters,
   and drops stale responses — otherwise a fast typist would burn the whole
   budget in one word and get nothing but 403s. */
let DISC = { seq: 0, timer: null, mode: 'repos' };

async function openDiscover(){
  show('discover');
  const v = $('v-discover');
  v.innerHTML = `
    <h1 style="padding-left:0">Discover</h1>
    <div class="field">
      <input type="text" id="dc-q" placeholder="Search public repositories…"
             spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">
    </div>
    <div class="dctabs">
      <button class="dctab on" data-m="repos">Repositories</button>
      <button class="dctab" data-m="users">People</button>
      <button class="dctab" data-m="trending">Trending</button>
      <span class="dcstate" id="dc-state"></span>
    </div>
    <div class="dcfilters" id="dc-filters">
      <select id="dc-lang">
        <option value="">Any language</option>
        <option>JavaScript</option><option>TypeScript</option><option>Python</option>
        <option>Java</option><option>Kotlin</option><option>C</option><option>C++</option>
        <option>C#</option><option>Go</option><option>Rust</option><option>Ruby</option>
        <option>PHP</option><option>Swift</option><option>Dart</option><option>Shell</option>
        <option>HTML</option><option>CSS</option>
      </select>
      <select id="dc-stars">
        <option value="">Any stars</option>
        <option value="10">10+ stars</option>
        <option value="100">100+ stars</option>
        <option value="1000">1k+ stars</option>
        <option value="10000">10k+ stars</option>
      </select>
      <select id="dc-sort">
        <option value="stars">Most stars</option>
        <option value="updated">Recently updated</option>
        <option value="forks">Most forks</option>
        <option value="">Best match</option>
      </select>
    </div>
    <div id="dc-results"><div class="empty">Start typing to search all of GitHub.</div></div>`;
  setBar([{ label:'Back', onClick:openRepos, solid:true }]);

  v.querySelectorAll('.dctab').forEach(t => t.onclick = () => {
    v.querySelectorAll('.dctab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    DISC.mode = t.dataset.m;
    // People search has no repo filters; Trending needs no query.
    $('dc-filters').style.display = DISC.mode === 'users' ? 'none' : 'flex';
    $('dc-q').placeholder = DISC.mode === 'users' ? 'Search people…'
                          : DISC.mode === 'trending' ? 'Optional: narrow trending…'
                          : 'Search public repositories…';
    runDiscover(true);
  });

  ['dc-lang', 'dc-stars', 'dc-sort'].forEach(id =>
    $(id).addEventListener('change', () => runDiscover(true)));

  $('dc-q').addEventListener('input', () => runDiscover(false));
  $('dc-q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runDiscover(true); } });
  setTimeout(() => $('dc-q').focus(), 60);
}

function runDiscover(now){
  clearTimeout(DISC.timer);
  const go = () => doDiscover();
  if (now) go(); else DISC.timer = setTimeout(go, 450);   // debounce while typing
  const q = ($('dc-q') || {}).value || '';
  if ($('dc-state')) $('dc-state').textContent =
    (DISC.mode === 'trending' || q.trim().length >= 2) ? 'searching…' : '';
}

async function doDiscover(){
  const box = $('dc-results'); if (!box) return;
  const q = $('dc-q').value.trim();
  const trending = DISC.mode === 'trending';

  // Trending works with no query at all; the other modes need something to go on.
  if (!trending && q.length < 2) {
    box.innerHTML = '<div class="empty">Start typing to search all of GitHub.</div>';
    if ($('dc-state')) $('dc-state').textContent = '';
    return;
  }
  const seq = ++DISC.seq;                      // stale-response guard
  try {
    let res;
    if (DISC.mode === 'users') {
      res = await api.searchUsers(q);
    } else {
      // Compose GitHub's search qualifiers from the filter row.
      const lang  = $('dc-lang')  ? $('dc-lang').value  : '';
      const stars = $('dc-stars') ? $('dc-stars').value : '';
      const sort  = $('dc-sort')  ? $('dc-sort').value  : 'stars';
      const parts = [];
      if (q) parts.push(q);
      if (lang) parts.push('language:"' + lang + '"');
      if (trending) {
        // "Trending" isn't an API — approximate it the way people do by hand:
        // repos pushed in the last week, ordered by stars.
        const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
        parts.push('pushed:>' + since);
        parts.push('stars:>' + (stars || 50));
      } else if (stars) {
        parts.push('stars:>=' + stars);
      }
      if (!parts.length) parts.push('stars:>1000');       // trending with no filters at all
      res = await api.searchRepos(parts.join(' '), trending ? 'stars' : sort);
    }
    if (seq !== DISC.seq) return;              // a newer query already went out
    if ($('dc-state')) $('dc-state').textContent = (res.total_count || 0).toLocaleString() + ' found';

    const items = res.items || [];
    if (!items.length) { box.innerHTML = '<div class="empty">Nothing matched.</div>'; return; }

    box.innerHTML = DISC.mode === 'users' ? renderPeople(items) : renderFoundRepos(items);

    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      const it = items[+b.dataset.i];
      if (DISC.mode === 'users') openUserRepos(it.login);
      else openRepo({
        owner: it.owner.login, name: it.name,
        default_branch: it.default_branch || 'main', private: it.private,
        permissions: it.permissions
      });
    });
  } catch (e) {
    if (seq !== DISC.seq) return;
    if ($('dc-state')) $('dc-state').textContent = '';
    box.innerHTML = `<div class="empty">${esc(e.status === 403
      ? 'GitHub limits search to about 10 requests a minute. Pause a moment and keep typing.'
      : e.message)}</div>`;
  }
}

function renderFoundRepos(items){
  const num = n => (n || 0).toLocaleString();
  return `<div class="filebox">${items.map((r, i) => `
    <button class="rowmain" data-i="${i}" style="width:100%;border-top:1px solid var(--border)">
      <span class="body" style="flex:1;min-width:0;text-align:left">
        <span class="name">${esc(r.full_name)}</span>
        ${r.description ? `<span class="sub" style="display:block;color:var(--fg-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.description)}</span>` : ''}
        <span class="sub" style="display:block;color:var(--fg-subtle);font-size:11px;font-family:var(--mono)">
          ${num(r.stargazers_count)} stars${r.language ? ' · ' + esc(r.language) : ''}${r.fork ? ' · fork' : ''}
        </span>
      </span>
    </button>`).join('')}</div>`;
}

function renderPeople(items){
  return `<div class="filebox">${items.map((u, i) => `
    <button class="rowmain" data-i="${i}" style="width:100%;border-top:1px solid var(--border)">
      <img src="${esc(u.avatar_url)}&s=64" alt="" class="contrib" style="width:28px;height:28px;margin-right:10px">
      <span class="body" style="flex:1;min-width:0;text-align:left">
        <span class="name">${esc(u.login)}</span>
        <span class="sub" style="display:block;color:var(--fg-subtle);font-size:11px">${esc(u.type || 'User')}</span>
      </span>
    </button>`).join('')}</div>`;
}

/* Browse one person's public repositories. */
async function openUserRepos(login){
  show('discover');
  const v = $('v-discover');
  v.innerHTML = `<h1 style="padding-left:0">${esc(login)}</h1><div class="empty">Loading…</div>`;
  setBar([{ label:'Back', onClick:openDiscover, solid:true }]);
  try {
    const repos = await api.userRepos(login);
    if (!repos.length) { v.innerHTML = `<h1 style="padding-left:0">${esc(login)}</h1><div class="empty">No public repositories.</div>`; return; }
    v.innerHTML = `<h1 style="padding-left:0">${esc(login)}</h1>` + renderFoundRepos(repos);
    v.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {

                 default_branch: r.default_branch || 'main', private: r.private });

  }
}

/* ═══════════════════════════════════════════════════════════════════════
   PROFILE

   The fields PATCH /user actually lets you change — name, bio, company,
   location, blog, and the two visible booleans. The parts of a GitHub profile
   that have NO write API (the contribution graph, followers, achievements,
   pinned repos, the avatar) are read-only everywhere, so they are shown as
   read-only here rather than pretended at.
   ═══════════════════════════════════════════════════════════════════════ */
async function openProfile(){

  const v = $('v-profile');
  v.innerHTML = '<div class="empty">Loading…</div>';

  try {
    const me = await api.me();
    S.me = me;

    v.innerHTML = `
      <div class="profhead">
        <img class="pavatar" src="${esc(me.avatar_url)}&s=120" alt="">
        <div>
          <div class="pname">${esc(me.name || me.login)}</div>
          <div class="plogin">@${esc(me.login)}</div>
        </div>
      </div>

      <div class="pstats">
        <span><b>${me.public_repos}</b> repos</span>
        <span><b>${me.followers}</b> followers</span>
        <span><b>${me.following}</b> following</span>
      </div>

      <div class="setgroup">
        <h2>Edit profile</h2>
        <div class="field"><label for="p-name">Name</label>
          <input type="text" id="p-name" value="${esc(me.name || '')}"></div>
        <div class="field"><label for="p-bio">Bio</label>
          <textarea id="p-bio" rows="3">${esc(me.bio || '')}</textarea></div>
        <div class="field"><label for="p-co">Company</label>
          <input type="text" id="p-co" value="${esc(me.company || '')}"></div>
        <div class="field"><label for="p-loc">Location</label>
          <input type="text" id="p-loc" value="${esc(me.location || '')}"></div>
        <div class="field"><label for="p-blog">Website</label>
          <input type="text" id="p-blog" value="${esc(me.blog || '')}" placeholder="https://"></div>
        <button class="btn solid wide" id="p-save">Save profile</button>
      </div>

      <div class="setgroup">
        <h2>Profile README</h2>
        <p class="hint" style="margin-bottom:12px">The card at the top of your profile is the README in your <b>${esc(me.login)}/${esc(me.login)}</b> repository.</p>
        <button class="btn wide" id="p-readme">Edit profile README</button>
      </div>

      <div class="setgroup">
        <h2>Starred</h2>
        <button class="btn wide" id="p-stars">Manage starred repositories</button>
      </div>

      <div class="setgroup">
        <h2>Token</h2>
        <div class="trow"><span class="tk">Type</span><span class="tv" id="tk-type">—</span></div>
        <div class="trow"><span class="tk">Access</span><span class="tv" id="tk-scope">—</span></div>
        <div class="trow"><span class="tk">Rate limit</span><span class="tv" id="tk-rate">—</span></div>
        <div style="height:14px"></div>
        <button class="btn wide" id="tk-manage">Manage on GitHub</button>
        <div style="height:10px"></div>
        <button class="btn wide" id="tk-replace">Replace token</button>
        <div style="height:10px"></div>
        <button class="btn wide danger" id="tk-out">Sign out</button>
      </div>

      <p class="hint" style="margin-top:8px">
        The contribution graph, followers, achievements and pinned repositories
        have no edit API — GitHub does not let any app change them. They are not
        shown here because they cannot be changed here.
      </p>`;

    $('p-save').onclick = async () => {
      const btn = $('p-save');
      busy(btn, true, 'Saving…');
      try {
        await api.patchMe({
          name:     $('p-name').value.trim(),
          bio:      $('p-bio').value.trim(),
          company:  $('p-co').value.trim(),
          location: $('p-loc').value.trim(),
          blog:     $('p-blog').value.trim()
        });
        toast('Profile saved');
      } catch (e) {
        toast(e.status === 403 ? 'This token cannot edit the profile. A fine-grained token needs the "Profile" user permission set to read and write.' : e.message, 7000);
      } finally { busy(btn, false); }
    };

    $('p-readme').onclick = () => {
      // The profile README is just a file in the user/user repo. Open that repo
      // and drop straight into its README.
      openRepo({ owner: me.login, name: me.login, default_branch: 'main', private: false })
        .then(() => openFile('README.md').catch(() => toast('No README.md yet — create one in this repo.')));
    };

    $('p-stars').onclick = starsSheet;

    // Token section.
    const tkn = S.token || '';
    const fine = tkn.startsWith('github_pat_');
    const kind = fine ? 'Fine-grained' : tkn.startsWith('ghp_') ? 'Classic' : 'Token';
    $('tk-type').textContent  = kind + (tkn ? ' · ends …' + tkn.slice(-4) : '');
    $('tk-scope').textContent = fine
      ? 'Permissions managed on GitHub'
      : (S.scopes ? S.scopes : 'classic token');
    $('tk-rate').textContent  = S.quota !== null ? S.quota + ' requests left this hour' : '—';

    $('tk-manage').onclick = () => {
      // Fine-grained and classic live on different settings pages.
      const url = tkn.startsWith('ghp_')
        ? 'https://github.com/settings/tokens'
        : 'https://github.com/settings/tokens?type=beta';
      window.Native ? window.Native.openUrl(url) : window.open(url, '_blank');
    };
    $('tk-replace').onclick = replaceTokenSheet;
    $('tk-out').onclick     = signOut;

  } catch (e) {
    v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* Swap the signed-in token for a new one — checked before it replaces the old
   one, so a bad paste can't lock you out. A new token clears any PIN lock. */
function replaceTokenSheet(){
  sheet('Replace token', `
    <p class="hint" style="margin-top:0">Paste a new GitHub token. It's verified before it replaces the current one.</p>
    <div class="field">
      <input type="text" id="rt-tok" placeholder="github_pat_… or ghp_…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <label class="check"><input type="checkbox" id="rt-remember" checked><span class="box"></span> Keep me signed in on this device</label>
    <div style="height:12px"></div>
    <button class="btn solid wide" id="rt-go">Replace</button>
    <div style="height:10px"></div>
    <button class="btn wide" onclick="closeSheet()">Cancel</button>
  `, () => {
    $('rt-go').onclick = async () => {
      const t = $('rt-tok').value.replace(/\s+/g, '');
      if (!t) { toast('Paste a token first.'); return; }
      const btn = $('rt-go'); busy(btn, true, 'Checking…');
      const prev = S.token;
      S.token = t;                                   // try the new token
      try {
        const me = await api.me();                   // validates it
        if ($('rt-remember').checked) { await store.set(TOKEN_KEY, t); }
        else { await store.del(TOKEN_KEY); }
        await store.del(LOCK_KEY);                    // a new token resets any PIN lock
        S.user = me; S.me = me;
        busy(btn, false); closeSheet();
        toast('Token replaced');
        openProfile();
      } catch (e) {
        S.token = prev;                              // revert on failure — stay signed in
        busy(btn, false);
        toast(e.status === 401 ? 'That token was rejected by GitHub.' : e.message, 6000);
      }
    };
  });
}
