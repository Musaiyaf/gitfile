pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.7.3'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // usb-serial-for-android (the USB-UART/CDC drivers the ESP flasher needs)
        // is published on JitPack, not Maven Central.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'gitfile'
include ':app'
